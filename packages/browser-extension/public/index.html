<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iterate</title>
    <style>
      :root {
        color: #18212a;
        background: #f6f4ef;
        font:
          13px Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        min-width: 280px;
      }
      main {
        display: grid;
        gap: 12px;
        padding: 16px;
        align-content: start;
      }
      header,
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: grid;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
      }
      .capability {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid #dcd8cf;
        border-radius: 8px;
        background: #eeece6;
      }
      .prompt {
        user-select: text;
        border: 1px solid #dcd8cf;
        border-radius: 6px;
        background: white;
        padding: 8px;
        line-height: 1.4;
      }
      code {
        overflow-wrap: anywhere;
        font-size: 11px;
      }
      input,
      button {
        border: 1px solid #c9c5bc;
        border-radius: 8px;
        font: inherit;
      }
      input {
        background: white;
        padding: 10px;
      }
      button {
        cursor: pointer;
        color: white;
        background: #18212a;
        padding: 8px 12px;
      }
      button.secondary {
        color: #18212a;
        background: transparent;
      }
      .muted {
        color: #5b6570;
      }
      .error {
        color: #a42121;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
