packages:
  - apps/os
  - apps/dash
  - apps/agents
  - apps/notes
  - apps/voice
  - apps/kit
  - apps/spa
  - apps/dummy-petshop
  - apps/ci-reports
  - apps/tunnels
  - packages/cli
  - packages/iterate
  - packages/shared
  - packages/ui
  - lint
  - scripts
catalogs:
  # One Cloudflare toolchain for every Worker in the repo: the Vite plugin, the wrangler it builds
  # and deploys with, and the runtime types.
  cloudflare:
    "@cloudflare/vite-plugin": 1.57.3
    "@cloudflare/workers-types": ^5.20260922.1
    wrangler: 4.136.3
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - miniflare
  - wrangler
  - workerd
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
  - "@cloudflare/unenv-preset"
  - "@cloudflare/vite-plugin"
  - "@cloudflare/workers-types"
  - "@cloudflare/workers-oauth-provider@1.0.0"
  - middlewright
  - trpc-cli
  - "@iterate-com/capnweb"
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - sharp
  - workerd
overrides:
  "@babel/parser": ^7.28.0
  "@codemirror/state": ^6.7.1
  "@codemirror/view": ^6.43.6
  "@material/web": 2.4.1
  axios: 1.13.6
  baseline-browser-mapping: ^2.9.14
  iterate>capnweb: npm:@iterate-com/capnweb@0.12.2
  # Match the Captun gateway's existing WebSocket-capable protocol build.
  captun>capnweb: npm:@iterate-com/capnweb@0.10.0
  '@iterate-com/agents>capnweb': npm:@iterate-com/capnweb@0.12.2
  os>capnweb: npm:@iterate-com/capnweb@0.12.2
  srvx: 0.11.12
  wrangler: "catalog:cloudflare"
  ws: 8.19.0
packageExtensions:
  lucide-react:
    peerDependencies:
      "@types/react": "*"
  streamdown:
    peerDependencies:
      "@types/react": "*"
patchedDependencies:
  zod@4.5.4: patches/zod@4.5.4.patch
