packages:
  - apps/os
  - apps/dash
  - apps/agents
  - apps/notes
  - apps/admin
  - apps/voice
  - apps/kit
  - apps/spa
  - apps/dummy-petshop
  - apps/ci-reports
  - packages/cli
  - packages/iterate
  - packages/shared
  - packages/ui
  - lint
  - scripts
# Every dependency two or more packages use is pinned here once and written `catalog:` in each
# package.json; a dependency only one package uses keeps its version in that package.json.
# catalogMode strict makes `pnpm add` write `catalog:` for a catalogued dependency and refuses any
# other version of it.
catalogMode: strict
cleanupUnusedCatalogs: true
catalog:
  # One Cloudflare toolchain for every Worker in the repo: the Vite plugin, the wrangler it builds
  # and deploys with, and the runtime types.
  "@cloudflare/vite-plugin": 1.60.1
  "@cloudflare/workers-types": ^5.20260925.1
  wrangler: 4.140.0

  "@codemirror/lang-json": ^6.0.2
  "@codemirror/lang-yaml": ^6.1.3
  "@codemirror/language": ^6.12.4
  "@codemirror/search": ^6.7.2
  "@codemirror/view": ^6.43.13
  "@fsegurai/codemirror-theme-bundle": ^6.4.4
  "@modelcontextprotocol/server": 2.1.0
  "@orpc/server": 1.15.4
  "@playwright/test": 1.63.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": 1.170.39
  "@tanstack/react-start": 1.168.58
  "@types/node": ^24.13.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/ws": ^8.18.1
  "@vitejs/plugin-react": ^6.1.1
  capnweb: npm:@iterate-com/capnweb@0.12.3
  cn: ^0.4.0
  codemirror: ^6.0.2
  esbuild: ^0.28.2
  json5: ^2.2.3
  lucide-react: ^1.48.0
  oauth4webapi: ^3.8.8
  pako: ^3.0.2
  react: ^19.3.0
  react-dom: ^19.3.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  trpc-cli: 0.16.0
  tsdown: 0.23.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  undici: ^8.11.2
  vite: ^8.3.0
  vitest: ^4.1.11
  ws: 8.21.3
  yaml: ^2.9.1
  zod: 4.6.5
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - miniflare
  - wrangler
  - workerd
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
  - "@cloudflare/unenv-preset"
  - "@cloudflare/vite-plugin"
  - "@cloudflare/workers-types"
  - "@cloudflare/workers-oauth-provider@1.0.0"
  - middlewright
  - trpc-cli
  - "@iterate-com/capnweb"
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - sharp
  - workerd
overrides:
  "@babel/parser": ^7.28.0
  "@codemirror/state": ^6.7.6
  "@codemirror/view": "catalog:"
  "@material/web": 2.4.1
  baseline-browser-mapping: ^2.9.14
  srvx: 0.11.12
  wrangler: "catalog:"
  ws: "catalog:"
packageExtensions:
  lucide-react:
    peerDependencies:
      "@types/react": "*"
  streamdown:
    peerDependencies:
      "@types/react": "*"
patchedDependencies:
  zod@4.6.5: patches/zod@4.6.5.patch
