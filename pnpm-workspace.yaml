packages:
  - apps/os
  - apps/semaphore
  - apps/*
  - packages/*
  - lint
  - scripts

catalogs:
  cloudflare:
    '@cloudflare/unenv-preset': ^2.16.0
    '@cloudflare/vite-plugin': 1.43.0
    '@cloudflare/workers-types': ^4.20260621.1
    miniflare: 4.20260701.0
    workerd: 1.20260701.0
    wrangler: 4.107.0

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # OpenTUI is exact-pinned in its two consumers. Allow deliberate same-day
  # upgrades without weakening the age gate for the rest of the dependency graph.
  - '@opentui/*'
  - miniflare
  - wrangler
  - workerd
  - '@cloudflare/workerd-darwin-64'
  - '@cloudflare/workerd-darwin-arm64'
  - '@cloudflare/workerd-linux-64'
  - '@cloudflare/workerd-linux-arm64'
  - '@cloudflare/workerd-windows-64'
  - '@cloudflare/unenv-preset'
  - '@cloudflare/vite-plugin'
  - '@cloudflare/workers-types'
  - '@mmkal/jsonata'
  - '@mmkal/json-schema-to-typescript'
  - '@mariozechner/pi-ai'
  - '@mariozechner/pi-coding-agent'
  - '@mariozechner/pi-agent-core'
  - '@mariozechner/pi-tui'
  - middlewright
  - schematch
  - sqlfu
  - trpc-cli
  - hono
  - '@hono/node-server'
  - '@hono/node-ws'
  - captun
  - '@iterate-com/capnweb'

onlyBuiltDependencies:
  - '@posthog/cli'
  - '@tailwindcss/oxide'
  - esbuild
  - lightningcss
  - node-pty
  - sharp
  - workerd

overrides:
  '@babel/parser': ^7.28.0
  # CodeMirror resolves StateFields by module identity: two copies of
  # state/view in one graph break typecheck AND runtime ("Field is not
  # present in this state"). Force a single resolution for the whole repo.
  '@codemirror/state': ^6.7.1
  '@codemirror/view': ^6.43.6
  '@orpc/client': 1.13.14
  '@orpc/contract': 1.13.14
  '@orpc/json-schema': 1.13.14
  '@orpc/openapi': 1.13.14
  '@orpc/openapi-client': 1.13.14
  '@orpc/otel': 1.13.14
  '@orpc/react-query': 1.13.14
  '@orpc/server': 1.13.14
  '@orpc/shared': 1.13.14
  '@orpc/tanstack-query': 1.13.14
  '@orpc/zod': 1.13.14
  '@tanstack/query-core': 5.101.2
  '@tanstack/react-query': 5.101.2
  agents>viem: '-'
  agents>x402: '-'
  axios: 1.13.6
  baseline-browser-mapping: ^2.9.14
  capnweb: npm:@iterate-com/capnweb@0.10.0
  quicktype-core>readable-stream: npm:vite-compatible-readable-stream@3.6.1
  srvx: 0.11.12
  wrangler: 4.107.0
  ws: 8.19.0

packageExtensions:
  '@valtown/codemirror-ts':
    peerDependencies:
      '@typescript/vfs': '*'
      typescript: '*'
  lucide-react:
    peerDependencies:
      '@types/react': '*'
  streamdown:
    peerDependencies:
      '@types/react': '*'

patchedDependencies:
  '@better-auth/oauth-provider@1.6.9': patches/@better-auth__oauth-provider@1.6.9.patch
  # Remove once Cloudflare releases upstream fix 5fc1224cd73012d087b9438ff0ad931174e4bd86.
  '@cloudflare/sandbox@0.12.3': patches/@cloudflare__sandbox@0.12.3.patch
  '@cloudflare/worker-bundler@0.2.1': patches/@cloudflare__worker-bundler@0.2.1.patch
  '@cloudflare/workers-types@4.20260621.1': patches/@cloudflare__workers-types@4.20260621.1.patch
  '@journeyapps/wa-sqlite@1.7.0': patches/@journeyapps__wa-sqlite@1.7.0.patch
  '@plannotator/ui@0.28.0': patches/@plannotator__ui@0.28.0.patch
  middlewright@0.1.3: patches/middlewright@0.1.3.patch
