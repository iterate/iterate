packages:
  - apps/os
  - apps/dash
  - apps/agents
  - apps/notes
  - apps/voice
  - apps/kit
  - apps/spa
  - apps/dummy-petshop
  - packages/iterate
  - packages/shared
  - packages/ui
  - lint
  - scripts
catalogs:
  # One Cloudflare toolchain for every Worker in the repo: the Vite plugin, the wrangler it builds
  # and deploys with, and the runtime types.
  cloudflare:
    "@cloudflare/vite-plugin": 1.57.3
    "@cloudflare/workers-types": ^5.20260922.1
    wrangler: 4.136.3
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@opentui/*"
  - miniflare
  - wrangler
  - workerd
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
  - "@cloudflare/unenv-preset"
  - "@cloudflare/vite-plugin"
  - "@cloudflare/workers-types"
  - "@mmkal/jsonata"
  - "@mmkal/json-schema-to-typescript"
  - "@mariozechner/pi-ai"
  - "@mariozechner/pi-coding-agent"
  - "@mariozechner/pi-agent-core"
  - "@mariozechner/pi-tui"
  - middlewright
  - schematch
  - sqlfu
  - trpc-cli
  - hono
  - "@hono/node-server"
  - "@hono/node-ws"
  - captun
  - "@iterate-com/capnweb"
onlyBuiltDependencies:
  - "@posthog/cli"
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - node-pty
  - sharp
  - workerd
overrides:
  "@babel/parser": ^7.28.0
  "@codemirror/state": ^6.7.1
  "@codemirror/view": ^6.43.6
  "@material/web": 2.4.1
  "@tanstack/query-core": 5.101.2
  "@tanstack/react-query": 5.101.2
  axios: 1.13.6
  baseline-browser-mapping: ^2.9.14
  iterate>capnweb: npm:@iterate-com/capnweb@0.12.2
  '@iterate-com/agents>capnweb': npm:@iterate-com/capnweb@0.12.2
  os>capnweb: npm:@iterate-com/capnweb@0.12.2
  srvx: 0.11.12
  wrangler: "catalog:cloudflare"
  ws: 8.19.0
packageExtensions:
  lucide-react:
    peerDependencies:
      "@types/react": "*"
  streamdown:
    peerDependencies:
      "@types/react": "*"
patchedDependencies:
  zod@4.5.4: patches/zod@4.5.4.patch
