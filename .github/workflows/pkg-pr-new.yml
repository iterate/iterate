# Continuous preview publishing of first-party packages via https://pkg.pr.new.
#
# Every push to main and every PR publishes tarballs to pkg.pr.new's CDN
# (no npm token involved), installable as:
#
#   https://pkg.pr.new/iterate/iterate/iterate@main            (latest main build)
#   https://pkg.pr.new/iterate/iterate/iterate@<sha>           (specific commit)
#   https://pkg.pr.new/iterate/iterate/iterate@<pr>            (latest build of a PR)
#   https://pkg.pr.new/iterate/iterate/@iterate-com/tasks@main (Tasks config connector)
#
# The seeded project-repo-template depends on the iterate @main URL — that's how
# customer repos get `iterate/sdk` types without a manual npm release.
# Preview deploys re-point seeded repos at @<pr-head-sha> (see
# iterateSdkPackageSpec in apps/os/src/config.ts), so this workflow must run
# on EVERY pull request — do not add a `paths:` filter, or previews of
# unrelated PRs would seed repos with a dangling @<sha> ref.
#
# @iterate-com/tasks is the config-side connector for the Tasks app. OS itself
# never depends on it — it exists for external project config repos (e.g.
# iterate/config), which install it from the @main URL above. Keeping it out
# of the seeded template keeps the OS kernel free of any tasks-app knowledge.
#
# This lives in .github/workflows (real GitHub Actions, like
# claude-assistant.yml) rather than .depot/workflows: pkg.pr.new's backend
# verifies each publish against the GitHub Actions API via its GitHub App,
# which must be installed on this repo: https://github.com/apps/pkg-pr-new
name: pkg.pr.new
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter iterate-root --filter iterate... --filter @iterate-com/tasks...
      - run: pnpm --dir packages/iterate build
      - run: pnpm --dir apps/tasks build:package
      # --pnpm: pack with `pnpm pack` so publishConfig.exports (dist remap)
      # is applied — `npm pack` would ship the dev exports pointing at src/.
      # pkg.pr.new requires every monorepo package in one invocation.
      - run: pnpm exec pkg-pr-new publish --pnpm ./packages/iterate ./apps/tasks
