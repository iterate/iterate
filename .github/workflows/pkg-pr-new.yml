# Continuous preview publishing of first-party project packages via
# https://pkg.pr.new.
#
# Every push to main and every PR publishes a tarball to pkg.pr.new's CDN
# (no npm token involved), installable as:
#
#   https://pkg.pr.new/iterate/iterate@main             (latest main SDK build)
#   https://pkg.pr.new/iterate/iterate/@iterate-com/tasks@main
#
# pkg.pr.new prints the scoped @iterate-com/tasks URL; keep the config template
# pinned to that generated shape rather than deriving it here. Preview deploys
# re-point both packages to @<pr-head-sha>, so this workflow must run on EVERY
# pull request — do not add a `paths:` filter, or previews of unrelated PRs
# would seed repos with dangling @<sha> refs.
#
# This lives in .github/workflows (real GitHub Actions, like
# claude-assistant.yml) rather than .depot/workflows: pkg.pr.new's backend
# verifies each publish against the GitHub Actions API via its GitHub App,
# which must be installed on this repo: https://github.com/apps/pkg-pr-new
name: pkg.pr.new
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter iterate-root --filter iterate... --filter @iterate-com/tasks...
      - run: pnpm --dir packages/iterate build
      - run: pnpm --dir apps/tasks build:package
      # --pnpm: pack with `pnpm pack` so publishConfig.exports (dist remap)
      # is applied — `npm pack` would ship the dev exports pointing at src/.
      # pkg.pr.new requires every monorepo package in one invocation.
      - run: pnpm exec pkg-pr-new publish --pnpm ./packages/iterate ./apps/tasks
