name: pkg.pr.new
on:
  # Every main commit publishes, so any main sha is installable
  # (pkg.pr.new/iterate/iterate/iterate@<sha>).
  push:
    branches:
      - main
  # A PR publishes only when the SDK's inputs change: packages/iterate imports nothing outside
  # itself, and the root manifests and lockfile decide its install.
  pull_request:
    paths:
      - packages/iterate/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pkg-pr-new.yml
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter iterate-root --filter iterate...
      - run: pnpm --dir packages/iterate build
      # --pnpm: pack with `pnpm pack` so publishConfig.exports (dist remap)
      # is applied — `npm pack` would ship the dev exports pointing at src/.
      # pkg.pr.new requires every monorepo package in one invocation.
      - run: pnpm exec pkg-pr-new publish --pnpm ./packages/iterate
