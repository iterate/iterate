# Preview deploy + e2e on open/reopen/synchronize lives here on Depot CI;
# cleanup on close lives in cloudflare-preview-cleanup.yml. Depot CI picks up
# jobs in ~7s where GitHub Actions runner assignment took 20s-3m39s (measured
# 2026-07-02, once ~40min during a webhook incident).
#
# Cleanup is a SEPARATE workflow because every run of a workflow re-emits all
# of its job check names on the head SHA: when deploy and cleanup shared this
# file with complementary `if:`s, the `closed`-event run re-reported
# "Preview / deploy + e2e" as skipped, clobbering the earlier success on every
# merged PR (GitHub displays the latest check run per name). The two workflows
# share the workflow-level lifecycle lock. New pushes keep useful ancestors alive;
# the coordinator cancels only tests made obsolete by a product-change barrier.
# Deployment and cleanup retain the lock until their writes have finished.
#
# Depot registers automatic triggers when this file is on the default branch —
# branch-only changes to the `on:` block do not take effect until merged. Test
# a branch with:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview.yml --ref <branch> \
#     --input pull-request-number=<pr>
#
# The only Depot secret is DOPPLER_TOKEN. GitHub supplies the job-scoped token;
# Doppler supplies every other credential.
#
# Head-commit selection and inherited results are decided by ci-plan. Workflow
# path filters use cumulative PR diffs and cannot express that policy.

name: Preview

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number to deploy + test
        required: true

# This must be workflow-level: Depot does not apply concurrency on a reusable
# caller job. The separate coordinator can run while this workflow is queued.
concurrency:
  group: cloudflare-previews-${{ github.event.pull_request.number || inputs.pull-request-number }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview / deploy + e2e
    uses: ./.depot/workflows/preview-run.yml
    with:
      pull-request-number: ${{ format('{0}', github.event.pull_request.number || inputs.pull-request-number) }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      all-apps: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
