# Called by PR and main workflows. Each caller holds its lifecycle lock
# until every job here, including cleanup, has finished.
name: Preview run
on:
  workflow_call:
    inputs:
      pull-request-number:
        type: string
        default: ""
      head-sha:
        type: string
        required: true
      all-apps:
        type: boolean
        required: true
    secrets:
      DOPPLER_TOKEN:
        required: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
defaults:
  run:
    shell: bash
env:
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  BASH_ENV: ${{ github.workspace }}/scripts/ci/tracing/shell.sh
  CI_TRACE_ENABLED: "1"
  CI_HEAD_SHA: ${{ inputs.head-sha }}
  TEST_TELEMETRY_HEAD_SHA: ${{ inputs.head-sha }}
  PREVIEW_TARGET_ARGS: ${{ inputs.pull-request-number && format('--pull-request-number {0}', inputs.pull-request-number) || format('--commit {0}', inputs.head-sha) }}
  TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
jobs:
  prepare:
    name: Deploy and readiness
    runs-on:
      size: 16x64
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.prepare.outputs.playwright }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Reset test artifacts
        id: reset_artifacts
        run: rm -rf test-results apps/os/test-results apps/streams-example-app/test-results
      - name: Enforce preview deployment epoch
        id: deployment_epoch
        run: |-
          set -euo pipefail
          expected="os-auth-rpc-v1"
          actual="$(cat scripts/preview/deployment-epoch 2>/dev/null || true)"
          if [ "$actual" != "$expected" ]; then
            echo "This branch predates preview deployment epoch $expected. Merge main before deploying." >&2
            exit 1
          fi
      - name: Verify coordination and signal preparing
        id: signal_preparing
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN --
          pnpm exec trpc-cli scripts/ci/status.ts set preparing
      - name: Check fixed Playwright capacity
        id: catalogue
        env:
          CI: "true"
          APP_CONFIG_BASE_URL: https://os.iterate-preview-1.com
          PLAYWRIGHT_PREVIEW_SLOW_FIRST: "1"
          PLAYWRIGHT_CAPACITY_FILE: test-results/playwright-catalogue.json
        run: pnpm spec --list --reporter=./scripts/preview/playwright-capacity-reporter.ts
      - name: Deploy once and wait for readiness
        id: prepare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config prd --preserve-env=GITHUB_TOKEN --
          pnpm preview ci-prepare $PREVIEW_TARGET_ARGS
          ${{ inputs.all-apps && '--all-apps' || '' }}
      - name: Publish prepared deployment identity
        uses: actions/upload-artifact@v4
        with:
          name: preview-ci-plan
          path: test-results/preview-ci-plan.json
          if-no-files-found: error
      - name: Signal prepared preview
        id: signal_ready
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN --
          pnpm exec trpc-cli scripts/ci/status.ts set preview-ready
      - name: Collect test artifacts
        id: collect_artifacts
        if: always()
        run: scripts/preview/collect-test-artifacts.sh test-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-ci-prepare
          path: test-results
          include-hidden-files: true
          if-no-files-found: error

  apps:
    name: App tests
    runs-on:
      size: 16x64
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Reset test artifacts
        id: reset_artifacts
        run: rm -rf test-results apps/os/test-results apps/streams-example-app/test-results
      - name: Reconcile browser installation
        id: install_browser
        run: pnpm exec playwright install chromium
      - name: Wait for prepared preview
        id: wait_for_preview
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN --
          pnpm exec trpc-cli scripts/ci/status.ts wait-for prepare preview-ready
      - name: Download prepared deployment identity
        uses: actions/download-artifact@v4
        with:
          name: preview-ci-plan
          path: test-results
      - name: Run app tests alongside browser shards
        id: app_tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config prd --preserve-env=GITHUB_TOKEN --
          pnpm preview ci-test $PREVIEW_TARGET_ARGS
      - name: Collect test artifacts
        id: collect_artifacts
        if: always()
        run: scripts/preview/collect-test-artifacts.sh test-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-ci-apps
          path: test-results
          include-hidden-files: true
          if-no-files-found: error

  playwright:
    name: Playwright ${{ matrix.shard }}/6
    strategy:
      fail-fast: false
      matrix:
        # 92 tests at introduction: 6 × 16 = 96 available worker slots.
        # The discovery reporter fails when fixed capacity needs increasing.
        shard: [1, 2, 3, 4, 5, 6]
    runs-on:
      size: 16x64
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Reset test artifacts
        id: reset_artifacts
        run: rm -rf test-results apps/os/test-results apps/streams-example-app/test-results
      - name: Reconcile browser installation
        id: install_browser
        run: pnpm exec playwright install chromium
      - name: Wait for prepared preview
        id: wait_for_preview
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN --
          pnpm exec trpc-cli scripts/ci/status.ts wait-for prepare preview-ready
      - name: Download prepared deployment identity
        uses: actions/download-artifact@v4
        with:
          name: preview-ci-plan
          path: test-results
      - name: Run Playwright shard
        id: playwright
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config prd --preserve-env=GITHUB_TOKEN --
          pnpm preview ci-test $PREVIEW_TARGET_ARGS
          --shard ${{ matrix.shard }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-ci-playwright-${{ matrix.shard }}
          path: test-results
          include-hidden-files: true
          if-no-files-found: error

  finish:
    name: Collect results and clean up
    needs: prepare
    if: always()
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Reset test artifacts
        id: reset_artifacts
        run: rm -rf test-results apps/os/test-results apps/streams-example-app/test-results
      - name: Wait for every test job to settle
        id: consumers
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        # One poll reads all seven jobs. Failures are collected, not fail-fast;
        # settled is written only once every consumer has actually stopped.
        run: >-
          doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN --
          pnpm exec trpc-cli scripts/ci/status.ts wait-for-jobs apps
          playwright:matrix-0 playwright:matrix-1 playwright:matrix-2
          playwright:matrix-3 playwright:matrix-4 playwright:matrix-5
      - name: Download every test result
        if: always() && steps.consumers.outputs.settled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: preview-ci-*
          merge-multiple: true
          path: test-results
      - name: Merge reports and publish full preview result
        id: merge_reports
        if: always() && steps.consumers.outputs.settled == 'true' && needs.prepare.result == 'success'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config prd --preserve-env=GITHUB_TOKEN --
          pnpm preview ci-finish $PREVIEW_TARGET_ARGS
      - name: Tests passed; cleanup continues
        id: tests_passed
        if: success() && needs.prepare.result == 'success' && steps.consumers.outputs.succeeded == 'true' && steps.merge_reports.outcome == 'success'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN --
          pnpm exec trpc-cli scripts/ci/status.ts set-pending-check-green
          "All preview tests passed. Cleanup and restoration run afterwards; their final outcome is reflected in this check. See Depot for current cleanup progress."
      - name: Retire test data and restore the preview
        id: erase
        if: always() && steps.consumers.outputs.settled == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        # A failed preparation still gets ordinary retirement. Only a prepared
        # deployment is restored, using this run's exact checkout.
        run: >-
          doppler run --project _shared --config prd --preserve-env=GITHUB_TOKEN --
          pnpm preview erase $PREVIEW_TARGET_ARGS
          --ran-head-sha "${{ inputs.head-sha }}"
          ${{ needs.prepare.result == 'success' && '--restore' || '' }}
      - name: Normalize and send preview test telemetry
        id: telemetry
        if: always()
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project _shared --config prd -- pnpm tsx scripts/ci/upload-test-telemetry.ts --workflow-scope --flake-suites preview ${{ cancelled() && '--cancelled' || '' }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-os-test-artifacts
          path: test-results
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload public Playwright HTML report
        if: ${{ always() && hashFiles('test-results/playwright-html/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-playwright-report
          path: test-results/playwright-html
          if-no-files-found: error
          retention-days: 30
      - name: Upload specs flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-specs
          path: test-results/flake-records/specs
          if-no-files-found: ignore
          overwrite: true
      - name: Upload preview e2e flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-preview-e2e
          path: test-results/flake-records/preview-e2e
          if-no-files-found: ignore
          overwrite: true
      - name: Require preparation and every consumer to succeed
        id: outcome
        if: always()
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CONSUMERS_SETTLED: ${{ steps.consumers.outputs.settled }}
          CONSUMERS_SUCCEEDED: ${{ steps.consumers.outputs.succeeded }}
        run: |-
          test "$PREPARE_RESULT" = success
          test "$CONSUMERS_SETTLED" = true
          test "$CONSUMERS_SUCCEEDED" = true
      - name: Dispatch completed-run trace collector
        id: trace_collector
        if: always()
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CI_TRACE_REF: ${{ github.head_ref || github.ref_name }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts dispatch "$CI_TRACE_REF"
