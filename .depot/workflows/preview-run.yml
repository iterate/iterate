# TEMPORARY: install-only measurement; downstream work intentionally omitted.
name: Preview run
on:
  workflow_call:
    inputs:
      pull-request-number:
        type: string
        default: ""
      head-sha:
        type: string
        required: true
      all-apps:
        type: boolean
        required: true
    secrets:
      DOPPLER_TOKEN:
        required: true
permissions:
  contents: read
  pull-requests: write
  statuses: write
defaults:
  run:
    shell: bash
env:
  BASH_ENV: ${{ github.workspace }}/scripts/ci/tracing/shell.sh
  CI_TRACE_ENABLED: "1"
  CI_HEAD_SHA: ${{ inputs.head-sha }}
  TEST_TELEMETRY_HEAD_SHA: ${{ inputs.head-sha }}
  PREVIEW_TARGET_ARGS:
    ${{ inputs.pull-request-number && format('--pull-request-number {0}', inputs.pull-request-number)
    || format('--commit {0}', inputs.head-sha) }}
  TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
jobs:
  prepare:
    name: Deploy and readiness
    runs-on:
      size: 16x64
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Record baked dependency identity
        run: |
          node --version
          pnpm --version
          printf 'checkout-lock='; sha256sum pnpm-lock.yaml
          printf 'installed-lock='; sha256sum node_modules/.pnpm/lock.yaml
          stat -c '%y %n' node_modules/.modules.yaml
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Repeat install on same sandbox
        run: time pnpm install --frozen-lockfile --prefer-offline
  apps:
    name: App tests
    runs-on:
      size: 16x64
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Record baked dependency identity
        run: |
          node --version
          pnpm --version
          printf 'checkout-lock='; sha256sum pnpm-lock.yaml
          printf 'installed-lock='; sha256sum node_modules/.pnpm/lock.yaml
          stat -c '%y %n' node_modules/.modules.yaml
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Repeat install on same sandbox
        run: time pnpm install --frozen-lockfile --prefer-offline
  playwright:
    name: Playwright ${{ matrix.shard }}/6
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    runs-on:
      size: 16x64
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Record baked dependency identity
        run: |
          node --version
          pnpm --version
          printf 'checkout-lock='; sha256sum pnpm-lock.yaml
          printf 'installed-lock='; sha256sum node_modules/.pnpm/lock.yaml
          stat -c '%y %n' node_modules/.modules.yaml
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Repeat install on same sandbox
        run: time pnpm install --frozen-lockfile --prefer-offline
  finish:
    name: Collect results and clean up
    needs: prepare
    if: always()
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.head-sha }}
      - name: Record baked dependency identity
        run: |
          node --version
          pnpm --version
          printf 'checkout-lock='; sha256sum pnpm-lock.yaml
          printf 'installed-lock='; sha256sum node_modules/.pnpm/lock.yaml
          stat -c '%y %n' node_modules/.modules.yaml
      - name: Reconcile dependencies (baked)
        id: install_dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Repeat install on same sandbox
        run: time pnpm install --frozen-lockfile --prefer-offline
