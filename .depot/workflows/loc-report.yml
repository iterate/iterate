name: LOC report
permissions:
  contents: read
  pull-requests: write
on:
  pull_request: {}
  workflow_dispatch: {}
concurrency:
  group: loc-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  loc-report:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # THE RUN'S OWN COMMIT, the tree this workflow file was read from. The report still diffs the
      # event's head against its base by sha (scripts/ci/loc-report.ts); only the script, its
      # dependencies and .gitattributes come from this checkout
      # (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Post LOC report
        run: pnpm tsx scripts/ci/loc-report.ts
