name: Deploy Kit
permissions:
  contents: read
concurrency:
  group: deploy-kit-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-kit.yml
      - envs.ts
      - scripts/lib/**
      - apps/kit/**
      - packages/ui/**
      - apps/os-next/**
      - apps/agents/**
      - packages/iterate/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project kit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Install ESP-IDF 5.4.2
        env:
          IDF_PATH: /tmp/esp-idf
          IDF_TOOLS_PATH: /tmp/.espressif
        run: |-
          set -euo pipefail
          git clone --depth 1 --recursive --branch v5.4.2 https://github.com/espressif/esp-idf.git "$IDF_PATH"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "f5c3654a1c2d2a01f7f67def7a0dc48e691f63c0"
          "$IDF_PATH/install.sh" esp32s3
          source "$IDF_PATH/export.sh"
          idf.py --version
      - name: Build Kit firmware releases
        working-directory: apps/kit
        env:
          IDF_PATH: /tmp/esp-idf
          IDF_TOOLS_PATH: /tmp/.espressif
        run: |-
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          pnpm run firmware:release
      - name: Deploy apps/kit
        working-directory: apps/kit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          IDF_PATH: /tmp/esp-idf
          IDF_TOOLS_PATH: /tmp/.espressif
        run: |-
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          doppler run -- pnpm run-script deploy
  notify:
    needs:
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Notify Slack
        env:
          APP_DISPLAY_NAME: Kit
          PUBLIC_URL: https://k.iterate.com
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ needs.deploy.result }}
