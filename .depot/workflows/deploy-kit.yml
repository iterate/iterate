name: Deploy Kit
permissions:
  contents: read
concurrency:
  group: deploy-kit-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-kit.yml
      - envs.ts
      - scripts/lib/**
      - apps/kit/**
      # firmware ships as GitHub releases (kit-firmware.yml)
      - "!apps/kit/firmware/**"
      - packages/ui/**
      - packages/shared/**
      # Prepare's installer (@iterate-com/voice/install and @iterate-com/agents/install)
      - packages/agents/**
      - packages/voice/**
      - packages/iterate/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      - name: Deploy apps/kit
        id: deploy
        working-directory: apps/kit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project kit --config prd -- pnpm run-script deploy
      # The deploy's own result to #ci, a failed, cancelled or timed-out deploy included
      # (deploy-os.yml says why `always()`).
      - name: Notify Slack
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: Kit
          PUBLIC_URL: https://k.iterate.com
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
