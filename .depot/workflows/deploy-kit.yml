name: Deploy Kit
permissions:
  contents: read
concurrency:
  group: deploy-kit-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-kit.yml
      - envs.ts
      - scripts/lib/**
      - apps/kit/**
      # firmware ships as GitHub releases (kit-firmware.yml)
      - "!apps/kit/firmware/**"
      - packages/ui/**
      - apps/agents/**
      - packages/iterate/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project kit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy apps/kit
        id: deploy
        working-directory: apps/kit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy
      # The deploy's own result to #ci, a failed, cancelled or timed-out deploy included
      # (deploy-os-next.yml says why `always()`).
      - name: Notify Slack
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: Kit
          PUBLIC_URL: https://k.iterate.com
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
