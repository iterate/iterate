name: Deploy Kit
permissions:
  contents: read
concurrency:
  group: deploy-kit-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-kit.yml
      - envs.ts
      - scripts/lib/**
      - apps/kit/**
      # firmware ships as GitHub releases (kit-firmware.yml)
      - "!apps/kit/firmware/**"
      - packages/ui/**
      - packages/shared/**
      # Prepare's installer (@iterate-com/voice/install and @iterate-com/agents/install)
      - packages/agents/**
      - packages/voice/**
      - packages/iterate/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
  workflow_dispatch:
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      - name: Deploy apps/kit
        id: deploy
        working-directory: apps/kit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm run-script deploy --env prd
      # The deploy's own post (scripts/ci/notify.ts; deploy-os.yml says when each runs).
      - name: Post the deploy's line
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_DISPLAY_NAME: Kit
        run: node scripts/ci/notify.ts deploy-success
      - name: Page the failed deploy
        if: ${{ always() && (steps.deploy.outcome != 'success') && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: Kit
          UPLOADED: ${{ steps.deploy.outcome }}
        run: node scripts/ci/notify.ts deploy-failure
