# THE FLAKE DASHBOARD'S WRITER (scripts/ci/flake-dashboard/update.ts): folds the flake-records-*
# artifacts that the Test and Preview OS jobs finished since its last run and rewrites issue #2580.
# The fold's state is this job's own artifact, read back by the next run, kept even when the issue
# write fails. A dispatch with dry-run=true renders without writing the issue or the state.
#
# PAUSED: dispatch only. The job's token is the Depot GitHub App's, which has no Issues permission,
# so the first scheduled run (2026-09-23) got 403 "Resource not accessible by integration" on
# PATCH issues/2580. The legacy writer used the iterate app's own token. Restore the schedule
# ("7,22,37,52 * * * *") once the writer has a token that can write #2580.
name: Flake dashboard
permissions:
  contents: read
  issues: write
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: true = render only; neither the issue nor the state is written
        required: false
        type: string
        default: "false"
concurrency:
  group: flake-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      # The Depot organization token CI telemetry already uses (Doppler _shared/preview) lists and
      # downloads the artifacts; the job's own GitHub token writes the issue.
      - name: Fold new flake records into the dashboard issue
        run: |-
          set -euo pipefail
          export DEPOT_TOKEN
          DEPOT_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)"
          pnpm tsx scripts/ci/flake-dashboard/update.ts \
            --state-out test-results/flake-dashboard/state.json \
            --body-out test-results/flake-dashboard/body.md \
            ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
      # Also after a failed issue write: the script keeps the fold before it writes the issue. A run
      # that failed before folding has no state to keep.
      - name: Keep the fold state for the next run
        if: always() && inputs.dry-run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-dashboard-state
          path: test-results/flake-dashboard/state.json
          if-no-files-found: ignore
          overwrite: true
