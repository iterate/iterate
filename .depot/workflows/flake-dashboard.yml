# THE FLAKE DASHBOARD (scripts/ci/flake-dashboard/update.ts): recomputes issue #2580 every hour from
# the flake records and suite summaries that CI's test runs keep in R2 (docs/test-evidence.md), and
# rewrites the issue when its body changed. Nothing is kept between runs. A dispatch with
# dry-run=true prints the body in the log and writes nothing.
#
# #2580 is written as the iterate GitHub App (iterate[bot]): the writer mints an installation token
# narrowed to writing issues in this repository. The Depot app's job token has no Issues permission
# (403 on PATCH issues/2580). The app's key is read here only, in a workflow that never runs on
# pull_request or push.
name: Flake dashboard
permissions:
  contents: read
on:
  schedule:
    # Hourly, off the top of the hour and the alarms' minutes (:07/:22/:37/:52, :41).
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: true = print the body in the log instead of writing the issue
        required: false
        type: string
        default: "false"
concurrency:
  group: flake-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # The Cloudflare API token CI uploads the test evidence with (Doppler _shared/preview) reads
      # it back. The iterate GitHub App's id and key (Doppler os-legacy-backup/prd) mint the token
      # that writes the issue.
      - name: Recompute the dashboard issue
        run: |-
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY
          CLOUDFLARE_API_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain --project _shared --config preview)"
          GITHUB_APP_ID="$(doppler secrets get GITHUB_APP_ID --plain --project os-legacy-backup --config prd)"
          GITHUB_APP_PRIVATE_KEY="$(doppler secrets get GITHUB_APP_PRIVATE_KEY --plain --project os-legacy-backup --config prd)"
          pnpm tsx scripts/ci/flake-dashboard/update.ts ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
