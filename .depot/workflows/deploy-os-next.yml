name: Deploy OS-Next
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same production Worker (os-next-prd:
  # os.iterate2.com, mcp.iterate2.com, *.iterate2.app). Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-os-next-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-os-next.yml
      - apps/os-next/**
      - packages/iterate/**
      - envs.ts
      - scripts/lib/**
      - packages/shared/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    outputs:
      public_url: ${{ steps.metadata.outputs.public_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      # The Doppler project slug is still `project-worker` (the secrets bucket
      # predates the os-next rename; renaming a Doppler project slug is a
      # separate migration). The deployed Cloudflare Worker is os-next-prd.
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - id: metadata
        name: Resolve OS-Next deploy URL
        run: echo "public_url=https://os.iterate2.com" >> "$GITHUB_OUTPUT"
      - name: Deploy apps/os-next
        working-directory: apps/os-next
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy --env prd
  # THE PROOF THAT COUNTS (docs/testing.md): the e2e vitest project against the worker this
  # run just deployed — every file a capnweb client at os.iterate2.com/api exactly like a
  # production client. The shared Test job runs only os-next's unit + workers vitest projects,
  # so without this job a deployed regression is invisible until someone runs e2e by hand.
  e2e:
    needs:
      - deploy
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # Deployed-target mode (apps/os-next/e2e/support/global-setup.ts): WORKER_BASE_URL selects
      # the deployed worker; ADMIN_API_SECRET and LOGIN_PASSWORD are read out of the deployment's
      # `APP_CONFIG` object in Doppler (secrets.adminBearer, login.password — src/app-config.ts). Files
      # run in parallel (vitest.config.ts): every test mints its own project.
      - name: Run e2e against os.iterate2.com
        working-directory: apps/os-next
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          WORKER_BASE_URL: ${{ needs.deploy.outputs.public_url }}
        run: doppler run -- sh -c 'ADMIN_API_SECRET="$(node -p "JSON.parse(process.env.APP_CONFIG).secrets.adminBearer")" LOGIN_PASSWORD="$(node -p "JSON.parse(process.env.APP_CONFIG).login.password")" pnpm e2e'
  notify:
    needs:
      - deploy
      - e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Notify Slack
        env:
          APP_DISPLAY_NAME: OS-Next
          PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ needs.deploy.result }}
      # A deploy that succeeded but failed e2e is a live regression: #error-pulse.
      - name: Notify e2e failure
        if: needs.e2e.result == 'failure'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: pnpm tsx scripts/ci/notify.ts workflow-failure
