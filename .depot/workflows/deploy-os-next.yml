name: Deploy OS
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same production Worker (os-next-prd:
  # os.iterate.com, mcp.iterate.com, *.iterate.app). Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-os-next-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-os-next.yml
      - apps/os/**
      - configs-next/**
      - packages/iterate/**
      - envs.ts
      - scripts/lib/**
      - scripts/depot-ci/**
      - packages/shared/**
      # A root dependency resolution can change the Worker bundle even when no
      # application source path moved.
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
env:
  # THE STORE THE IMAGE WAS BAKED WITH. scripts/depot-ci/dependencies.mjs hashes every pnpm_config_*
  # variable into its fingerprint (the store dir decides where node_modules links point), and the bake
  # job sets this one — so a workflow without it computes a different fingerprint on identical sources
  # and never reuses the baked node_modules (every os-next job, 2026-09-22, ~55 s of paging each).
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  deploy:
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    outputs:
      public_url: ${{ steps.metadata.outputs.public_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # The Doppler project slug is still `project-worker` (the secrets bucket
      # predates the os-next rename; renaming a Doppler project slug is a
      # separate migration). The deployed Cloudflare Worker is os-next-prd.
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - id: metadata
        name: Resolve OS deploy URL
        run: echo "public_url=https://os.iterate.com" >> "$GITHUB_OUTPUT"
      - name: Deploy apps/os
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy --env prd
  notify:
    needs:
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Notify Slack
        env:
          APP_DISPLAY_NAME: OS
          PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ needs.deploy.result }}
