# ONE PREVIEW PER PULL REQUEST of apps/os, on Cloudflare Worker Previews — the shape of
# cloudflare/cloudflare-os's .github/workflows/preview.yml, cut down to one worker and run on Depot.
# The script is apps/os/scripts/preview.ts. Four jobs, each a check named for what it proves:
#   Deploy preview   every push: first whether the PR changes a preview path
#                    (scripts/ci/preview-paths.ts `previewPaths`); a PR that changes none deploys
#                    nothing and passes. Otherwise it deploys the PR merged into main (the run's own
#                    commit, the merge commit Depot read this file from; the head alone on a dispatch
#                    whose PR conflicts, scripts/ci/preview-tested-commit.ts) as a preview named
#                    `pr<n>` of the parent worker `os` (and of each app's), and writes the URL, the
#                    tested commit and the operations into the PR body, under a status line:
#                    deploying, deployed or deploy failed
#   E2E tests        beside Deploy preview from the start, set up while it deploys, then waiting for
#                    it (scripts/ci/await-deploy.ts): the vitest e2e suite against the preview, its
#                    line for the PR body (passed or failed) as its `status` output, then its test
#                    telemetry and flake records. The rows tagged `slow` run only when the PR carries
#                    the `slow-e2e` label or edits one of them (SLOW_ROW_PATHS) (docs/testing.md#slow-rows)
#   Browser specs    beside E2E tests: the Playwright specs, the same way, and the Playwright report.
#                    One job definition, E2E tests', differing only in the suite it names and in its
#                    bigger runner, where its six browsers have the CPU they need
#   CI trace         after all three, whatever their outcome, reporting only: the two suites' lines
#                    under the status line, in one write; the CI trace (docs/ci-traces.md), an
#                    artifact plus the "CI trace" and "Playwright report" commit statuses, which
#                    open them in the ci-reports viewer
#
# E2E TESTS AND BROWSER SPECS ARE REQUIRED CHECKS (docs/pull-requests.md), so each reports on every
# pull request, and the workflow has no `paths` filter: GitHub leaves a required check "Pending" when
# a filter skips its workflow. A PR that changes no preview path passes both as soon as each has
# decided so, from the same commit and rule as Deploy preview. One that does, whose Deploy preview did
# not finish, gets both red, never skipped: each fails when its wait sees the deploy fail, be
# cancelled or skipped.
# Closing the PR deletes the preview and everything it owned (preview-delete.yml); the nightly sweep
# of previews whose PR closed without a delete, or that went stale, is preview-sweep.yml.
#
# Depot registers automatic triggers when this file is on the default branch. Every operation the PR
# body lists is a dispatch (docs/depot-ci.md#dispatch-a-checked-in-workflow):
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-os.yml --ref <branch> \
#     --input pull-request-number=<pr> --input action=deploy
# action = deploy | reset | test | e2e | specs. deploy and reset (which deletes the preview first)
# run Deploy preview and, beside it, both suites, as a push does. test runs both suites against the
# preview as it is deployed, e2e the E2E tests alone, specs the Browser specs alone. A test-only
# action names its preview by pull-request-number or, without one, by preview-name (`exp-jonas`,
# or CI's own `main`), and runs the suite from the dispatched ref. A dispatch posts its checks on the
# ref's head commit, replacing that commit's checks of the same name, and a job it skips counts as
# passing there: dispatch e2e or specs alone from a scratch branch cut from main, never on a PR's
# branch or main, whose head would carry the result (docs/depot-ci.md#run-ci-without-a-pr).
# slow-rows = run | skip overrides what the PR's paths and label say about the rows tagged `slow`:
# `--input action=e2e --input slow-rows=run` runs them against the live preview.
# apps = all | auto | none (the apps on top: dash, agents, notes, voice, kit, admin). Pull-request runs use
# all so every client is usable against the platform preview; auto remains available for a faster
# targeted manual redeploy once the clients are already present.
#
# Concurrency per PR. The PR's next push cancels the run in progress, in whatever job, since its
# verdict would be out of date; Depot starts none of the cancelled run's `always()` jobs, and the next
# run redeploys the whole preview, which repairs a deploy cut short. A dispatch cancels nothing: it
# queues behind the run in progress. preview-delete.yml takes the same group and cancels nothing, so a
# PR's delete waits for its deploy and tests to settle.
# The only Depot secret is DOPPLER_TOKEN; Doppler os/preview supplies the Cloudflare
# credentials and the two secrets the preview inherits (APP_CONFIG, APP_CONFIG_SECRETS__KEY).

name: Preview OS

permissions:
  contents: read
  pull-requests: write
  # The trace job's "CI trace" and "Playwright report" commit statuses.
  statuses: write

on:
  # Every pull request, without a `paths` filter: Deploy preview decides whether it gets a preview.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number
        required: false
        type: string
        default: ""
      preview-name:
        description: "A deployed preview to test, by name, without a PR number: action test, e2e or specs"
        required: false
        type: string
        default: ""
      action:
        description: deploy | reset | test | e2e | specs
        required: false
        type: string
        default: deploy
      apps:
        description: "The apps on top (dash, agents, notes, voice, kit, admin): all = every client, auto = changed clients, none"
        required: false
        type: string
        default: all
      slow-rows:
        description: "The e2e rows tagged slow: run | skip; empty = as the PR's paths and slow-e2e label say"
        required: false
        type: string
        default: ""

concurrency:
  group: preview-os-${{ github.event.pull_request.number || inputs.pull-request-number || 'none' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
  ACTION: ${{ inputs.action || 'deploy' }}
  # CI TRACE MARKERS (docs/ci-traces.md): every run step's start and exit, and the test reporters'
  # lifecycle records, as `@@ci-trace` lines in the Depot logs the trace job reads.
  BASH_ENV: ${{ github.workspace }}/scripts/ci/tracing/shell.sh
  CI_TRACE_ENABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && (inputs.action == 'deploy' || inputs.action == 'reset'))
    # Its size: docs/depot-ci.md#reliability-defaults.
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 40
    # THE COMMIT THIS RUN TESTS, for the trace job: the PR merged into main
    # (scripts/ci/preview-tested-commit.ts), so it traces with the scripts of the commit deployed
    # here. `preview` is false for a PR that changes no preview path. The suites, which start beside
    # this job, work both out themselves, by the same rules.
    outputs:
      tested-sha: ${{ steps.tested.outputs.sha }}
      head-sha: ${{ steps.tested.outputs.head-sha }}
      preview: ${{ steps.changes.outputs.preview }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      # The preview proves what main will be after the merge: on a push, this run's own commit (the
      # merge commit this workflow file was read from, so the code and the workflow are one tree);
      # on a dispatch, GitHub's current test merge commit, or the head alone when there is none (a
      # conflict), which the PR body then says.
      - name: Check out the PR merged into main
        id: tested
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_RUN_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: node scripts/ci/preview-tested-commit.ts
      # A push that changes no preview path deploys nothing, and the steps after this skip; a
      # dispatch deploys whatever it changes. This and the step before run on the stock image's own
      # Node, before the setup: the PR head they start from may predate it.
      - name: Decide whether the PR changes a preview path
        id: changes
        if: github.event_name == 'pull_request'
        run: node scripts/ci/preview-paths.ts changes
      - name: Setup
        if: steps.changes.outputs.preview != 'false'
        uses: ./.depot/actions/setup
      # `deploy` redeploys in place; `reset` deletes the preview first. Either way the
      # script ends by writing the URL and the operations into the PR body (GITHUB_TOKEN).
      - name: Deploy (or reset) the preview
        id: deploy
        if: steps.changes.outputs.preview != 'false'
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_APPS: ${{ inputs.apps || 'all' }}
          PREVIEW_TESTED_COMMIT: ${{ steps.tested.outputs.description }}
          # the PR head, which a template-changing PR's quick-launch links read the template at
          PREVIEW_HEAD_SHA: ${{ steps.tested.outputs.head-sha }}
        run: doppler run --project os --config preview -- pnpm preview "$ACTION"

  # THE TWO SUITES, E2E tests and Browser specs: one job each, side by side, and ONE DEFINITION.
  # Browser specs runs E2E tests' outputs and steps (the `suite-outputs` and `suite-steps` anchors);
  # the two differ only in the suite their env names, in which dispatch skips them, and in their
  # runners (below).
  # E2E tests is the full mutating proof (docs/testing.md): the vitest e2e suite, whose project-
  # creating rows this isolated preview owns (production runs only its deploy-script readiness
  # probes). Browser specs is the browser proof: the root Playwright specs (specs/AGENTS.md) against
  # the preview and its apps on top, and the Playwright report.
  #
  # STARTED WITH THE RUN, NOT AFTER THE DEPLOY: no `needs:`. Each sets its suite up while Deploy
  # preview deploys, then waits for that job (PREVIEW_AWAIT_DEPLOY_JOB), as
  # docs/depot-ci.md#suites-start-with-the-run explains. Each works out itself, by Deploy preview's
  # own rules, whether the PR changes a preview path and which commit to test.
  #
  # REQUIRED CHECKS: each is skipped only on a dispatch of the other suite alone. On a PR that changes
  # no preview path it passes once it has decided so. It fails red when there is no preview to test:
  # a deploy that failed or was cancelled (its wait), or a dispatch that names none (its first step).
  # Its evidence steps run once its suite read the deployed target (test-results/target.json), so a
  # job that never had a preview keeps none.
  #
  # THE SUITE'S LINE in the PR body is the CI trace job's to write, after both suites: the suite's
  # step hands it over as the job's `status` output (apps/os/scripts/preview.ts `handOverSuiteLine`),
  # so the check turns green or red without waiting on GitHub.
  #
  # RUNNERS: E2E tests waits on a remote preview, which a 2x8 does about as fast as a 4x16. Browser
  # specs runs six browsers (playwright.config.ts `workers`), whose specs run faster with a 4x16's
  # CPU; more workers or shards would put more specs on the preview at once, which raises retries.
  # The measurements: docs/depot-ci.md#reliability-defaults. The timeout is the wait's bound, the
  # deploy's own 40 minutes, and then the suite's 30.
  e2e:
    name: E2E tests
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'specs')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 70
    env:
      # THE SUITE: `pnpm preview <suite>`, its flake records' suite, and the workspace its telemetry
      # names. Which rows tagged `slow` run: docs/testing.md#slow-rows.
      SUITE: e2e
      FLAKE_SUITE: preview-e2e
      TEST_TELEMETRY_EXPECTED_WORKSPACES: os
      # TEST TELEMETRY (docs/testing.md#flakes-and-pinned-failures): the runner writes its canonical
      # artifact here, its flake lines go to its suite's directory (apps/os/scripts/preview.ts), and
      # the steps after the suite normalize, summarize and upload them, whatever its outcome.
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
      TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
    outputs: &suite-outputs
      status: ${{ steps.suite.outputs.status }}
    steps: &suite-steps
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # A dispatch that deploys nothing tests the preview it names: a PR's, or one by name for action
      # test, e2e or specs. Deploy preview skips a dispatch without a PR number.
      - name: Require a preview to test
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.pull-request-number == '' &&
          !((inputs.action == 'test' || inputs.action == env.SUITE) && inputs.preview-name != '')
        run: |
          echo "This dispatch names no preview to test, so there is none: pass pull-request-number,"
          echo "or preview-name with action test, e2e or specs."
          exit 1
      # The commit Deploy preview deploys: on a push, the run's own commit, the PR merged into main;
      # on a dispatch, the PR's head, then the PR merged into main as the deploy resolves it, or the
      # dispatched ref for a preview by name.
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || (inputs.pull-request-number != '' && format('refs/pull/{0}/head', inputs.pull-request-number)) || github.sha }}
      # Deploy preview's own step, on the same commit: a push that changes no preview path deploys
      # nothing, and this job passes here, testing nothing.
      - name: Decide whether the PR changes a preview path
        id: changes
        if: github.event_name == 'pull_request'
        run: node scripts/ci/preview-paths.ts changes
      # On the stock image's own Node, before the setup, which the PR head may predate.
      - name: Check out the PR merged into main
        id: tested
        if: github.event_name == 'workflow_dispatch' && inputs.pull-request-number != ''
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: node scripts/ci/preview-tested-commit.ts
      # Telemetry is labelled with the PR head, whatever merge commit was tested.
      - name: Record the PR head for test telemetry
        if: steps.changes.outputs.preview != 'false'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.tested.outputs.head-sha }}
        run: echo "TEST_TELEMETRY_HEAD_SHA=${HEAD_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
      # THE SETUP, and beside it the specs' browser, Playwright's headless shell, from Depot Cache
      # (docs/depot-ci.md#depot-cache). The suite's `playwright install --only-shell` fetches it when
      # the restore did not.
      - fail-fast: false
        parallel:
          - name: Setup
            if: steps.changes.outputs.preview != 'false'
            uses: ./.depot/actions/setup
          - name: Restore Playwright's browser
            id: playwright
            if: steps.changes.outputs.preview != 'false' && env.SUITE == 'specs'
            uses: actions/cache/restore@v4
            continue-on-error: true
            timeout-minutes: 2
            with:
              path: ~/.cache/ms-playwright
              key: ms-playwright-${{ hashFiles('pnpm-lock.yaml') }}
              restore-keys: ${{ github.ref != 'refs/heads/main' && 'ms-playwright-' || '' }}
      # Set up, wait for this run's deploy when it has one, then the suite
      # (apps/os/scripts/preview.ts `runSuite`). The trace's Test phase is this step
      # (scripts/ci/tracing/tracing.ts).
      - name: Run the suite against the preview
        id: suite
        if: steps.changes.outputs.preview != 'false'
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # the branch a PR's preview is named for, or a preview by name when there is no PR number
          PREVIEW_NAME: ${{ inputs.preview-name }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          # the e2e suite's rows tagged `slow`; the specs have none
          E2E_SLOW_ROWS: ${{ inputs.slow-rows }}
          # the job whose end starts the suite, when this run deploys (scripts/ci/await-deploy.ts)
          PREVIEW_AWAIT_DEPLOY_JOB: ${{ (github.event_name == 'pull_request' || inputs.action == 'deploy' || inputs.action == 'reset') && 'deploy' || '' }}
        run: doppler run --project os --config preview -- pnpm preview "$SUITE"
      # Fails when the runner left no complete artifact, and writes the suite summary next to its
      # flake lines. A cancelled run keeps its partial evidence without reporting it as failures.
      # Once the suite read its deployed target only: without a preview there is nothing to keep.
      - name: Check test telemetry and write the suite summary
        if: ${{ always() && hashFiles('test-results/target.json') != '' }}
        run: pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites "$FLAKE_SUITE" ${{ cancelled() && '--cancelled' || '' }}
      # THE TEST EVIDENCE FOLDER (docs/test-evidence.md): this adds test-results/manifest.json.
      # Neither this nor the upload decides the job; the tests did.
      # Once the suite read its deployed target only: a job with no preview has no folder.
      - name: Write the test evidence manifest
        id: evidence-write
        if: ${{ always() && hashFiles('test-results/target.json') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          TEST_EVIDENCE_STEPS: ${{ env.SUITE }}=${{ steps.suite.outcome }}
        run: pnpm tsx scripts/ci/test-evidence.ts write ${{ cancelled() && '--cancelled' || '' }}
      # THE UPLOADS, side by side: each only reads test-results/, and `fail-fast: false` lets every
      # one finish whatever another does (docs/depot-ci.md#parallel-steps).
      - fail-fast: false
        parallel:
          # With the Cloudflare API token preview deploys use (Doppler _shared/preview), as S3 keys.
          # A cancelled or timed-out job's folder too: its manifest says so. A failure is a warning
          # and a line of the job's summary, never the job's result.
          - name: Upload the test evidence to R2
            id: evidence-upload
            if: ${{ always() && hashFiles('test-results/manifest.json') != '' }}
            continue-on-error: true
            timeout-minutes: 3
            env:
              DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            run: doppler run --project _shared --config preview -- pnpm tsx scripts/ci/test-evidence.ts upload
          # One artifact per suite and job attempt; PR time to green reads its suite summary.
          - name: Upload flake records
            if: ${{ always() && hashFiles('test-results/target.json') != '' }}
            uses: actions/upload-artifact@v4
            with:
              name: flake-records-${{ env.FLAKE_SUITE }}-attempt-${{ steps.attempt.outputs.id }}
              path: test-results/flake-records/${{ env.FLAKE_SUITE }}
              if-no-files-found: ignore
          # EVERYTHING THE RUN WROTE under test-results/, whatever the suite's outcome
          # (docs/depot-ci.md#browser-reports-from-artifacts): the telemetry, and for the specs each
          # failed spec's trace.zip, screenshot and error-context.md under playwright-output/ and
          # playwright-results.json.
          - name: Upload results
            if: ${{ always() && hashFiles('test-results/target.json') != '' }}
            uses: actions/upload-artifact@v4
            with:
              name: preview-os-test-artifacts-attempt-${{ steps.attempt.outputs.id }}
              path: test-results
              include-hidden-files: true
              if-no-files-found: error
          # The specs' Playwright HTML report on its own (only they write one), which the trace job
          # links from the "Playwright report" status (its `public-` name lets the ci-reports viewer
          # serve it). Named for the PR, not the attempt, and overwritten: it is the latest attempt's
          # report, and each attempt's own copy is in its test-results artifact.
          - name: Upload public Playwright HTML report
            if: ${{ always() && hashFiles('test-results/playwright-html/index.html') != '' }}
            uses: actions/upload-artifact@v4
            with:
              name: public-playwright-report
              path: test-results/playwright-html
              if-no-files-found: error
              retention-days: 30
              overwrite: true
      # Either step that failed before it could say why (Doppler, pnpm, its timeout) gets its
      # warning and summary line here; one that reported itself is left alone.
      - name: Report a test evidence step that could not
        if: ${{ always() && (steps.evidence-write.outcome == 'failure' || steps.evidence-upload.outcome == 'failure') }}
        run: bash scripts/ci/test-evidence-unreported.sh "${{ steps.evidence-write.outcome }}" "${{ steps.evidence-upload.outcome }}"

  specs:
    name: Browser specs
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'e2e')
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 70
    env:
      SUITE: specs
      FLAKE_SUITE: specs
      TEST_TELEMETRY_EXPECTED_WORKSPACES: iterate-root
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
      TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
    outputs: *suite-outputs
    steps: *suite-steps

  # THE SUITES' LINES AND THE CI TRACE (docs/ci-traces.md), reporting only: the two suites' lines in
  # the PR body, then the Depot timings and `@@ci-trace` markers of the jobs it needs as trace.html
  # and trace.json, this job's artifact, then two commit statuses opening the ci-reports viewer
  # (apps/ci-reports): "CI trace", whose description is the time to green (the last test job's
  # success) or to red (the first failed job), and "Playwright report", the Browser specs job's HTML
  # report. After the three settle, whatever their outcome; never when none ran, nor for a PR that
  # changes no preview path. Main OS e2e has the same job less the suites' lines, as it has no PR
  # (scripts/ci/depot-workflows.test.ts keeps them alike).
  trace:
    name: CI trace
    needs: [deploy, e2e, specs]
    if: >-
      always() && needs.deploy.outputs.preview != 'false' &&
      (needs.deploy.result != 'skipped' || needs.e2e.result != 'skipped' || needs.specs.result != 'skipped')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The tree deploy tested, which on a push is the one this file was read from, so the tracing
      # scripts are this workflow's own; the statuses still go on the PR head.
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.tested-sha || github.event.pull_request.head.sha || (inputs.pull-request-number != '' && format('refs/pull/{0}/head', inputs.pull-request-number)) || github.sha }}
      - name: Record the traced commit
        env:
          HEAD_SHA: ${{ needs.deploy.outputs.head-sha }}
        run: echo "CI_TRACE_STATUS_SHA=${HEAD_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
      - name: Setup
        uses: ./.depot/actions/setup
      # THE SUITES' LINES under the PR body's status line, both in one write, from the lines their
      # jobs handed over (one a line; a suite that handed over none keeps its line). First, so a
      # trace that cannot be collected costs no line. Whatever fails here (GitHub's answers, an
      # output it cannot parse, the timeout) fails this step alone: the trace and its report
      # statuses still go out, and a PR body line never turns the CI trace red.
      - name: Write the suites' lines into the PR body
        continue-on-error: true
        timeout-minutes: 2
        working-directory: apps/os
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_SUITE_LINES: |-
            ${{ needs.e2e.outputs.status }}
            ${{ needs.specs.outputs.status }}
        run: pnpm preview suite-lines
      # The Depot organization token CI telemetry uses (Doppler _shared/preview) reads the workflow
      # and its jobs' logs; only `@@ci-trace` lines are kept.
      - name: Collect the trace
        id: trace
        timeout-minutes: 5
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts current ci-trace.ignoreme
      # A re-run of this job alone keeps the execution, so the name, of the run it traces; without
      # overwrite the upload fails and the report statuses are never posted.
      - name: Upload the CI trace
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trace.outputs.artifact-name }}
          path: ci-trace.ignoreme/trace.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      # Finds both artifacts in Depot by name, so it runs after the upload.
      - name: Post the report statuses
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
