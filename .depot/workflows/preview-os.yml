# ONE PREVIEW PER PULL REQUEST of apps/os, on Cloudflare Worker Previews — the shape of
# cloudflare/cloudflare-os's .github/workflows/preview.yml, cut down to one worker and run on Depot.
# The script is apps/os/scripts/preview.ts. One job per operation, named for when it runs:
#   deploy              every push: deploys the PR merged into main (GitHub's test merge commit;
#                       the head alone when the PR conflicts, scripts/ci/preview-tested-commit.ts)
#                       as a preview named `pr<n>-<branch slug>` of the parent worker
#                       os-next-preview, and writes the URL, the tested commit and the operations
#                       into the PR body
#   e2e                 after deploy succeeds: the e2e suite and the Playwright specs against it,
#                       then their test telemetry and flake records as artifacts
#   trace               after both, whatever their outcome: the CI trace (docs/ci-traces.md), an
#                       artifact plus a "CI trace" commit status with the time to green or red
# "e2e" skips only when deploy did not succeed. Closing the PR deletes the preview and everything it
# owned (preview-delete.yml); the nightly sweep of previews whose PR closed without a delete, or
# that went stale, is preview-sweep.yml.
#
# Depot registers automatic triggers when this file is on the default branch. Test a branch with:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-os.yml --ref <branch> \
#     --input pull-request-number=<pr> --input action=deploy
# Every operation the PR body lists is a dispatch: action = deploy | reset | e2e (a delete is a
# dispatch of preview-delete.yml), apps = all | auto | none (the apps on top: dash, agents, notes,
# voice, kit). Pull-request runs use all so every client is usable against the platform preview;
# auto remains available for a faster targeted manual redeploy once the clients are already
# present. action=deploy or reset runs the deploy job and then e2e, as a push does; action=e2e runs
# e2e alone.
#
# Concurrency per PR, never cancelled: a half-applied preview is worse than a slow one (their words).
# preview-delete.yml takes the same group, so a PR's delete waits for its deploy and e2e to settle.
# The only Depot secret is DOPPLER_TOKEN; Doppler project-worker/preview supplies the Cloudflare
# credentials and the two secrets the preview inherits (APP_CONFIG, APP_CONFIG_SECRETS__KEY).

name: Preview OS

permissions:
  contents: read
  pull-requests: write
  # The trace job's "CI trace" commit status.
  statuses: write

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # preview-delete.yml runs on `closed` with this same list.
    paths:
      # A production-workflow change must exercise this isolated deployment:
      # production runs deploy's non-mutating readiness probes only.
      - .depot/workflows/deploy-os.yml
      - .depot/workflows/deploy-dash.yml
      - .depot/workflows/deploy-agents.yml
      - .depot/workflows/deploy-notes.yml
      - .depot/workflows/deploy-voice.yml
      - .depot/workflows/deploy-kit.yml
      - .depot/workflows/preview-os.yml
      - apps/os/**
      - configs-next/**
      - apps/dash/**
      - apps/agents/**
      - apps/notes/**
      - apps/voice/**
      - apps/kit/**
      # kit's firmware ships as GitHub releases (kit-firmware.yml), never in its Worker
      - "!apps/kit/firmware/**"
      - specs/**
      - playwright.config.ts
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - envs.ts
      - scripts/lib/**
      - scripts/depot-ci/**
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number
        required: false
        type: string
        default: ""
      action:
        description: deploy | reset | e2e
        required: false
        type: string
        default: deploy
      apps:
        description: "The apps on top (dash, agents, notes, voice, kit): all = every client, auto = changed clients, none"
        required: false
        type: string
        default: all

concurrency:
  group: preview-os-${{ github.event.pull_request.number || inputs.pull-request-number || 'none' }}
  cancel-in-progress: false

env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
  ACTION: ${{ inputs.action || 'deploy' }}
  # CI TRACE MARKERS (docs/ci-traces.md): every run step's start and exit, and the test reporters'
  # lifecycle records, as `@@ci-trace` lines in the Depot logs the trace job reads.
  BASH_ENV: ${{ github.workspace }}/scripts/ci/tracing/shell.sh
  CI_TRACE_ENABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && (inputs.action == 'deploy' || inputs.action == 'reset'))
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 40
    # THE COMMIT THIS RUN TESTS, for the e2e job: the PR merged into main
    # (scripts/ci/preview-tested-commit.ts), so e2e tests the very commit deployed here even after
    # main moves on.
    outputs:
      tested-sha: ${{ steps.tested.outputs.sha }}
      head-sha: ${{ steps.tested.outputs.head-sha }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      # The preview proves what main will be after the merge: GitHub's test merge commit, or the
      # head alone when there is none (a conflict), which the PR body then says.
      - name: Check out the PR merged into main
        id: tested
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: node scripts/ci/preview-tested-commit.ts
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # `deploy` redeploys in place; `reset` deletes the preview first. Either way the
      # script ends by writing the URL and the operations into the PR body (GITHUB_TOKEN).
      - name: Deploy (or reset) the preview
        id: deploy
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_APPS: ${{ inputs.apps || 'all' }}
          PREVIEW_TESTED_COMMIT: ${{ steps.tested.outputs.description }}
        run: doppler run -- pnpm preview "$ACTION"

  # THE FULL MUTATING PROOF (docs/testing.md): this isolated preview owns the project-creating
  # e2e and browser suites. Production deployment runs only its deploy-script readiness probes.
  # It runs after every deploy that succeeded, and alone against the live preview on a dispatch
  # with action=e2e, where deploy is skipped: `always()` is what lets it start behind a skipped
  # deploy, `needs.deploy.result` what keeps it off a failed or cancelled one.
  e2e:
    name: e2e
    needs: deploy
    if: >-
      always() &&
      (needs.deploy.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && inputs.action == 'e2e'))
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    # TEST TELEMETRY (docs/testing.md#flakes-and-pinned-failures): both runners write their canonical
    # artifact here, each suite's flake lines go to its own directory (apps/os/scripts/preview.ts),
    # and the always-running steps after the suite normalize, summarize and upload them.
    env:
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
      TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
    steps:
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # The commit deploy deployed; alone on a dispatch with action=e2e, the head, then the PR
      # merged into main as deploy would resolve it.
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ needs.deploy.outputs.tested-sha || github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      # Telemetry is labelled with the PR head, whatever merge commit was tested.
      - name: Record the PR head for test telemetry
        env:
          HEAD_SHA: ${{ needs.deploy.outputs.head-sha }}
        run: echo "TEST_TELEMETRY_HEAD_SHA=${HEAD_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
      - name: Check out the PR merged into main
        if: needs.deploy.outputs.tested-sha == ''
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: node scripts/ci/preview-tested-commit.ts
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run the e2e suite against the preview
        # The trace's Test phase is this step (scripts/ci/tracing/tracing.ts).
        id: e2e
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: doppler run -- pnpm preview e2e
      # Fails when either runner left no complete artifact, and writes the specs and preview-e2e
      # suite summaries next to their flake lines. A cancelled run keeps its partial evidence without
      # reporting it as failures.
      - name: Check test telemetry and write the suite summaries
        if: always()
        env:
          TEST_TELEMETRY_EXPECTED_WORKSPACES: "iterate-root,os"
        run: pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites preview ${{ cancelled() && '--cancelled' || '' }}
      # One artifact per suite and job attempt, pulled by the flake dashboard's writer.
      - name: Upload specs flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-specs-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/flake-records/specs
          if-no-files-found: ignore
      - name: Upload preview e2e flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-preview-e2e-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/flake-records/preview-e2e
          if-no-files-found: ignore
      - name: Upload test telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-test-telemetry-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: error
      # THE BROWSER EVIDENCE (docs/depot-ci.md#browser-reports-from-artifacts), whatever the suite's
      # outcome: everything the run wrote under test-results/ — each failed spec's trace.zip,
      # screenshot and error-context.md under playwright-output/, playwright-results.json, the
      # telemetry — and Playwright's HTML report on its own. `depot ci artifacts download` fetches
      # either; `pnpm exec playwright show-report` / `show-trace` open them. The report alone is named
      # for the PR, not the attempt, and overwritten: it is the latest attempt's report, and each
      # attempt's own copy is in its test-results artifact.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-os-test-artifacts-attempt-${{ steps.attempt.outputs.id }}
          path: test-results
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload public Playwright HTML report
        if: ${{ always() && hashFiles('test-results/playwright-html/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-playwright-report
          path: test-results/playwright-html
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # THE CI TRACE (docs/ci-traces.md): the deploy and e2e jobs' Depot timings and `@@ci-trace` markers
  # as trace.html and trace.json, this job's artifact, and a "CI trace" commit status whose
  # description is the time to green (the e2e job's success) or to red (the first failed job), linking
  # to this job. After both jobs settle, whatever their outcome; never when neither ran.
  trace:
    name: trace
    needs: [deploy, e2e]
    if: >-
      always() && (needs.deploy.result != 'skipped' || needs.e2e.result != 'skipped')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Record the traced commit
        run: echo "CI_TRACE_STATUS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # The Depot organization token CI telemetry uses (Doppler _shared/preview) reads the workflow
      # and its jobs' logs; only `@@ci-trace` lines are kept.
      - name: Collect the deploy and e2e trace
        id: trace
        timeout-minutes: 5
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts current ci-trace.ignoreme
      - name: Upload the CI trace
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trace.outputs.artifact-name }}
          path: ci-trace.ignoreme/trace.*
          if-no-files-found: error
          retention-days: 30
      - name: Post the CI trace status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec trpc-cli scripts/ci/tracing/cli.ts publish ci-trace.ignoreme
