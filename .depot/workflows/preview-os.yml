# ONE DEPLOYMENT PER TESTED COMMIT of a pull request: a fresh set of plain Workers on the dev/preview
# account, apps/os and each app on top, `pr<n>-<sha7>-<app>` (envs.ts `previewDeployment`), deployed
# by the same build and `wrangler deploy` as prd. The script is apps/os/scripts/preview.ts. Five
# jobs, each a check named for what it proves:
#   Deploy preview      every push: first whether the PR changes a preview path
#                       (scripts/ci/preview-paths.ts `previewPaths`); a PR that changes none deploys
#                       nothing and passes. Otherwise it deploys the PR merged into main (the run's own
#                       commit, the merge commit Depot read this file from; the head alone on a
#                       dispatch whose PR conflicts, scripts/ci/preview-tested-commit.ts) as
#                       `pr<n>-<sha7>`: it folds the PR body's section into a previous commit's
#                       first, and writes its own section (the workers and their sign-in links) once
#                       it has landed. Its output `deployment` is the name the jobs after it use
#   E2E tests           after Deploy preview: the vitest e2e suite against the deployment, then its
#                       test telemetry and flake records. The rows tagged `slow` run only when the PR carries the `slow-e2e`
#                       label or edits one of them (SLOW_ROW_PATHS) (docs/testing.md#slow-rows)
#   Browser specs       beside E2E tests: the Playwright specs, the same way, and the Playwright
#                       report. One job definition, E2E tests', differing only in the suite it names
#   Clean up superseded beside the suites, once the deployment is ready: deletes this PR's older
#                       deployments (apps/os/scripts/preview-sweep.ts `planSupersededCleanup`). Never
#                       a verdict: what it leaves, the next run's cleanup or the nightly sweep takes
#   CI trace            after the deploy and the suites, whatever their outcome, reporting only: the
#                       CI trace (docs/ci-traces.md), an artifact plus the "CI trace" and "Playwright
#                       report" commit statuses, which open them in the ci-reports viewer
#
# E2E TESTS AND BROWSER SPECS ARE REQUIRED CHECKS (docs/pull-requests.md), so each reports on every
# pull request, and the workflow has no `paths` filter: GitHub leaves a required check "Pending" when
# a filter skips its workflow. A PR that changes no preview path skips both, which GitHub counts as
# passing. One that does, whose Deploy preview did not succeed, gets both red, never skipped: their
# `always()` starts them behind any deploy, and their first step fails without a deployed preview.
# Closing the PR deletes every deployment it has (preview-delete.yml); the nightly sweep of those
# whose PR closed without a delete, or that went stale, is preview-sweep.yml. What each push leaves
# behind, and what deletes it, whether the push before it deployed, failed or was cancelled:
# docs/dev-environments.md#second-pushes.
#
# Depot registers automatic triggers when this file is on the default branch. Every operation the PR
# body lists is a dispatch (docs/depot-ci.md#dispatch-a-checked-in-workflow):
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-os.yml --ref <branch> \
#     --input pull-request-number=<pr> --input action=deploy
# action = deploy | test | e2e | specs. deploy runs Deploy preview and then both suites, as a push
# does. test runs both suites against the PR's newest deployment, e2e the E2E tests alone, specs the
# Browser specs alone. A test-only action names its deployments by pull-request-number or, without
# one, by preview-name (`exp-jonas`, or CI's own `main`), tests that prefix's newest deployment, and
# runs the suite from the dispatched ref. A dispatch posts its checks on the ref's head commit,
# replacing that commit's checks of the same name, and a job it skips counts as passing there:
# dispatch e2e or specs alone from a scratch branch cut from main, never on a PR's branch or main,
# whose head would carry the result (docs/depot-ci.md#run-ci-without-a-pr).
# slow-rows = run | skip overrides what the PR's paths and label say about the rows tagged `slow`:
# `--input action=e2e --input slow-rows=run` runs them against the PR's newest deployment.
# apps = all | none (the apps on top: dash, agents, notes, voice, kit, admin). Pull-request runs use
# all so every client is usable against the deployment's apps/os.
#
# Concurrency per PR. The PR's next push cancels the run in progress, in whatever job, since its
# verdict would be out of date; Depot starts none of the cancelled run's `always()` jobs, and the
# next run deploys a deployment of its own. A dispatch cancels nothing: it queues behind the run in
# progress. preview-delete.yml takes the same group and cancels nothing, so a PR's delete waits for
# its deploy and tests to settle.
# The only Depot secret is DOPPLER_TOKEN; Doppler os/preview supplies the Cloudflare
# credentials and the two secrets each apps/os deploy ships (APP_CONFIG, APP_CONFIG_SECRETS__KEY).

name: Preview OS

permissions:
  contents: read
  pull-requests: write
  # The trace job's "CI trace" and "Playwright report" commit statuses.
  statuses: write

on:
  # Every pull request, without a `paths` filter: Deploy preview decides whether it gets a preview.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number
        required: false
        type: string
        default: ""
      preview-name:
        description: "A prefix whose newest deployment to test, without a PR number: action test, e2e or specs"
        required: false
        type: string
        default: ""
      action:
        description: deploy | test | e2e | specs
        required: false
        type: string
        default: deploy
      apps:
        description: "The apps on top (dash, agents, notes, voice, kit, admin): all = every client, none"
        required: false
        type: string
        default: all
      slow-rows:
        description: "The e2e rows tagged slow: run | skip; empty = as the PR's paths and slow-e2e label say"
        required: false
        type: string
        default: ""

concurrency:
  group: preview-os-${{ github.event.pull_request.number || inputs.pull-request-number || 'none' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
  # CI TRACE MARKERS (docs/ci-traces.md): every run step's start and exit, and the test reporters'
  # lifecycle records, as `@@ci-trace` lines in the Depot logs the trace job reads.
  BASH_ENV: ${{ github.workspace }}/scripts/ci/tracing/shell.sh
  CI_TRACE_ENABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && inputs.action == 'deploy')
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 40
    # THE COMMIT THIS RUN TESTS, for the test jobs: the PR merged into main
    # (scripts/ci/preview-tested-commit.ts), so they test the very commit deployed here even after
    # main moves on, and the deployment's name, `pr<n>-<sha7>` of it. `preview` is false for a PR
    # that changes no preview path.
    outputs:
      tested-sha: ${{ steps.tested.outputs.sha }}
      head-sha: ${{ steps.tested.outputs.head-sha }}
      preview: ${{ steps.changes.outputs.preview }}
      deployment: ${{ steps.deploy.outputs.deployment }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      # The preview proves what main will be after the merge: on a push, this run's own commit (the
      # merge commit this workflow file was read from, so the code and the workflow are one tree);
      # on a dispatch, GitHub's current test merge commit, or the head alone when there is none (a
      # conflict), which the PR body then says.
      - name: Check out the PR merged into main
        id: tested
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_RUN_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: node scripts/ci/preview-tested-commit.ts
      # A push that changes no preview path deploys nothing, and the steps after this skip; a
      # dispatch deploys whatever it changes.
      - name: Decide whether the PR changes a preview path
        id: changes
        if: github.event_name == 'pull_request'
        run: node scripts/ci/preview-paths.ts changes
      - name: Reconcile dependencies (baked)
        if: steps.changes.outputs.preview != 'false'
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        if: steps.changes.outputs.preview != 'false'
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # A deployment of this commit's own, whatever the PR had before; the script ends by writing
      # the URL and the operations into the PR body (GITHUB_TOKEN), and names the deployment in
      # this step's `deployment` output.
      - name: Deploy the preview
        id: deploy
        if: steps.changes.outputs.preview != 'false'
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_APPS: ${{ inputs.apps || 'all' }}
          # the PR head, which a template-changing PR's quick-launch links read the template at
          PREVIEW_HEAD_SHA: ${{ steps.tested.outputs.head-sha }}
        run: doppler run -- pnpm preview deploy

  # THE TWO SUITES, E2E tests and Browser specs: one job each, side by side after the deploy, and ONE
  # DEFINITION. Browser specs runs E2E tests' runner and steps (the `suite-runner` and `suite-steps`
  # anchors); the two differ only in the suite their env names and in which dispatch skips them.
  # E2E tests is the full mutating proof (docs/testing.md): the vitest e2e suite, whose project-
  # creating rows this isolated preview owns (production runs only its deploy-script readiness
  # probes). Browser specs is the browser proof: the root Playwright specs (specs/AGENTS.md) against
  # the preview and its apps on top, and the Playwright report.
  #
  # REQUIRED CHECKS: each skips only for a PR that changes no preview path, or a dispatch of the other
  # suite alone. `always()` starts it behind any deploy, and its first step fails it when there is no
  # deployed preview to test: a failed or cancelled deploy, or a test-only dispatch that names none.
  #
  # 2x8 RUNNERS: both suites wait on a remote preview. On 4x16 they peaked at 2.1 vCPUs and 3.2 GB,
  # and on 2x8 their p50 is within 6 s of 4x16's (measured 2026-09-24;
  # docs/depot-ci.md#reliability-defaults).
  e2e:
    name: E2E tests
    needs: deploy
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && needs.deploy.outputs.preview != 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'specs'))
    runs-on: &suite-runner
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    env:
      # THE SUITE: `pnpm preview <suite>`, its flake records' suite, and the workspace its telemetry
      # names. Which rows tagged `slow` run: docs/testing.md#slow-rows.
      SUITE: e2e
      FLAKE_SUITE: preview-e2e
      TEST_TELEMETRY_EXPECTED_WORKSPACES: os
      # TEST TELEMETRY (docs/testing.md#flakes-and-pinned-failures): the runner writes its canonical
      # artifact here, its flake lines go to its suite's directory (apps/os/scripts/preview.ts), and
      # the steps after the suite normalize, summarize and upload them, whatever its outcome.
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
      TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
    steps: &suite-steps
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Require a deployed preview
        if: >-
          needs.deploy.result != 'success' &&
          !(github.event_name == 'workflow_dispatch' && (inputs.action == 'test' || inputs.action == env.SUITE) && (inputs.pull-request-number != '' || inputs.preview-name != ''))
        env:
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          echo "Deploy preview ${DEPLOY}, so there is no preview of this commit to test."
          echo "A dispatch of action test, e2e or specs names one: pull-request-number or preview-name."
          exit 1
      # The commit Deploy preview deployed; on a test-only dispatch, the PR's head, then the PR
      # merged into main as a deploy would resolve it, or the dispatched ref for a preview by name.
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ needs.deploy.outputs.tested-sha || github.event.pull_request.head.sha || (inputs.pull-request-number != '' && format('refs/pull/{0}/head', inputs.pull-request-number)) || github.sha }}
      # Telemetry is labelled with the PR head, whatever merge commit was tested.
      - name: Record the PR head for test telemetry
        env:
          HEAD_SHA: ${{ needs.deploy.outputs.head-sha }}
        run: echo "TEST_TELEMETRY_HEAD_SHA=${HEAD_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
      - name: Check out the PR merged into main
        if: needs.deploy.outputs.tested-sha == '' && inputs.pull-request-number != ''
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: node scripts/ci/preview-tested-commit.ts
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run the suite against the preview
        # The trace's Test phase is this step (scripts/ci/tracing/tracing.ts).
        id: suite
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # the deployment the deploy job made; empty on a test-only dispatch, which tests the newest
          # deployment of the PR's prefix, or of preview-name's when there is no PR number
          PREVIEW_DEPLOYMENT: ${{ needs.deploy.outputs.deployment }}
          PREVIEW_NAME: ${{ inputs.preview-name }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          # the e2e suite's rows tagged `slow`; the specs have none
          E2E_SLOW_ROWS: ${{ inputs.slow-rows }}
        run: doppler run -- pnpm preview "$SUITE"
      # Fails when the runner left no complete artifact, and writes the suite summary next to its
      # flake lines. A cancelled run keeps its partial evidence without reporting it as failures.
      # After the suite started only: without a preview there is nothing to keep.
      - name: Check test telemetry and write the suite summary
        if: always() && steps.suite.outcome != 'skipped'
        run: pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites "$FLAKE_SUITE" ${{ cancelled() && '--cancelled' || '' }}
      # THE TEST EVIDENCE FOLDER (docs/test-evidence.md): test-results/ holds everything this job
      # attempt's tests left, and target.json the deployment they ran against. This adds one row per
      # test (tables/tests.parquet), then manifest.json: the run's result (from the suite's step and
      # the finalizer's check), the tested commit and tree, the job attempt and every file's sha256.
      # Neither this nor the upload decides the job; the tests did.
      # After the suite started only: a job whose guard found no preview has no folder.
      - name: Write the test evidence manifest
        id: evidence-write
        if: always() && steps.suite.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TEST_EVIDENCE_STEPS: ${{ env.SUITE }}=${{ steps.suite.outcome }}
        run: pnpm tsx scripts/ci/test-evidence.ts write ${{ cancelled() && '--cancelled' || '' }}
      # THE UPLOADS, side by side: each only reads test-results/, and `fail-fast: false` lets every
      # one finish whatever another does (docs/depot-ci.md#parallel-steps).
      - fail-fast: false
        parallel:
          # With the Cloudflare API token preview deploys use (Doppler _shared/preview), as S3 keys.
          # A cancelled or timed-out job's folder too: its manifest says so, and it gets no tables/
          # copy. A failure is a warning and a line of the job's summary, never the job's result.
          - name: Upload the test evidence to R2
            id: evidence-upload
            if: ${{ always() && hashFiles('test-results/manifest.json') != '' }}
            continue-on-error: true
            timeout-minutes: 3
            env:
              DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            run: doppler run --project _shared --config preview -- pnpm tsx scripts/ci/test-evidence.ts upload
          # One artifact per suite and job attempt; PR time to green reads its suite summary.
          - name: Upload flake records
            if: always() && steps.suite.outcome != 'skipped'
            uses: actions/upload-artifact@v4
            with:
              name: flake-records-${{ env.FLAKE_SUITE }}-attempt-${{ steps.attempt.outputs.id }}
              path: test-results/flake-records/${{ env.FLAKE_SUITE }}
              if-no-files-found: ignore
          - name: Upload test telemetry artifacts
            if: always() && steps.suite.outcome != 'skipped'
            uses: actions/upload-artifact@v4
            with:
              name: preview-test-telemetry-attempt-${{ steps.attempt.outputs.id }}
              path: test-results/ci-telemetry
              include-hidden-files: true
              if-no-files-found: error
          # EVERYTHING THE RUN WROTE under test-results/, whatever the suite's outcome
          # (docs/depot-ci.md#browser-reports-from-artifacts): the telemetry, and for the specs each
          # failed spec's trace.zip, screenshot and error-context.md under playwright-output/ and
          # playwright-results.json.
          - name: Upload results
            if: always() && steps.suite.outcome != 'skipped'
            uses: actions/upload-artifact@v4
            with:
              name: preview-os-test-artifacts-attempt-${{ steps.attempt.outputs.id }}
              path: test-results
              include-hidden-files: true
              if-no-files-found: error
          # The specs' Playwright HTML report on its own (only they write one), which the trace job
          # links from the "Playwright report" status (its `public-` name lets the ci-reports viewer
          # serve it). Named for the PR, not the attempt, and overwritten: it is the latest attempt's
          # report, and each attempt's own copy is in its test-results artifact.
          - name: Upload public Playwright HTML report
            if: ${{ always() && hashFiles('test-results/playwright-html/index.html') != '' }}
            uses: actions/upload-artifact@v4
            with:
              name: public-playwright-report
              path: test-results/playwright-html
              if-no-files-found: error
              retention-days: 30
              overwrite: true
      # Either step that failed before it could say why (Doppler, pnpm, its timeout) gets its
      # warning and summary line here; one that reported itself is left alone.
      - name: Report a test evidence step that could not
        if: ${{ always() && (steps.evidence-write.outcome == 'failure' || steps.evidence-upload.outcome == 'failure') }}
        run: bash scripts/ci/test-evidence-unreported.sh "${{ steps.evidence-write.outcome }}" "${{ steps.evidence-upload.outcome }}"

  specs:
    name: Browser specs
    needs: deploy
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && needs.deploy.outputs.preview != 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'e2e'))
    runs-on: *suite-runner
    timeout-minutes: 30
    env:
      SUITE: specs
      FLAKE_SUITE: specs
      TEST_TELEMETRY_EXPECTED_WORKSPACES: iterate-root
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
      TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
    steps: *suite-steps

  # THE PR'S OLDER DEPLOYMENTS, deleted once this run's is ready (apps/os/scripts/preview.ts
  # `cleanup-superseded`): beside the suites, never gating them. It deletes only deployments of this
  # PR whose members were all created before this run's, so a later push's, in flight, stays. A
  # cleanup the next push cancels is the next run's to redo; what one leaves, the nightly sweep takes.
  cleanup:
    name: Clean up superseded
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.deployment != ''
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ needs.deploy.outputs.tested-sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Delete this PR's superseded deployments
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_DEPLOYMENT: ${{ needs.deploy.outputs.deployment }}
        run: doppler run -- pnpm preview cleanup-superseded

  # THE CI TRACE (docs/ci-traces.md), reporting only: the Depot timings and `@@ci-trace` markers of
  # the jobs it needs as trace.html and trace.json, this job's artifact, then two commit statuses
  # opening the ci-reports viewer (apps/ci-reports): "CI trace", whose description is the time to
  # green (the last test job's success) or to red (the first failed job), and "Playwright report",
  # the Browser specs job's HTML report. After the three settle, whatever their outcome; never when
  # none ran, nor for a PR that changes no preview path. Main OS e2e has the same job
  # (scripts/ci/depot-workflows.test.ts keeps them alike).
  trace:
    name: CI trace
    needs: [deploy, e2e, specs]
    if: >-
      always() && needs.deploy.outputs.preview != 'false' &&
      (needs.deploy.result != 'skipped' || needs.e2e.result != 'skipped' || needs.specs.result != 'skipped')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      # The tree deploy tested, which on a push is the one this file was read from, so the tracing
      # scripts are this workflow's own; the statuses still go on the PR head.
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ needs.deploy.outputs.tested-sha || github.event.pull_request.head.sha || (inputs.pull-request-number != '' && format('refs/pull/{0}/head', inputs.pull-request-number)) || github.sha }}
      - name: Record the traced commit
        env:
          HEAD_SHA: ${{ needs.deploy.outputs.head-sha }}
        run: echo "CI_TRACE_STATUS_SHA=${HEAD_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # The Depot organization token CI telemetry uses (Doppler _shared/preview) reads the workflow
      # and its jobs' logs; only `@@ci-trace` lines are kept.
      - name: Collect the trace
        id: trace
        timeout-minutes: 5
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts current ci-trace.ignoreme
      # A re-run of this job alone keeps the execution, so the name, of the run it traces; without
      # overwrite the upload fails and the report statuses are never posted.
      - name: Upload the CI trace
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trace.outputs.artifact-name }}
          path: ci-trace.ignoreme/trace.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      # Finds both artifacts in Depot by name, so it runs after the upload.
      - name: Post the report statuses
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts publish ci-trace.ignoreme
