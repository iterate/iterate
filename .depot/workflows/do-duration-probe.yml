# Durable Objects duration alarm — hourly cost-runaway detection for both
# Cloudflare accounts (dev/preview and prd). Runs the probe from
# scripts/ci/do-duration-probe.ts via scripts/ci/do-duration-alert.ts,
# which trips on either signature of the DO billable-duration leak class
# (https://github.com/iterate/iterate/tree/6a9a48e2a/apps/os/tasks/do-duration-leak):
#
#   1. one invocation pinned for hours of wall-clock (leaked RPC session)
#   2. account-wide active time above a per-account hourly ceiling (the
#      2026-09-01 stream-DO wake-loop runaway: ~$300/hour, noticed only on
#      the bill after 28 hours — this workflow is the "never again")
#
# Every run rewrites the headline of the day's thread in Slack #error-pulse
# (one message per UTC day: latest hour, today's total, hours over the
# ceiling, per account). A breach in the last two hours or a probe that could
# not run is a reply in that thread. An account at its page tier (dev/preview
# $10/hour, prd 10 DO-hours/hour ≈ $0.06) also gets a new top-level message
# that @-mentions Jonas and names the top namespaces, at most every 3 hours
# while it lasts.
# The run goes red only when a probe could not run or Slack refused a post: a
# breach is paged, and a scheduled run reports on main's head commit, where
# red reads as "this commit broke".
#
# Test a branch, and the Slack hookup end to end, by dispatching it (a tiny
# threshold forces an alert and a page without the mention, marked 🧪 TEST RUN
# in the message):
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow do-duration-probe.yml \
#     --ref <branch> \
#     --input threshold-do-hours=1
#
# Depot registers automatic triggers when this file is on the default branch —
# branch-only changes to the `on:` block do not take effect until merged.
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN.

name: DO duration probe (Depot CI)

on:
  # Hourly, off the top of the hour, where deploys land.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      threshold-do-hours:
        description: >-
          Override BOTH accounts' active-time ceiling (DO-hours per hour).
          Empty uses the per-account defaults (dev/preview 500, prd 2).
          Set 1 to force an alert and test the Slack hookup.
        type: string
        default: ""

concurrency:
  group: do-duration-probe
  cancel-in-progress: false

env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  probe:
    name: DO duration / probe
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          # Scheduled runs always probe with the default branch's thresholds
          # and tooling; a dispatch tests the ref it names.
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Probe both accounts, alert on breach
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Empty on a schedule, and on a dispatch without the input: the per-account defaults.
          THRESHOLD_DO_HOURS: ${{ inputs.threshold-do-hours }}
        run: |-
          set -euo pipefail
          if [ -n "${THRESHOLD_DO_HOURS}" ]; then
            pnpm tsx scripts/ci/do-duration-alert.ts run --threshold-do-hours "${THRESHOLD_DO_HOURS}"
          else
            pnpm tsx scripts/ci/do-duration-alert.ts run
          fi
