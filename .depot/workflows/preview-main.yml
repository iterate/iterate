# Same preview deploy/readiness/tests/erase as PRs, using the ordinary preview pool.
# Let the active run finish. Depot keeps the newest pending push, so frequent
# merges cannot starve the dashboard of a complete baseline.
name: Preview Main

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # EXPERIMENT: branch dispatches must not serialize with or cancel main.
  group: ${{ github.ref_name == 'codex/experiment-preview-lease-cycling' && 'preview-lease-cycling' || 'preview-main' }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview main / deploy + e2e
    uses: ./.depot/workflows/preview-run.yml
    with:
      head-sha: ${{ github.sha }}
      all-apps: true
    secrets: inherit
