# Preview cleanup on PR close — the other half of the preview lifecycle in
# cloudflare-previews.yml. Cleanup lives in its own workflow because every run
# of a workflow re-emits all of its job check names on the head SHA: when
# deploy and cleanup shared one workflow with complementary `if:`s, the
# `closed`-event run re-reported "Preview / deploy + e2e" as skipped,
# clobbering the earlier success on every merged PR (GitHub displays the
# latest check run per name).
#
# The concurrency groups below match cloudflare-previews.yml for the same PR,
# so the two workflows still coordinate: closing a PR mid-deploy cancels the
# in-flight deploy run (cancel-in-progress on the shared workflow-level group)
# and the job-level lifecycle group serializes whatever remains. Cleanup never
# races a deploy for the same preview slot.
#
# Depot registers automatic triggers when this file is on the default branch —
# branch-only changes to the `on:` block do not take effect until merged.
#
# The only Depot secret is DOPPLER_TOKEN. GitHub supplies the job-scoped token;
# Doppler supplies every other credential.
#
# Deliberately NO `paths` filter: a closed PR that once held a slot must always
# attempt cleanup, even when the final PR diff is empty (full revert) or no
# longer matches deploy paths. Cleanup is a no-op when the semaphore leases
# nothing to the PR, so the extra runs are cheap; skipping one historically
# leaked the then-one-day lease (observed 2026-07-15: pr-2005 closed after a
# full revert and never released preview-1). Leases now expire after 3h.

name: Cloudflare Preview Cleanup (Depot CI)

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types:
      - closed

concurrency:
  group: cloudflare-previews-${{ github.event.pull_request.number || inputs.pull-request-number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Preview / cleanup
    runs-on: depot-ubuntu-24.04
    concurrency:
      group: cloudflare-preview-lifecycle-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Always run cleanup tooling from the default branch. The closed PR's
          # head may predate critical fixes (e.g. release-despite-teardown
          # failure in #1989). On 2026-07-14, cleanups for merged pr-1986/1987/1994
          # checked out the PR head, hit Cloudflare 429s mid-destroy, bailed before
          # releasing, and renewed the then-one-day lease — starving the fleet.
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Install Doppler CLI
        run: |-
          for i in 1 2 3; do curl -sfLS https://cli.doppler.com/install.sh | sh -s -- --no-package-manager && break; echo "Attempt $i failed, retrying in 5s..."; sleep 5; done
          doppler --version || { echo 'Failed to install Doppler CLI after 3 attempts'; exit 1; }
      - name: Preview / cleanup
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          doppler run --project _shared --config prd --preserve-env=GITHUB_TOKEN -- pnpm preview cleanup \
            --github-token "$GITHUB_TOKEN" \
            --pull-request-number "${{ github.event.pull_request.number }}"
