# A CLOSED PULL REQUEST'S DEPLOYMENTS, DELETED (`pnpm preview delete`, scripts/os/preview.ts):
# every `pr<n>-<sha7>` deployment Preview OS (preview-os.yml) made for the PR — its workers, KV
# namespaces, R2 bucket, D1 and Artifacts namespace — usually just the newest, since each run's
# cleanup deletes the ones before it. The PR body's section of links to them is folded first.
#
# Its own workflow, triggered only when a PR closes, so no push to an open PR carries it as a skipped
# job. It runs for the PRs that got a preview: its `paths` are the ones Preview OS's Deploy preview
# job deploys for (scripts/ci/preview-paths.ts `previewPaths`; depot-workflows.test.ts keeps them
# equal). It shares Preview OS's per-PR concurrency group, so a delete waits for that PR's in-flight
# deploy and tests to settle instead of racing them.
# A delete that never ran or failed is the nightly sweep's (preview-sweep.yml).
#
# Delete a PR's deployments by hand:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-delete.yml --ref main --input pull-request-number=<pr>
# Depot registers the `closed` trigger once this file is on the default branch. The only Depot
# secret is DOPPLER_TOKEN; Doppler os/preview supplies the Cloudflare credentials.

name: Preview delete

permissions:
  contents: read
  # the PR body's section, folded
  pull-requests: write

on:
  pull_request:
    types:
      - closed
    # scripts/ci/preview-paths.ts `previewPaths`, verbatim (it says why each is there).
    paths:
      - .depot/workflows/deploy-os.yml
      - .depot/workflows/deploy-dash.yml
      - .depot/workflows/deploy-agents.yml
      - .depot/workflows/deploy-notes.yml
      - .depot/workflows/deploy-docs.yml
      - .depot/workflows/deploy-admin.yml
      - .depot/workflows/deploy-voice.yml
      - .depot/workflows/deploy-kit.yml
      - .depot/workflows/preview-os.yml
      - core/os/**
      - configs/**
      - apps/dash/**
      - apps/agents/**
      - apps/notes/**
      - apps/docs/**
      - apps/admin/**
      - apps/voice/**
      - apps/kit/**
      - "!apps/kit/firmware/**"
      - test/**
      - packages/cli/**
      - packages/iterate/**
      - packages/agents/**
      - packages/voice/**
      - packages/docs/**
      - packages/shared/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - envs.ts
      - scripts/lib/**
      - scripts/os/**
      - .depot/actions/**
      - scripts/ci/toolchain.sh
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number
        required: true
        type: string

concurrency:
  group: preview-os-${{ github.event.pull_request.number || inputs.pull-request-number || 'none' }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}

defaults:
  run:
    shell: bash

jobs:
  delete:
    name: delete
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The delete finds the PR's deployments by name on the account, so any tree runs it: on a
      # close, the run's own commit (a merged PR's squash commit on main, or an unmerged PR's head);
      # on a dispatch from main, the PR's head (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout the PR's tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Setup
        uses: ./.depot/actions/setup
      - name: Delete the PR's deployments
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: doppler run --project os --config preview -- pnpm preview delete --pr "$PR_NUMBER"
