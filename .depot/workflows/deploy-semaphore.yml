name: Deploy Semaphore
permissions:
  contents: read
  deployments: write
concurrency:
  group: semaphore-${{ github.ref_name || 'prd' }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-semaphore.yml
      - apps/semaphore/**
      - packages/shared/**
      - packages/ui/**
      - packages/mock-http-proxy/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    outputs:
      public_url: ${{ steps.metadata.outputs.public_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project semaphore
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - id: metadata
        name: Resolve Semaphore deploy URL
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |-
          set -euo pipefail
          public_url="$(doppler run -- node -e 'const env=process.env; const appConfig=env.APP_CONFIG?.trim()?JSON.parse(env.APP_CONFIG):{}; console.log(env.APP_CONFIG_BASE_URL || appConfig.baseUrl || "");')"
          if [ -n "$public_url" ]; then
            echo "public_url=${public_url}" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy apps/semaphore
        working-directory: apps/semaphore
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm tsx ./alchemy.run.ts
  notify:
    needs:
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Notify Slack
        env:
          APP_DISPLAY_NAME: Semaphore
          PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ needs.deploy.result }}
