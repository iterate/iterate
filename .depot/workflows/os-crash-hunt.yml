# OS isolate crash hunt — nightly, against prd. The load-dependent rows of
# apps/os/e2e/isolate-ceilings-deployed.e2e.test.ts (concurrent readers, a large
# ephemeral fan-out, concurrent big appends, a poison facet) drive one context's Durable
# Object up to and past its 128 MiB isolate ceiling on purpose; they are opt-in
# (RUN_ISOLATE_CRASH_HUNT=1) so the deploy's e2e run stays deterministic. This is where
# they run: once a night, on the prd worker (no users; every row uses a fresh context),
# from the default branch's tooling. A red run posts to #error-pulse.
#
# Run it by hand: depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#   --workflow os-crash-hunt.yml --ref main
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN.

name: OS crash hunt
permissions:
  contents: read
on:
  # Nightly, off the hour (deploys land at :00, the DO probe at :41, the preview sweep at 04:37).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
concurrency:
  group: os-crash-hunt
  cancel-in-progress: false
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
jobs:
  crash-hunt:
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Hunt isolate crashes on os.iterate.com
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          WORKER_BASE_URL: https://os.iterate.com
          RUN_ISOLATE_CRASH_HUNT: "1"
        # The credentials come out of the deployment's APP_CONFIG in the environment
        # (apps/os/e2e/support/global-setup.ts).
        run: doppler run -- pnpm e2e isolate-ceilings --no-file-parallelism
  notify:
    needs:
      - crash-hunt
    if: always() && needs.crash-hunt.result == 'failure'
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Notify Slack
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: pnpm tsx scripts/ci/notify.ts workflow-failure
