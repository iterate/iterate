# THE PUBLIC COPY, BEFORE IT MERGES (scripts/ci/copybara.ts check, tasks/core-public-copy.md): a pull
# request that changes what iterate/os holds writes the copy it would make into a folder, pushing
# nothing, and runs the self-host recipe against it (install from the copy's own lockfile, build,
# dry-run deploy). So a change that would break the public copy's build is red here, before Deploy
# OS copies it after the merge.
#
# Its own workflow, off the required checks: Copybara fetches this commit from GitHub, and the path
# filter runs it only when the copy's files change.
name: Copy core/ (check)
permissions:
  contents: read
on:
  pull_request:
    paths:
      - .depot/workflows/copybara.yml
      - scripts/ci/copybara.ts
      - copybara/**
      - core/**
      - LICENSE
      - tsconfig.base.json
      - tsconfig.app.json
      - .nvmrc
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch: {}
concurrency:
  group: copybara-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  copybara:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      # THE RUN'S OWN COMMIT (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
      # the copy's own workspace file and lockfile (copybara/os/) match this commit's manifests
      - name: Check the copy's generated root files
        run: node scripts/ci/copybara.ts root --check
      # Copybara's jar is built for Java 25 (class file version 69): Temurin's, which sets JAVA_HOME
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      # the pull request's head, which GitHub has; a merge commit CI made, it would not
      - name: Copy into a folder and run the self-host recipe
        run: node scripts/ci/copybara.ts check --sha "${{ github.event.pull_request.head.sha || github.sha }}"
