# SHADCN DRIFT (scripts/ci/shadcn-drift.ts check): the vendored shadcn files (packages/ui's and
# apps/os's) are byte for byte what the pinned CLI's `shadcn add <item> -o` writes
# (packages/ui/AGENTS.md). A pull request that touches one of them, an input of the CLI in either
# folder (components.json, the pin in package.json, the tsconfig.json it resolves aliases with, the
# stylesheet it merges an item's CSS into) or this check asks the CLI's dry run for the exact
# content `add` would write, from shadcn's live registry, and fails on any file whose bytes differ,
# printing each file's diff. The fix is a refresh (`node scripts/ci/shadcn-drift.ts refresh`), never
# a hand edit.
#
# Why its own workflow: it calls shadcn's registry over the network, so it stays off the required
# checks and off every other pull request's time to green. The path filter runs it only where the
# answer can change; a registry blip fails it once, and a re-run asks again. Upstream moving with no
# pull request in sight is found by the next pull request that touches these files, or a refresh.
#
# Secrets (depot ci secrets --org 0p91s0lz49): none.
name: shadcn drift
permissions:
  contents: read
on:
  pull_request:
    paths:
      - .depot/workflows/shadcn-drift.yml
      - scripts/ci/shadcn-drift.ts
      - packages/ui/components.json
      - packages/ui/package.json
      - packages/ui/tsconfig.json
      - packages/ui/src/styles/globals.css
      - packages/ui/src/components/alert-dialog.tsx
      - packages/ui/src/components/avatar.tsx
      - packages/ui/src/components/badge.tsx
      - packages/ui/src/components/breadcrumb.tsx
      - packages/ui/src/components/button.tsx
      - packages/ui/src/components/card.tsx
      - packages/ui/src/components/checkbox.tsx
      - packages/ui/src/components/command.tsx
      - packages/ui/src/components/dialog.tsx
      - packages/ui/src/components/dropdown-menu.tsx
      - packages/ui/src/components/empty.tsx
      - packages/ui/src/components/field.tsx
      - packages/ui/src/components/input-group.tsx
      - packages/ui/src/components/input.tsx
      - packages/ui/src/components/label.tsx
      - packages/ui/src/components/native-select.tsx
      - packages/ui/src/components/select.tsx
      - packages/ui/src/components/separator.tsx
      - packages/ui/src/components/sheet.tsx
      - packages/ui/src/components/sidebar.tsx
      - packages/ui/src/components/skeleton.tsx
      - packages/ui/src/components/sonner.tsx
      - packages/ui/src/components/spinner.tsx
      - packages/ui/src/components/table.tsx
      - packages/ui/src/components/tabs.tsx
      - packages/ui/src/components/textarea.tsx
      - packages/ui/src/components/tooltip.tsx
      - packages/ui/src/hooks/use-mobile.ts
      - apps/os/components.json
      - apps/os/package.json
      - apps/os/tsconfig.json
      - apps/os/src/styles.css
      - apps/os/src/components/ui/avatar.tsx
      - apps/os/src/components/ui/button.tsx
      - apps/os/src/components/ui/checkbox.tsx
      - apps/os/src/components/ui/field.tsx
      - apps/os/src/components/ui/input.tsx
      - apps/os/src/components/ui/label.tsx
      - apps/os/src/components/ui/native-select.tsx
      - apps/os/src/components/ui/separator.tsx
      - apps/os/src/components/ui/spinner.tsx
  workflow_dispatch: {}
concurrency:
  group: shadcn-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shadcn-drift:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      # THE RUN'S OWN COMMIT (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
      - name: Compare the vendored files with shadcn add
        run: node scripts/ci/shadcn-drift.ts check
