# Runs the complete preview critical path N times consecutively on Depot:
# full-fleet deploy, then every e2e lane. It fails fast on the first functional
# failure, absorbed test retry, or run at/above five minutes. This is
# cloudflare-previews.yml repeated on the same runner shape, not a warm
# test-only approximation.
#
# On-demand only — dispatch the exact committed branch and name the PR:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-e2e-marathon.yml --ref <branch> \
#     --input pull-request-number=<pr>
#
# The only Depot secret is DOPPLER_TOKEN. GitHub supplies the job-scoped token;
# Doppler supplies every other credential.

name: Preview e2e marathon (Depot CI)

permissions:
  contents: read
  pull-requests: write
  statuses: read

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR whose preview slot to marathon
        required: true
      runs:
        description: consecutive zero-retry green runs required (empty = the script's default)
        required: false
      max-run-seconds:
        description: per-run proof ceiling (empty = PREVIEW_RUN_PROOF_BUDGET_SECS)
        required: false

# A marathon must never race the ordinary preview workflow or cleanup for the
# same PR. Queue behind an existing run; a newer PR event may cancel this stale
# proof through the same repository-wide group.
concurrency:
  group: cloudflare-previews-${{ inputs.pull-request-number }}
  cancel-in-progress: false

jobs:
  marathon:
    name: Preview e2e marathon
    # Match the production preview check exactly: every Vitest file can start
    # alongside Playwright and the app-level lanes on the 16-core host.
    runs-on: depot-ubuntu-24.04-16
    # 25 accepted runs cannot consume 125 minutes; this leaves bounded room for
    # setup and an externally stolen slot while the per-run watchdog diagnoses
    # a tail before the outer limit.
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Install Doppler CLI
        run: |-
          for i in 1 2 3; do curl -sfLS https://cli.doppler.com/install.sh | sh -s -- --no-package-manager && break; echo "Attempt $i failed, retrying in 5s..."; sleep 5; done
          doppler --version || { echo 'Failed to install Doppler CLI after 3 attempts'; exit 1; }
      - name: Marathon
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
          PR_NUMBER: ${{ inputs.pull-request-number }}
          # Empty inputs fall through to the script's own defaults, which the
          # e2e-policy guard keeps synced to budgets.ts.
          RUNS: ${{ inputs.runs }}
          MAX_RUN_DURATION_SECS: ${{ inputs.max-run-seconds }}
          LOG_DIR: /tmp/marathon
        # The loop exits non-zero on the first deploy/test failure, absorbed
        # test retry, skip, partial fleet, watchdog, or duration-budget breach.
        run: ./scripts/preview/flake-hunt-loop.sh
      - name: Normalize and send marathon test telemetry
        if: always()
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project _shared --config prd -- pnpm tsx scripts/ci/upload-test-telemetry.ts ${{ cancelled() && '--cancelled' || '' }}
      - name: Collect marathon test artifacts
        if: always()
        run: scripts/preview/collect-test-artifacts.sh test-results
      - name: Upload marathon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-e2e-marathon-logs
          path: test-results
          include-hidden-files: true
          if-no-files-found: error
