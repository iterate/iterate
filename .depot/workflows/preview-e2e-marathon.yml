# Runs the complete preview critical path N times consecutively on Depot:
# full-fleet deploy, then every e2e lane. It fails fast on the first functional
# failure or run at/above five minutes. This is cloudflare-previews.yml repeated
# on the same runner shape, not a warm test-only approximation.
#
# On-demand only — dispatch the exact committed branch and name the PR:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-e2e-marathon.yml --ref <branch> \
#     --input pull-request-number=<pr>
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN,
# ITERATE_BOT_GITHUB_TOKEN — same as cloudflare-previews.yml.

name: Preview e2e marathon (Depot CI)

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR whose preview slot to marathon
        required: true
      runs:
        description: consecutive green sub-five-minute runs required
        required: false
        default: "25"
      max-run-seconds:
        description: strict end-to-end duration ceiling per run
        required: false
        default: "300"

jobs:
  marathon:
    name: Preview e2e marathon
    # Match the production preview check exactly: every isolated Vitest file
    # gets a worker immediately alongside Playwright, TUI, and app-level lanes.
    runs-on: depot-ubuntu-24.04-64
    # 25 accepted runs cannot consume 125 minutes; this leaves bounded room for
    # setup and an externally stolen slot while the per-run watchdog diagnoses
    # a tail before the outer limit.
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Install Doppler CLI
        run: |-
          for i in 1 2 3; do curl -sfLS https://cli.doppler.com/install.sh | sh -s -- --no-package-manager && break; echo "Attempt $i failed, retrying in 5s..."; sleep 5; done
          doppler --version || { echo 'Failed to install Doppler CLI after 3 attempts'; exit 1; }
      - name: Marathon
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ITERATE_BOT_GITHUB_TOKEN || github.token }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
          RUNS: ${{ inputs.runs || '25' }}
          MAX_RUN_DURATION_SECS: ${{ inputs.max-run-seconds || '300' }}
          LOG_DIR: /tmp/marathon
        # The loop exits non-zero on the first deploy/test failure, skip,
        # partial fleet, watchdog, or duration-budget breach.
        run: ./scripts/preview/flake-hunt-loop.sh
      - name: Collect marathon test artifacts
        if: always()
        run: scripts/preview/collect-test-artifacts.sh test-results
      - name: Upload marathon logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview-e2e-marathon-logs
          path: test-results
          include-hidden-files: true
          if-no-files-found: ignore
