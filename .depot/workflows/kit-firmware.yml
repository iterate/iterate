name: Kit Firmware

# One GitHub release per device build, tagged kit-firmware/<device id>/<version>
# (apps/kit/scripts/firmware-release.ts; apps/kit/README.md "Firmware releases").
# The plan compares every device's firmware inputs with that device's newest release, so any
# later run (a firmware push, the daily schedule, a dispatch) releases what a failed run left behind.
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/kit-firmware.yml
      - scripts/depot-ci/esp-idf.sh
      - apps/kit/firmware/**
      - apps/kit/scripts/firmware-release.ts
      - apps/kit/src/firmware/catalog.ts
  pull_request:
    paths:
      - .depot/workflows/kit-firmware.yml
      - scripts/depot-ci/esp-idf.sh
      - apps/kit/firmware/**
      - apps/kit/scripts/firmware-release.ts
      - apps/kit/src/firmware/catalog.ts
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      devices:
        description: "changed: devices whose inputs changed since their newest release. all: every device not yet released at this commit (use after changing firmware-release.ts)."
        type: choice
        options:
          - changed
          - all
        default: changed

concurrency:
  group: kit-firmware-${{ github.head_ref || github.ref_name }}
  # Safe on main too: gh creates a release's tag only when it publishes the finished draft
  # (`gh release create --help`), so a cancelled run leaves no partial release and the newer
  # run plans every device again.
  cancel-in-progress: true

jobs:
  plan-firmware:
    name: Plan
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # THE RUN'S OWN COMMIT, the tree this workflow file was read from: on a pull request, its head
      # merged into main, so it builds the firmware main would build after the merge
      # (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests). The build job checks out the same.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          # The version counts main's first-parent commits; diffs reach each device's last release.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Show the publish job's tools
        run: gh --version && jq --version
      - id: plan
        name: Plan device builds
        env:
          DEVICES: ${{ inputs.devices || 'changed' }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node apps/kit/scripts/firmware-release.ts plan --devices "$DEVICES" --publish "$PUBLISH" --base "$BASE_SHA" >> "$GITHUB_OUTPUT"

  build-firmware:
    name: ${{ matrix.device }}
    needs: plan-firmware
    if: needs.plan-firmware.outputs.count != '0'
    strategy:
      fail-fast: false # one broken board never blocks the others' releases
      matrix: ${{ fromJSON(needs.plan-firmware.outputs.matrix) }}
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}
      # The image carries ESP-IDF (scripts/depot-ci/esp-idf.sh, the pin); a leg downloads it only
      # while that file differs from the image's, and then says so in a warning.
      - name: ESP-IDF (baked)
        run: scripts/depot-ci/esp-idf.sh ensure
      - name: Build
        env:
          DEVICE: ${{ matrix.device }}
          VERSION: ${{ needs.plan-firmware.outputs.version }}
          PREVIOUS: ${{ matrix.previous }}
        run: |-
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          node apps/kit/scripts/firmware-release.ts build --device "$DEVICE" \
            --version "$VERSION" --previous "$PREVIOUS" --out "$RUNNER_TEMP/kit-firmware"
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: kit-firmware-${{ matrix.device }}
          path: ${{ runner.temp }}/kit-firmware/release
          if-no-files-found: error

  publish-firmware:
    name: Publish
    needs:
      - plan-firmware
      - build-firmware
    if: always() && needs.plan-firmware.result == 'success' && needs.plan-firmware.outputs.count != '0' && needs.build-firmware.result != 'cancelled'
    permissions:
      contents: write # the workflow's only writer: it checks out nothing and runs only gh and jq on the built files
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: kit-firmware-*
          path: dist
      - name: Publish releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
          VERSION: ${{ needs.plan-firmware.outputs.version }}
        run: |-
          set -euo pipefail
          shopt -s nullglob
          for release in dist/kit-firmware-*/; do
            tag=$(jq -r .tag "$release/release.json")
            # The build wrote the plan's version into both; anything else is another run's file.
            if [[ ! "$tag" =~ ^kit-firmware/[a-z0-9-]+/${VERSION}$ ]] || [ "$(jq -r .version "$release/assets/manifest.json")" != "$VERSION" ]; then
              echo "::error::$release holds $tag, not a kit-firmware release at $VERSION."
              exit 1
            fi
            if [ "$PUBLISH" != true ]; then echo "Would publish $tag:"; ls -l "$release/assets"; continue; fi
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released."; continue; fi
            gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
              --title "$(jq -r .title "$release/release.json")" \
              --notes-file "$release/notes.md" "$release"/assets/*
          done
      # End to end: production Kit (apps/kit/src/firmware/firmware-proxy.ts) serves every published
      # file byte for byte. A fresh release can take a moment to download, hence the retries.
      - name: Check Kit serves the new releases
        if: github.ref == 'refs/heads/main'
        run: |-
          set -euo pipefail
          shopt -s nullglob
          for release in dist/kit-firmware-*/; do
            kit_url=$(jq -r .kitUrl "$release/release.json")
            for file in "$release"/assets/*; do
              curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/served" "$kit_url$(basename "$file")"
              cmp "$RUNNER_TEMP/served" "$file"
            done
            echo "Kit serves $(jq -r .tag "$release/release.json") at $kit_url."
          done

  # A job, not a final step: it must also report a failed plan (after which nothing else runs), and
  # the publish job's boundary is that it checks out and runs no repository code.
  notify:
    needs:
      - plan-firmware
      - build-firmware
      - publish-firmware
    if: always() && github.ref == 'refs/heads/main' && (needs.plan-firmware.result == 'failure' || needs.build-firmware.result == 'failure' || needs.publish-firmware.result == 'failure')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
      PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Notify Slack
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: pnpm tsx scripts/ci/notify.ts workflow-failure
