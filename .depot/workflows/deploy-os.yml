name: Deploy OS
permissions:
  contents: read
  deployments: write
  statuses: write
concurrency:
  group: os-${{ github.ref_name || 'prd' }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-os.yml
      - envs.ts
      - scripts/lib/**
      - apps/os/**
      - apps/auth/**
      - apps/auth-contract/**
      - apps/os/src/domains/streams/**
      - packages/shared/**
      - packages/ui/**
      - packages/mock-http-proxy/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    outputs:
      public_url: ${{ steps.metadata.outputs.public_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - id: metadata
        name: Resolve OS deploy URL
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |-
          set -euo pipefail
          public_url="$(doppler run -- node -e 'const env=process.env; const appConfig=env.APP_CONFIG?.trim()?JSON.parse(env.APP_CONFIG):{}; console.log(env.APP_CONFIG_BASE_URL || appConfig.baseUrl || "");')"
          if [ -n "$public_url" ]; then
            echo "public_url=${public_url}" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy apps/os
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Teed so the size-report step below can parse wrangler's
        # "Total Upload" line out of the deploy output.
        run: |-
          set -euo pipefail
          doppler run -- pnpm run-script deploy 2>&1 | tee /tmp/deploy-os.log
      # Publishes the deployed bundle size as a worker-size/os commit status;
      # PR preview tables read it back as the "vs main" baseline
      # (scripts/preview/preview.ts). Never fails the deploy.
      - name: Report worker size
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.ITERATE_BOT_GITHUB_TOKEN || github.token }}
          APP_SLUG: os
          DEPLOY_LOG_FILE: /tmp/deploy-os.log
        run: pnpm tsx scripts/ci/report-worker-size.ts
  notify:
    needs:
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Notify Slack
        env:
          APP_DISPLAY_NAME: OS
          PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ needs.deploy.result }}
