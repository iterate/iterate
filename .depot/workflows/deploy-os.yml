name: Deploy OS
permissions:
  contents: read
concurrency:
  # Every ref deploys to the same production Worker (os-prd:
  # os.iterate.com, mcp.iterate.com, *.iterate.app). Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-os-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-os.yml
      - apps/os/**
      # `**` does not descend into a dot directory, and sqlfu's typed queries ship in the Worker
      - apps/os/src/**/.generated/**
      # Never in the Worker or its deploy: the app's docs (not public/setup-prompt.md, which prd
      # serves), its tests, benches and perf suite, and the preview and soak scripts. Preview OS and
      # Main OS e2e still run for them.
      - "!apps/os/*.md"
      - "!apps/os/docs/**"
      - "!apps/os/e2e/**"
      - "!apps/os/**/*.test.ts"
      - "!apps/os/__workers-tests__/**"
      - "!apps/os/bench/**"
      - "!apps/os/perf/**"
      - "!apps/os/scripts/preview*.ts"
      - "!apps/os/scripts/e2e-soak.ts"
      - configs/**
      - packages/iterate/**
      - envs.ts
      - scripts/lib/**
      - packages/shared/**
      - packages/ui/**
      # A root dependency resolution can change the Worker bundle even when no
      # application source path moved.
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      # `/version` answers `<version id> <origin>` (apps/os/src/worker.ts): the id prd serves before
      # this deploy, so the host check waits for the new one. Empty when prd does not answer.
      - name: Read the version prd serves
        id: previous
        run: echo "version=$(curl -fsS --max-time 10 https://os.iterate.com/version | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The Doppler project is envs.ts OS_DOPPLER_PROJECT; the deployed Cloudflare Worker is
      # os-prd.
      - name: Deploy apps/os
        id: deploy
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm run-script deploy --env prd
      # READ-ONLY, right after the deploy (scripts/ci/prd-post-deploy-check.ts): once `/version` names
      # the new version (≤ 60 s), one GET of each production project host
      # (scripts/ci/prd-post-deploy-check.ts PRD_PROJECT_HOST_URLS), four tries 10 s apart while it looks down. A host still
      # answering 421 or 5xx, or not at all, or a `/version` that never moves, pages #error-pulse and
      # fails this workflow. Faults on the new version are the prd fault alarm's (prd-fault-alarm.yml,
      # every 15 minutes).
      - name: Check the project hosts
        id: check
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: node scripts/ci/prd-post-deploy-check.ts check --previous-version "${{ steps.previous.outputs.version }}"
      # The deploy's own post (scripts/ci/notify.ts): once the whole job succeeded, a reply to its
      # merge's line in #ci; a deploy that failed, was cancelled or timed out pages #error-pulse,
      # unless the host check paged already. `always()`, because `!cancelled()` is false once the job
      # is cancelled, and a timeout ends the job by cancelling it. A failed post never turns the deploy
      # red. Any run on main posts, a dispatched redeploy too.
      - name: Post the deploy's line
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_DISPLAY_NAME: OS
        run: node scripts/ci/notify.ts deploy-success
      - name: Page the failed deploy
        if: ${{ always() && (steps.deploy.outcome != 'success' || (steps.check.outcome != 'success' && steps.check.outputs.paged != 'true')) && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: OS
          UPLOADED: ${{ steps.deploy.outcome }}
        run: node scripts/ci/notify.ts deploy-failure

  # THE COPYBARA COPIES, an experiment (tasks/copybara0929-experiment.md): once this commit deployed,
  # each one-way copy in copybara/copy.bara.sky catches up to it (scripts/ci/copybara.ts). A job of
  # its own, so a failed copy shows red here but never touches the deploy or its posts, and pages
  # nobody.
  copybara:
    name: Copybara copies
    needs: deploy
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production workflow never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      # iterate/os's own workspace file and lockfile (copybara/os/) match this commit's manifests
      - name: Check the copy's generated root files
        run: node scripts/ci/copybara.ts root --check
      # Copybara's jar is built for Java 25 (class file version 69), which Depot's stock image lacks:
      # Temurin's, which also sets JAVA_HOME
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      # The script reads the iterate App's key from Doppler os/prd, like the deploy.
      - name: Copy up to the deployed commit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: node scripts/ci/copybara.ts sync --sha "$GITHUB_SHA"
