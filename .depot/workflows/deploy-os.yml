name: Deploy OS
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same production Worker (os-prd:
  # os.iterate.com, mcp.iterate.com, *.iterate.app). Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-os-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-os.yml
      - apps/os/**
      # `**` does not descend into a dot directory, and sqlfu's typed queries ship in the Worker
      - apps/os/src/**/.generated/**
      # Never in the Worker or its deploy: the app's docs (not public/setup-prompt.md, which prd
      # serves), its tests, benches and perf suite, and the preview and soak scripts. Preview OS and
      # Main OS e2e still run for them.
      - "!apps/os/*.md"
      - "!apps/os/docs/**"
      - "!apps/os/e2e/**"
      - "!apps/os/**/*.test.ts"
      - "!apps/os/__workers-tests__/**"
      - "!apps/os/bench/**"
      - "!apps/os/perf/**"
      - "!apps/os/scripts/preview*.ts"
      - "!apps/os/scripts/e2e-soak.ts"
      - configs/**
      - packages/iterate/**
      - envs.ts
      - scripts/lib/**
      # Not scripts/depot-ci: it reconciles installs from the frozen lockfile and never changes the
      # bundle. Preview OS and Main OS e2e run for it.
      - packages/shared/**
      - packages/ui/**
      # A root dependency resolution can change the Worker bundle even when no
      # application source path moved.
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  deploy:
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # The Doppler project is envs.ts OS_DOPPLER_PROJECT; the deployed Cloudflare Worker is
      # os-prd.
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # `/version` answers `<version id> <origin>` (apps/os/src/worker.ts): the id prd serves before
      # this deploy, so the host check waits for the new one. Empty when prd does not answer.
      - name: Read the version prd serves
        id: previous
        run: echo "version=$(curl -fsS --max-time 10 https://os.iterate.com/version | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Deploy apps/os
        id: deploy
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy --env prd
      # READ-ONLY, right after the deploy (scripts/ci/prd-post-deploy-check.ts): once `/version` names
      # the new version (≤ 60 s), one GET of each production project host
      # (scripts/ci/prd-post-deploy-check.ts PRD_PROJECT_HOST_URLS), four tries 10 s apart while it looks down. A host still
      # answering 421 or 5xx, or not at all, or a `/version` that never moves, pages #error-pulse and
      # fails this workflow. Faults on the new version are the prd fault alarm's (prd-fault-alarm.yml,
      # every 15 minutes).
      - name: Check the project hosts
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm tsx scripts/ci/prd-post-deploy-check.ts check --previous-version "${{ steps.previous.outputs.version }}"
      # The deploy's own result to #ci; a deploy that failed, was cancelled or hit the job's timeout
      # posts failure. `always()`, because `!cancelled()` is false once the job is cancelled, and a
      # timeout ends the job by cancelling it.
      - name: Notify Slack
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: OS
          PUBLIC_URL: https://os.iterate.com
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
