# The ci-reports viewer (apps/ci-reports, docs/ci-traces.md): the Worker the "CI trace" and
# "Playwright report" commit statuses open. CI tooling on the dev/preview account; Doppler
# _shared/preview supplies its Cloudflare credentials and the Depot token it ships as a secret.
name: Deploy ci-reports
permissions:
  contents: read
concurrency:
  group: deploy-ci-reports-production
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/deploy-ci-reports.yml
      - apps/ci-reports/**
      - packages/shared/**
      - core/lib/**
      - envs.ts
      - scripts/lib/**
      - pnpm-lock.yaml
  workflow_dispatch:
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      # The deploy script ends by smoking the viewer's index.
      - name: Deploy apps/ci-reports
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm --dir apps/ci-reports run-script deploy --env ci
