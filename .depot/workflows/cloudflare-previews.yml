# Preview deploy + e2e on open/reopen/synchronize lives here on Depot CI;
# cleanup on close lives in cloudflare-preview-cleanup.yml. Depot CI picks up
# jobs in ~7s where GitHub Actions runner assignment took 20s-3m39s (measured
# 2026-07-02, once ~40min during a webhook incident).
#
# Cleanup is a SEPARATE workflow because every run of a workflow re-emits all
# of its job check names on the head SHA: when deploy and cleanup shared this
# file with complementary `if:`s, the `closed`-event run re-reported
# "Preview / deploy + e2e" as skipped, clobbering the earlier success on every
# merged PR (GitHub displays the latest check run per name). The two workflows
# still coordinate through the same concurrency groups (copied verbatim in the
# cleanup file): closing a PR mid-deploy cancels the in-flight deploy run
# (cancel-in-progress on the shared workflow-level group) and the job-level
# lifecycle group serializes whatever remains. The two never race the same
# preview slot.
#
# Depot registers automatic triggers when this file is on the default branch —
# branch-only changes to the `on:` block do not take effect until merged. Test
# a branch with:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow cloudflare-previews.yml --ref <branch> \
#     --input pull-request-number=<pr>
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN,
# ITERATE_BOT_GITHUB_TOKEN.
#
# Keep the `paths` list below in sync with `cloudflarePreviewSharedPaths` +
# `cloudflarePreviewAdditionalTriggerPaths` + each app's `paths` in
# scripts/preview/preview.ts (asserted in scripts/preview/preview.test.ts).

name: Cloudflare Previews (Depot CI)

# Draft PRs don't claim a preview slot unless they ask — the `preview` label,
# marking ready for review, or a manual dispatch (dispatch passes
# --allow-draft below). The policy lives in scripts/preview/preview.ts
# (decideDraftPreviewPolicy) where it's unit-tested; the trigger types beyond
# open/reopen/synchronize just make sure the script runs whenever a PR's
# draft or label state changes, so it can claim a slot or give one back.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
    paths:
      - .depot/workflows/cloudflare-previews.yml
      - .bun-version
      - packages/shared/**
      - packages/ui/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - scripts/preview/**
      - envs.ts
      - scripts/lib/**
      - apps/auth-example/**
      - apps/os/**
      - specs/**
      - playwright.config.ts
      - apps/mobile/**
      - packages/iterate/**
      - apps/auth/**
      - apps/auth-contract/**
      - apps/os/src/domains/streams/**
      - apps/semaphore/**
      - apps/streams-example-app/**
      - apps/dummy-petshop/**
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number to deploy + test
        required: true

concurrency:
  group: cloudflare-previews-${{ github.event.pull_request.number || inputs.pull-request-number }}
  cancel-in-progress: true

jobs:
  preview:
    # Label events for anything but the preview opt-in label change nothing
    # about the preview lifecycle — skip the checkout+install entirely.
    if: |-
      (github.event.action != 'labeled' || github.event.label.name == 'preview') &&
        (github.event.action != 'unlabeled' || github.event.label.name == 'preview')
    name: Preview / deploy + e2e
    # The overlapping test pools peaked below ten cores on the 32-core runner;
    # use the supported 16-core shape and keep allocation out of the long tail.
    runs-on: depot-ubuntu-24.04-16
    # Hard backstop on one attempt. Each parallel sub-lane retains its own
    # tighter watchdog; this outer bound catches setup, deploy, and reporting
    # runaways while leaving enough time to preserve failure artifacts.
    timeout-minutes: 20
    concurrency:
      group: cloudflare-preview-lifecycle-${{ github.event.pull_request.number || inputs.pull-request-number }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Permanent breaking-change floor: an old branch would deploy Auth first,
      # then fail or deploy an OS revision that cannot call the default RPC
      # entrypoint. Refuse before any app or credential is touched. This is an
      # epoch assertion, not a compatibility path; rebase is the only remedy.
      - name: Enforce preview deployment epoch
        run: |-
          set -euo pipefail
          expected="os-auth-rpc-v1"
          actual="$(cat scripts/preview/deployment-epoch 2>/dev/null || true)"
          if [ "$actual" != "$expected" ]; then
            echo "This branch predates preview deployment epoch $expected. Rebase onto main before deploying." >&2
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The iterate terminal is an OpenTUI application and deliberately runs
      # under Bun. Keep the version reproducible and fail before deploy if the
      # runtime cannot be provisioned.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install
      - name: Install Doppler CLI
        run: |-
          for i in 1 2 3; do curl -sfLS https://cli.doppler.com/install.sh | sh -s -- --no-package-manager && break; echo "Attempt $i failed, retrying in 5s..."; sleep 5; done
          doppler --version || { echo 'Failed to install Doppler CLI after 3 attempts'; exit 1; }
      # ONE step for deploy + e2e: `preview run` shares a single resolved PR
      # head between the two phases, so a push can no longer race into a gap
      # between separate deploy and test steps (that gap used to need a whole
      # class of stale-head skip machinery in preview.ts). Deploy failures
      # fail the step before any test runs.
      - name: Preview / deploy + e2e
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ITERATE_BOT_GITHUB_TOKEN || github.token }}
        run: |-
          set -euo pipefail
          # A manual dispatch is an explicit ask for a fresh preview, so it
          # overrides the draft policy and redeploys even when this exact head
          # was previously cleaned up and recorded as released.
          doppler run --project _shared --config prd -- pnpm preview run \
            --github-token "$GITHUB_TOKEN" \
            --pull-request-number "${{ github.event.pull_request.number || inputs.pull-request-number }}" \
            ${{ github.event_name == 'workflow_dispatch' && '--allow-draft --all-apps' || '' }}
      - name: Collect OS preview test artifacts
        if: always()
        run: scripts/preview/collect-test-artifacts.sh test-results
      - name: Upload OS preview test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview-os-test-artifacts
          path: test-results
          include-hidden-files: true
          if-no-files-found: ignore
