name: autofix.ci
on:
  pull_request: {}
  push:
    branches:
      - main
      - "**/*autofix*"
      - "*autofix*"
concurrency:
  group: autofix-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
jobs:
  autofix:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # PRs use changed lines; non-PR runs still need history for blame.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      - name: install and update lockfile
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Prepare PR lint comparison
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm tsx scripts/ci/prepare-pr-lint.ts
      - name: fix lint issues
        run: pnpm exec oxlint . --fix --threads 1
      - name: fix format issues
        run: pnpm run format
      - name: keep workflow definitions unchanged
        if: always()
        run: git restore -- .github/workflows .depot/workflows
      - run: git diff
        if: always()
      - name: apply fixes
        if: always()
        uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27
