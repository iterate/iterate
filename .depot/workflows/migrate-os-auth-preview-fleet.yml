name: Migrate Preview Fleet To Auth RPC

permissions:
  checks: read
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_OS_AUTH_RPC after draining legacy preview and cleanup runs.
        required: true
        type: string

# Temporary one-release maintenance gate, copied verbatim into preview deploy
# and cleanup. Dispatch only after every run created from the pre-cutover
# workflows is complete or cancelled. New epoch-aware runs queue behind this
# job and cannot mutate a slot during the migration.
concurrency:
  group: cloudflare-preview-fleet-auth-rpc-cutover
  cancel-in-progress: false

jobs:
  migrate:
    name: Drain, migrate, and verify preview fleet
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 90
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |-
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Dispatch this maintenance workflow from main, not $GITHUB_REF." >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "MIGRATE_OS_AUTH_RPC" ]; then
            echo "Type MIGRATE_OS_AUTH_RPC only after legacy preview and cleanup runs are drained." >&2
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: main
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Migrate all preview slots
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ITERATE_BOT_GITHUB_TOKEN || github.token }}
        run: doppler run --project _shared --config prd -- pnpm tsx scripts/ci/migrate-os-auth-preview-fleet.ts
