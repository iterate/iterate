# HEALTH (scripts/monitors/health.ts): the checks, the message and the failure policy are in
# docs/depot-ci.md#health. Its memory is its own `health-state` artifact, which the next run reads
# back with the Depot organization token (Doppler _shared/preview). Test a branch, and the Slack
# hookup, by dispatching it with test-page=true, which also forces the DO cost alarm's page with a
# 1 DO-hour ceiling:
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow health.yml \
#     --ref <branch> --input test-page=true
#
# Depot registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.
name: Health
permissions:
  contents: read
on:
  schedule:
    # Hourly, off the other schedules' minutes (:07/:22/:37/:52, :13, :29).
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      test-page:
        description: true = post every check's verdict to #error-pulse as a 🧪 test page; no state kept
        required: false
        type: string
        default: "false"
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  health:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # the subjects of the commits the pages name
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Scheduled runs judge with the default branch's checks; a dispatch tests the ref it names.
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
      # The Depot token reads the runs and artifacts through the API and the previous state through
      # the Depot CLI; the Slack bot token comes from Doppler _shared/prd (scripts/ci/slack.ts), and
      # the DO probe's Cloudflare credentials from os/dev and os/prd.
      - name: Judge, page #error-pulse on a change of state
        run: |-
          set -euo pipefail
          export DEPOT_TOKEN
          DEPOT_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)"
          pnpm tsx scripts/monitors/health.ts previous-state --out test-results/health/previous.json
          # Main OS e2e pages main e2e itself; its state is only the message's last line here, so a
          # read that fails leaves main e2e at none on that line instead of failing every check.
          pnpm tsx scripts/monitors/health.ts previous-state --of main-e2e --out test-results/health/main-e2e.json ||
            echo "::warning::no main e2e state: its now line shows none"
          pnpm tsx scripts/monitors/health.ts run \
            --ref "${{ github.ref }}" \
            --state test-results/health/previous.json \
            --main-e2e-state test-results/health/main-e2e.json \
            --state-out test-results/health/state.json \
            ${{ inputs.test-page == 'true' && '--test-page' || '' }}
      # The job writes the state only on a real run on main: after its page, before PostHog.
      - name: Keep the state for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-state
          path: test-results/health/state.json
          if-no-files-found: ignore
          overwrite: true
