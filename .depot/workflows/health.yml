# HEALTH (scripts/monitors/health.ts): the checks, the message and the failure policy are in
# docs/depot-ci.md#health. Its memory is its own `health-state` artifact, which the next run reads
# back with the Depot organization token (Doppler _shared/preview); it also holds the metrics
# copy's watermark. Test a branch, and the Slack hookup, by dispatching it with test-page=true,
# which posts to #ci only and also forces the DO cost alarm's page with a 1 DO-hour ceiling:
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow health.yml \
#     --ref <branch> --input test-page=true
#
# Depot registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.
name: Health
permissions:
  contents: read
on:
  schedule:
    # Hourly, off the other schedules' minutes (:07/:22/:37/:52, :13, :29). The telemetry alerts
    # look back this interval and ten minutes more (scripts/monitors/telemetry.ts
    # LOOKBACK_MINUTES): a longer interval here needs a longer look back there.
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      test-page:
        description: true = post every check's verdict to #ci as a 🧪 test page; no state kept
        required: false
        type: string
        default: "false"
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  health:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # the subjects of the commits the pages name
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
      # The script reads its secrets from Doppler itself: the Depot organization token, which reads
      # the runs, the artifacts and the previous state (scripts/ci/depot.ts `depotApi`), the Slack
      # bot token (scripts/ci/slack.ts), and each account's Cloudflare API token for the DO probe,
      # the telemetry alerts and the metrics copy (envs.ts `cloudflareAccounts`).
      - name: Judge, page #error-pulse on a change of state
        run: |-
          set -euo pipefail
          node scripts/monitors/health.ts previous-state --out test-results/health/previous.json
          node scripts/monitors/health.ts run \
            --ref "${{ github.ref }}" \
            --state test-results/health/previous.json \
            --state-out test-results/health/state.json \
            ${{ inputs.test-page == 'true' && '--test-page' || '' }}
      # The job writes the state only on a real run on main: after its posts, before PostHog, and
      # again after each hour of metrics it then copies, so a run that fails or is cut short during
      # the copy still uploads the watermark of every hour it sent.
      - name: Keep the state for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-state
          path: test-results/health/state.json
          if-no-files-found: ignore
          overwrite: true
