# MAIN'S E2E RUN on the PRD Cloudflare account — main-os-e2e.yml's run repeated where production
# lives, in case that account's platform behaves differently. Every push to main deploys a THROWAWAY
# Worker Preview `main-<short sha>` of the one fixed parent `os-prd-account-e2e` (envs.ts
# `osEnvs["prd-account-e2e"]`: workers are never deleted, so each run redeploys the parent, never
# multiplies it), with KV, R2, an Artifacts namespace and Durable Object namespaces of its own,
# runs the e2e suite, the browser specs and the residency gate against it, and deletes the preview
# and everything it created.
#
# NOTHING OF PRODUCTION'S: no prd directory, no prd project, no route or hostname — workers.dev
# only — and the preview runs as the `preview` Doppler config's test identities (prd supplies the
# account's Cloudflare credentials alone). apps/os/scripts/preview-prd-guard.ts refuses a parent or a
# config that names any live production worker, resource or hostname before wrangler runs.
#
# Cleanup: the `delete` job runs always, but a superseded run's is cancelled with it, so each run
# first deletes every other `main-<sha>` preview; the nightly `sweep` job deletes any preview of
# the parent a day after its last deploy, and the resources that outlived theirs.
# The alert pages #error-pulse only when this run changes state against its own last finished run,
# under its own label; its first run pages nothing.

name: Main OS e2e on the prd account

permissions:
  contents: read
  # the alert reads the earlier main commits' check runs: this workflow's last finished run
  checks: read

on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/deploy-os-next.yml
      - .depot/workflows/preview-os-next.yml
      - .depot/workflows/main-os-e2e-prd-account.yml
      - apps/os/**
      - configs-next/**
      - apps/agents/**
      - specs/**
      - playwright.config.ts
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - envs.ts
      - scripts/lib/**
      - scripts/depot-ci/**
  schedule:
    # Nightly, off the hour and after preview-os-next.yml's own sweep: the prd parent's backstop.
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: main-os-e2e-prd-account-${{ github.event_name }}
  cancel-in-progress: true

env:
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  # apps/os/scripts/preview-config.ts: the prd account's throwaway parent, not os-next-preview.
  PREVIEW_PARENT_ENV: prd-account-e2e

jobs:
  deploy:
    name: deploy
    if: github.event_name != 'schedule'
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 40
    outputs:
      preview-name: ${{ steps.name.outputs.preview-name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Name the throwaway preview
        id: name
        run: echo "preview-name=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # cancel-in-progress cancels a superseded run's queued jobs, its `always()` delete included
      # (main-f3772a0, 2026-09-23): this run deletes every other `main-<sha>` preview first.
      - name: Delete superseded runs' previews
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_NAME: ${{ steps.name.outputs.preview-name }}
        run: doppler run -- pnpm preview delete-superseded
      # The platform alone: the clients' parents are the dev/preview account's.
      - name: Deploy the throwaway preview on the prd account
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_NAME: ${{ steps.name.outputs.preview-name }}
          PREVIEW_APPS: none
        run: doppler run -- pnpm preview deploy

  e2e:
    name: e2e
    needs: deploy
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    # The runners write their telemetry for the failing rows only; the dev account's run feeds the
    # flake dashboard.
    env:
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: main
      TEST_TELEMETRY_HEAD_SHA: ${{ github.sha }}
    outputs:
      suite-started: ${{ steps.suite-started.outputs.at }}
      suite-ended: ${{ steps.suite-ended.outputs.at }}
      failing-rows: ${{ steps.failing-rows.outputs.failing-rows }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Record the suite's start
        id: suite-started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run the e2e suite and the browser specs against the preview
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_NAME: ${{ needs.deploy.outputs.preview-name }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: doppler run -- pnpm preview e2e
      - name: Record the suite's end
        id: suite-ended
        if: always() && steps.suite-started.outcome == 'success'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Collect the failing rows
        id: failing-rows
        if: always()
        run: pnpm tsx scripts/ci/main-e2e-alert.ts failing-rows --dir test-results/ci-telemetry/raw

  residency:
    name: residency
    needs: [deploy, e2e]
    # a superseded (cancelled) run skips it, so `delete` runs at once, not after the analytics wait
    if: ${{ !cancelled() && needs.e2e.outputs.suite-started != '' }}
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Fail on any Durable Object still resident five minutes after the suite
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_NAME: ${{ needs.deploy.outputs.preview-name }}
          PREVIEW_SUITE_STARTED: ${{ needs.e2e.outputs.suite-started }}
          PREVIEW_SUITE_ENDED: ${{ needs.e2e.outputs.suite-ended }}
        run: doppler run -- pnpm preview residency

  delete:
    name: delete
    needs: [deploy, e2e, residency]
    if: always() && github.event_name != 'schedule'
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Delete the throwaway preview and everything it created
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: PREVIEW_NAME="main-${GITHUB_SHA::7}" doppler run -- pnpm preview delete

  alert:
    name: alert
    needs: [deploy, e2e, residency, delete]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # this run's state is its last finished run: a first run pages nothing
      - name: Page #error-pulse when this run changes state
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm tsx scripts/ci/main-e2e-alert.ts alert --workflow "Main OS e2e on the prd account" --label "main e2e on the prd account"

  # The backstop: every preview of the prd account's parent whose last deploy is a day old, and every
  # resource named for a preview that no longer exists (apps/os/scripts/preview-sweep.ts).
  sweep:
    name: sweep (nightly)
    if: github.event_name == 'schedule'
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sweep the prd account parent's stale previews and orphaned resources
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: doppler run -- pnpm preview sweep
