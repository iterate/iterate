# THE REAL-MODEL SUITE for apps/os and the agents runtime: once a day, on every main push that changes
# how an agent calls its model, and on dispatch, deploy the commit as `real-model-<sha7>` (the same
# deployment again, in place, when it has not changed since the last run), run the rows titled
# `REAL:` against real models (OpenAI's astra on Cloudflare's billing, the default model, and
# Workers AI), and judge the run. The deploy's readiness gate waits out a brand-new worker's first
# seconds (main-os-e2e.yml); the run then deletes the workflow's deployments before it.
#
# Every other run (PR previews, Main OS e2e, the soak) runs those turns against a fake provider and
# spends nothing: one AI Gateway spend cap covers the preview account, and on 2026-09-24 a day of soaks
# spent it and turned every PR's preview e2e red (docs/testing.md#real-model-rows). A run here costs
# about $0.06.
#
# The judge (scripts/ci/main-e2e-alert.ts `judge`, reading the run's test telemetry) pages Slack
# #error-pulse on a change of state only: red once, green again once, with the channel's last page as
# its state, the way Main OS e2e pages. A page leaves the run green; a BROKEN PROBE (the deploy, no
# telemetry, a REAL: row not run) fails the run. A run off main never pages: it prints what it would post. A dispatch deploys the branch's commit
# under the workflow's prefix; the next run of main deploys main's again. One run at a time, each
# run's deploy waiting for the run before it to finish with its deployment.
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow os-real-model.yml --ref <branch>
#
# Depot registers the schedule and the push trigger once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.

name: OS real model

permissions:
  contents: read

on:
  schedule:
    # Daily, off the other schedules' minutes (:07/:22/:37/:52, :13, :29, :41, 3:17).
    - cron: "47 5 * * *"
  push:
    branches: [main]
    # How an agent calls its model: the default model, the request, the byte transport, and this suite.
    paths:
      - .depot/workflows/os-real-model.yml
      - scripts/ci/main-e2e-alert.ts
      - packages/agents/**
      - apps/agents/e2e/agents-default-model.e2e.test.ts
  workflow_dispatch:

concurrency:
  group: os-real-model
  cancel-in-progress: false

env:
  # THE PREFIX of the workflow's deployments, `real-model-<sha7>` (apps/os/scripts/preview.ts reads
  # it; preview-sweep.ts CI_WORKFLOW_PREVIEWS knows it).
  PREVIEW_NAME: real-model
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  real-model:
    name: real-model
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    # The vitest reporter's telemetry (`pnpm e2e:run`), which the judge reads.
    env:
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.ref_name }}
      TEST_TELEMETRY_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # `<prefix>-<sha7>` of main's commit: a fresh deployment when main moved since the last run,
      # the same one deployed again in place when it has not (apps/os/scripts/preview.ts)
      - name: Deploy main's commit
        id: deploy
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_APPS: none
        run: doppler run -- pnpm preview deploy
      # The workflow's deployments before this one, deleted now this one is ready
      # (apps/os/scripts/preview.ts `cleanup-superseded`); never this run's verdict.
      - name: Delete the superseded deployments
        continue-on-error: true
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: doppler run -- pnpm preview cleanup-superseded
      # The files that hold the REAL: rows, opted in. A failed row is the judge's verdict, so it does
      # not stop the job here. Credentials: Doppler os/preview's APP_CONFIG (e2e/support/global-setup.ts).
      - name: Run the real-model rows
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          E2E_REAL_MODELS: "1"
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |-
          export WORKER_BASE_URL="$(node -p 'require("./output/preview.json").url')"
          doppler run -- pnpm e2e:run agents-default-model ai-root-shadow-and-fable \
            || echo "the real-model rows exited $?: the judge decides"
      - name: Judge, page #error-pulse on a change of state
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          pnpm tsx scripts/ci/main-e2e-alert.ts judge --dir test-results/ci-telemetry/raw
          --suite "real-model e2e" --title-prefix "REAL:" --ref "${{ github.ref }}"
      - name: Keep the telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-real-model-telemetry
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
