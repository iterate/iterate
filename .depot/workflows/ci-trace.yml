name: CI trace report
permissions:
  contents: write
  statuses: write
on:
  workflow_dispatch:
    inputs:
      source-workflow:
        description: Depot preview workflow ID (empty repairs recent missing reports)
        required: false
        default: ""
  schedule:
    - cron: "*/15 * * * *"
# Serialize artifact commits and commit-status updates. This runs outside the
# measured workflow, so it can include finish/cleanup and the final job times.
concurrency:
  group: ci-trace-reports
  cancel-in-progress: false
jobs:
  publish:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Publish interactive trace
        run: |-
          if [ -n "$SOURCE_WORKFLOW" ]; then
            doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN -- \
              pnpm exec trpc-cli scripts/ci/trace.ts publish "$SOURCE_WORKFLOW"
          else
            doppler run --project _shared --config preview --preserve-env=GITHUB_TOKEN -- \
              pnpm exec trpc-cli scripts/ci/trace.ts reconcile
          fi
