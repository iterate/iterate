# Prd fault alarm: every 15 minutes, reads the last half hour of os-next-prd's
# Workers Logs and pages Slack #error-pulse (a top-level message mentioning
# Jonas, at most hourly) on any 5xx, a burst of platform-failure heals, or a
# burst of errors. Why and thresholds: scripts/ci/prd-fault-alarm.ts. Depot
# registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN.

name: Prd fault alarm (Depot CI)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: prd-fault-alarm
  cancel-in-progress: false

jobs:
  alarm:
    name: Prd fault alarm
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Install Doppler CLI
        run: |-
          for i in 1 2 3; do curl -sfLS https://cli.doppler.com/install.sh | sh -s -- --no-package-manager && break; sleep 5; done
          doppler --version
      - name: Read os-next-prd's logs, page on a fault
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project project-worker --config prd -- pnpm tsx scripts/ci/prd-fault-alarm.ts run
