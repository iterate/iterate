# Prd fault alarm: every 15 minutes, reads every first-party prd Worker's logs since the last run (os-prd
# and its clients, scripts/ci/prd-fault-alarm.ts PRD_WORKERS) and pages Slack #error-pulse on a 5xx a
# visitor was answered, a burst of platform-failure heals, or an error. Each cause is an incident:
# new ones share a page, later runs edit it, and its thread hears only of growth, a return after
# quiet and the resolution, each mentioning Jonas and Misha. The page is the alarm: the run goes red
# only when it could not read the logs or post to Slack, because a scheduled run reports on main's
# head commit, where red reads as "this commit broke". Why and thresholds:
# scripts/ci/prd-fault-alarm.ts. Depot registers the schedule once this file is on the default
# branch.
#
# Its memory (where the next read starts, the open pages) is its own `prd-fault-alarm-state`
# artifact, read back by the next run with the Depot organization token from Doppler
# _shared/preview. Only a run on main posts and keeps it (the script checks `--ref`); a run on a
# branch prints what it would post. A run that cannot read it reads the last half hour and pages
# everything as new: a repeat, never a miss. Test a branch, and the Slack hookup, with a 🧪 TEST RUN
# of the half hour to `at` (or to now), posted to #ci and keeping no state:
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow prd-fault-alarm.yml \
#     --ref <branch> --input test-run=true --input at=2026-09-28T09:35:00Z
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN.

name: Prd fault alarm (Depot CI)

permissions:
  contents: read

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test-run:
        description: true = post the window's page to #ci as a 🧪 TEST RUN; no state kept
        required: false
        type: string
        default: "false"
      at:
        description: with test-run, the end of the half hour to read (ISO 8601); empty = now
        required: false
        type: string
        default: ""

concurrency:
  group: prd-fault-alarm
  cancel-in-progress: false

jobs:
  alarm:
    name: Prd fault alarm
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
      - name: Read the previous run's state
        run: |-
          export DEPOT_CI_TELEMETRY_TOKEN
          DEPOT_CI_TELEMETRY_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)" &&
            pnpm tsx scripts/ci/prd-fault-alarm.ts previous-state --out test-results/prd-fault-alarm/previous.json ||
            echo "::warning::no previous state: this run pages every fault as new"
      - name: Read the prd Workers' logs, page on a fault
        env:
          AT: ${{ inputs.at }}
        run: >-
          doppler run --project os --config prd --
          pnpm tsx scripts/ci/prd-fault-alarm.ts run
          --ref "${{ github.ref }}"
          --state test-results/prd-fault-alarm/previous.json
          --state-out test-results/prd-fault-alarm/state.json
          ${{ inputs.test-run == 'true' && '--test-run' || '' }}
          ${{ inputs.test-run == 'true' && inputs.at != '' && '--at "$AT"' || '' }}
      # The alarm writes the state only on main, after its posts, so a run that failed to post keeps
      # none and the next one reads its window again. A test run writes none.
      - name: Keep the state for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-fault-alarm-state
          path: test-results/prd-fault-alarm/state.json
          if-no-files-found: ignore
          overwrite: true
