# Prd fault alarm: every 15 minutes, scripts/ci/prd-fault-alarm.ts reads the first-party prd Workers'
# logs since the last run and pages Slack #error-pulse; what it pages, when and why is in that file.
# Depot registers the schedule once this file is on the default branch.
#
# Its state is its own `prd-fault-alarm-state` artifact, read back by the next run with the Depot
# organization token from Doppler _shared/preview; the script writes it only on main (`--ref`).
# Test a branch, and the Slack hookup, with a 🧪 TEST RUN of the half hour to `at` (or to now),
# posted to #ci:
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow prd-fault-alarm.yml \
#     --ref <branch> --input test-run=true --input at=2026-09-28T09:35:00Z
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN.

name: Prd fault alarm (Depot CI)

permissions:
  contents: read

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test-run:
        description: true = post the window's page to #ci as a 🧪 TEST RUN; no state kept
        required: false
        type: string
        default: "false"
      at:
        description: with test-run, the end of the half hour to read (ISO 8601); empty = now
        required: false
        type: string
        default: ""

concurrency:
  group: prd-fault-alarm
  cancel-in-progress: false

jobs:
  alarm:
    name: Prd fault alarm
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
      - name: Read the previous run's state
        run: |-
          export DEPOT_CI_TELEMETRY_TOKEN
          DEPOT_CI_TELEMETRY_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)" &&
            pnpm tsx scripts/ci/prd-fault-alarm.ts previous-state --out test-results/prd-fault-alarm/previous.json ||
            echo "::warning::no previous state: this run pages every fault as new"
      - name: Read the prd Workers' logs, page on a fault
        env:
          AT: ${{ inputs.at }}
        run: >-
          doppler run --project os --config prd --
          pnpm tsx scripts/ci/prd-fault-alarm.ts run
          --ref "${{ github.ref }}"
          --state test-results/prd-fault-alarm/previous.json
          --state-out test-results/prd-fault-alarm/state.json
          ${{ inputs.test-run == 'true' && '--test-run' || '' }}
          ${{ inputs.test-run == 'true' && inputs.at != '' && '--at "$AT"' || '' }}
      - name: Keep the state for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-fault-alarm-state
          path: test-results/prd-fault-alarm/state.json
          if-no-files-found: ignore
          overwrite: true
