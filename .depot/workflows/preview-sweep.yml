# THE NIGHTLY SWEEP (`pnpm preview sweep`, apps/os/scripts/preview.ts): deletes the per-commit
# deployments (every worker and resource named `<prefix>-<sha7>-…`) whose PR closed without a
# delete, that a newer deployment of their prefix superseded an hour ago or more, that went stale, or
# that were hand-named and left idle, however little of them is left. A CI workflow's newest
# deployment (`main-…`, `latency-…`, `real-model-…`) goes only once that workflow has not deployed
# for a week. The rules are apps/os/scripts/preview-sweep.ts. What stops a force-closed PR, a
# cancelled or failed cleanup, or a half-made deployment from leaking workers. Until it finds none,
# it also deletes the Worker Previews each PR used to get, and their resources.
#
# A scheduled run reports on main's head commit, where red reads as "this commit broke", so the run
# goes red only when the sweep could not act. An Artifacts namespace Cloudflare will not delete is a
# page to #error-pulse instead (preview.ts: StuckArtifactsNamespace), tried again the next night.
#
# Beside it, the reset of main on dev's own data (`pnpm preview reset-parent`): what people and
# agents left on https://os.iterate-dev-preview.workers.dev and the apps signed in against it,
# erased, then main on dev deployed from main again. Every per-commit deployment is workers of its
# own and keeps serving meanwhile. It takes main on dev's deploy group (preview-parents.yml), so a
# push to main never deploys it in the middle of an erase.
#
# Its own workflow, not a job of preview-os.yml, so no PR's checks carry it as a skipped job.
# Sweep now with a dispatch:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow preview-sweep.yml --ref main
# Depot registers the schedule once this file is on the default branch. The only Depot secret is
# DOPPLER_TOKEN; Doppler os/preview supplies the Cloudflare credentials.

name: Preview sweep

permissions:
  contents: read
  # Which pull requests are open or closed (the sweep's rules 2, 3 and 6).
  pull-requests: read

on:
  schedule:
    # Nightly, off the hour (cloudflare-os runs theirs at 04:37 too).
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: preview-sweep
  cancel-in-progress: false

env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  sweep:
    name: sweep
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sweep deployments whose PR is closed, superseded, or older than 7 days
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: doppler run -- pnpm preview sweep

  reset-parent:
    name: reset the os parent
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 45
    concurrency:
      group: preview-parents
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Erase main on dev's data, then deploy it again
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm preview reset-parent
