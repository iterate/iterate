# THE NIGHTLY PREVIEW SWEEP (`pnpm preview sweep`, scripts/os/preview.ts), dev/preview account
# only; what it deletes is scripts/os/preview-sweep.ts's rules.
#
# When a run goes red, and what it pages to #error-pulse instead: the end of preview.ts's `sweep`.
# Only a run on main pages; one on another ref prints its pages. test-run=true deletes nothing and
# posts what the sweep would page to #ci as a 🧪 TEST RUN:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow preview-sweep.yml \
#     --ref <branch> --input test-run=true
#
# Beside it, the reset of main on dev's own data (`pnpm preview reset-parent`): what people and
# agents left on https://os.iterate-dev-preview.workers.dev and the apps signed in against it,
# erased, then main on dev deployed from main again. Every per-commit deployment is workers of its
# own and keeps serving meanwhile. It takes main on dev's deploy group (preview-parents.yml), so a
# push to main never deploys it in the middle of an erase.
#
# Its own workflow, not a job of preview-os.yml, so no PR's checks carry it as a skipped job.
# Sweep now with a dispatch:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow preview-sweep.yml --ref main
# Depot registers the schedule once this file is on the default branch. The only Depot secret is
# DOPPLER_TOKEN; Doppler os/preview supplies the Cloudflare credentials.

name: Preview sweep

permissions:
  contents: read
  # Which pull requests are open or closed (the sweep's rule 2).
  pull-requests: read

on:
  schedule:
    # Nightly, off the hour (cloudflare-os runs theirs at 04:37 too).
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      test-run:
        description: true = delete nothing and post what the sweep would page to #ci as a 🧪 TEST RUN; the reset is skipped
        required: false
        type: string
        default: "false"

concurrency:
  group: preview-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
      - name: Sweep stale deployments
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          doppler run --project os --config preview -- pnpm preview sweep
          ${{ inputs.test-run == 'true' && '--test-run' || '' }}

  reset-parent:
    name: reset the os parent
    if: inputs.test-run != 'true'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    concurrency:
      group: preview-parents
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
      - name: Erase main on dev's data, then deploy it again
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project os --config preview -- pnpm preview reset-parent
