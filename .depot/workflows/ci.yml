name: CI
permissions:
  contents: read
  deployments: write
concurrency:
  # Every run updates the same production Worker. Let an active deployment
  # finish, while allowing Depot to coalesce queued runs to the newest commit.
  group: deploy-iterate-com-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/ci.yml
      - .agents/skills/**
      - apps/iterate-com/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
  workflow_dispatch: {}
jobs:
  deploy-iterate-com:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project iterate-com
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy apps/iterate-com
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm run deploy
        working-directory: apps/iterate-com
  slack_failure:
    needs:
      - deploy-iterate-com
    if: always() && contains(needs.*.result, 'failure')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      NEEDS: ${{ toJson(needs) }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Notify Slack on failure
        run: pnpm tsx scripts/ci/notify.ts workflow-failure
