name: Test
on:
  push:
    branches:
      - main
  pull_request: {}
# Rapid pushes to a branch supersede each other. On PRs, head_ref identifies
# the source branch; on main, ref_name keeps only the newest validation run.
concurrency:
  group: test-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  # TEST EVIDENCE IN R2 (docs/test-evidence.md): `r2` puts each test job attempt's test-results/
  # folder in the iterate-ci bucket; `off` skips that step.
  TEST_EVIDENCE_UPLOAD: r2

jobs:
  test:
    # 8x32 for apps/os's seven vitest slots (apps/os/vitest.config.ts `maxWorkers`): 22 runs each on
    # 2026-09-24, the test step took 80 s at the p50 here and 87 s on 4x16 (151 s at three slots),
    # peaking at 14 % memory and 79 % CPU. Lint is the other 8x32 job on a main push: two large
    # sandboxes have ended this job with a no-log "Sandbox terminated before worker reported
    # completion" (#1952, #2030, July 2026; a retry passed).
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # THE RUN'S OWN COMMIT, the tree this workflow file was read from: on a pull request, the
      # merge commit of its head into main (refs/pull/<n>/merge as Depot resolved it), so a workflow
      # change on main never runs against a head that predates it
      # (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      # THIS JOB INSTALLS. Reusing the baked node_modules (scripts/depot-ci/dependencies.mjs) skips a
      # ~55 s no-op install, but the image is loaded lazily and that install was what paged the tree
      # in: with the reuse, the first packages' tests ran 1.5–2× slower and 5 s rows timed out in
      # three of three runs (2026-09-22: historical test and script failures);
      # a parallel stat walk after the reuse did not help (metadata, not contents). The other
      # workflows import little and keep the reuse; the test job pays the install.
      - name: Install dependencies (pages the baked tree in)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config dev --project test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run Tests
        id: tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          FLAKE_RECORD_DIR: test-results/flake-records
          TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
          TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_TELEMETRY_KIND: unit
          TEST_TELEMETRY_SUITE: unit
          TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: doppler run -- pnpm test
      # Kit's firmware compiled for the host (ASan/UBSan) and run under CTest. Its own step, not
      # part of Kit's `test`, so `pnpm test` runs where cmake is missing; the image has cmake.
      # `!cancelled()`, so a unit-test failure does not hide the firmware result. CTest's JUnit XML
      # goes into the test evidence folder (docs/test-evidence.md).
      - name: Run Kit firmware host tests
        id: kit-host-tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results/ctest
          pnpm --dir apps/kit firmware:test:host --output-junit "$PWD/test-results/ctest/junit.xml"
      # Fails when a test workspace left no complete artifact, and writes the unit suite summary next
      # to its flake lines. A superseded run still keeps its raw evidence, but the job's own
      # cancelled outcome is the record; killed runner sentinels are not test failures.
      - name: Check test telemetry and write the suite summary
        if: always()
        env:
          TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # --expect-unit-workspaces reads the workspaces from the checkout, so the list has one source:
        # the tree whose tests ran.
        run: pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites unit --expect-unit-workspaces ${{ cancelled() && '--cancelled' || '' }}
      # THE TEST EVIDENCE FOLDER (docs/test-evidence.md): test-results/ holds everything this job
      # attempt's tests left. This adds one row per test (tables/tests.parquet), then manifest.json:
      # the run's result (from the steps below and the finalizer's check), the tested commit and
      # tree, the job attempt and every file's sha256. Neither this nor the upload decides the job;
      # the tests did.
      - name: Write the test evidence manifest
        id: evidence-write
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          TEST_EVIDENCE_STEPS: tests=${{ steps.tests.outcome }} kit-host-tests=${{ steps.kit-host-tests.outcome }}
          TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm tsx scripts/ci/test-evidence.ts write ${{ cancelled() && '--cancelled' || '' }}
      # With the Cloudflare API token preview deploys use (Doppler _shared/preview), as S3 keys. A
      # cancelled or timed-out job's folder too: its manifest says so, and it gets no tables/ copy.
      # A failure is a warning and a line of the job's summary, never the job's result.
      - name: Upload the test evidence to R2
        id: evidence-upload
        if: ${{ always() && env.TEST_EVIDENCE_UPLOAD == 'r2' && hashFiles('test-results/manifest.json') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project _shared --config preview -- pnpm tsx scripts/ci/test-evidence.ts upload
      # Either step that failed before it could say why (Doppler, pnpm, its timeout) gets its
      # warning and summary line here; one that reported itself is left alone.
      - name: Report a test evidence step that could not
        if: ${{ always() && (steps.evidence-write.outcome == 'failure' || steps.evidence-upload.outcome == 'failure') }}
        run: bash scripts/ci/test-evidence-unreported.sh "${{ steps.evidence-write.outcome }}" "${{ steps.evidence-upload.outcome }}"
      # The whole flake-reporting contract from CI's side: publish the
      # recorder lines and the finalizer's suite-summary.json as a workflow
      # artifact for the flake dashboard to pull, one per job attempt
      # (docs/testing.md#flakes-and-pinned-failures). CI holds no dashboard
      # credential.
      - name: Upload flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-unit-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/flake-records
          if-no-files-found: ignore
      - name: Upload test telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-telemetry-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: error
