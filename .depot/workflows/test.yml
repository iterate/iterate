name: Test
on:
  push:
    branches:
      - main
  pull_request: {}
# Rapid pushes to a branch supersede each other. On PRs, head_ref identifies
# the source branch; on main, ref_name keeps only the newest validation run.
concurrency:
  group: test-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    # Measured on main (run w301hvp2xr): peak ~37% CPU / ~8% memory on 8x32
    # (~3 cores, ~2.5GB). Keep 4x16 for parallel workspace headroom; avoid a
    # second large sandbox competing with lint-typecheck on main pushes
    # (that pattern ends in "Sandbox terminated before worker reported
    # completion" with no logs/metrics).
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config dev --project test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run Tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
          TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_TELEMETRY_KIND: unit
          TEST_TELEMETRY_LANE: unit
          TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: doppler run -- pnpm test
      - name: Normalize and send test telemetry
        if: always()
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TEST_TELEMETRY_EXPECTED_WORKSPACES: "@iterate-com/auth,@iterate-com/dummy-petshop,@iterate-com/mobile,@iterate-com/os,@iterate-com/semaphore,@iterate/lint,iterate,@iterate-com/shared,@iterate-com/typm,@iterate-com/scripts"
        # A superseded run still normalizes and uploads its raw evidence, but
        # GitHub's job telemetry owns the cancelled outcome; do not turn killed
        # runner sentinels into test failures.
        # Test execution uses test/dev, but analytics always belongs to the
        # canonical production PostHog project shared with preview telemetry.
        run: doppler run --project _shared --config prd -- pnpm tsx scripts/ci/upload-test-telemetry.ts ${{ cancelled() && '--cancelled' || '' }}
      - name: Upload test telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-telemetry
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: error
