name: Test
# Read-only: the job token of a run that restored a store from Depot Cache, which any branch can
# write (docs/depot-ci.md#depot-cache), can push nothing.
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request: {}
  # A soak runs it by dispatch: under `depot ci run` the job has no Depot Cache
  # (docs/depot-ci.md#run-ci-without-a-pr).
  workflow_dispatch: {}
# Rapid pushes to a branch supersede each other. On PRs, head_ref identifies
# the source branch; on main, ref_name keeps only the newest validation run.
concurrency:
  group: test-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # 8x32 for apps/os's seven vitest slots (apps/os/vitest.config.ts `maxWorkers`): 22 runs each on
    # 2026-09-24, the test step took 80 s at the p50 here and 87 s on 4x16 (151 s at three slots),
    # peaking at 14 % memory and 79 % CPU. Lint is the other 8x32 job on a main push: two large
    # sandboxes have ended this job with a no-log "Sandbox terminated before worker reported
    # completion" (#1952, #2030, July 2026; a retry passed).
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    steps:
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # THE RUN'S OWN COMMIT, the tree this workflow file was read from: on a pull request, the
      # merge commit of its head into main (refs/pull/<n>/merge as Depot resolved it), so a workflow
      # change on main never runs against a head that predates it
      # (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        id: setup
        uses: ./.depot/actions/setup
      # THE TESTS, side by side (docs/depot-ci.md#parallel-steps): `pnpm test`, and Kit's firmware
      # compiled for the host (ASan/UBSan) and run under CTest, which needs none of the other's
      # outputs and builds in its own directory (apps/kit/firmware/.build/host). `fail-fast: false`,
      # so a failure of either never cancels the other. Kit is its own step, not part of Kit's
      # `test`, so `pnpm test` runs where cmake is missing; the stock image has cmake and GCC's
      # sanitizers. At the lowest priority (`nice`): the compiler gets only the CPU vitest leaves,
      # so no timing-sensitive row waits on it.
      - fail-fast: false
        parallel:
          - name: Run Tests
            id: tests
            env:
              DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
              FLAKE_RECORD_DIR: test-results/flake-records
              TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
              TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
              TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              TEST_TELEMETRY_KIND: unit
              TEST_TELEMETRY_SUITE: unit
              TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
            run: doppler run --project test --config dev -- pnpm test
          # `!cancelled()`, so a failed setup does not hide the firmware result. CTest's JUnit XML
          # goes into the test evidence folder (docs/test-evidence.md).
          - name: Run Kit firmware host tests
            id: kit-host-tests
            if: ${{ !cancelled() }}
            run: |
              mkdir -p test-results/ctest
              nice -n 19 pnpm --dir apps/kit firmware:test:host --output-junit "$PWD/test-results/ctest/junit.xml"
          # The evidence upload's secrets, fetched beside the tests (docs/test-evidence.md#what-ci-does).
          - name: Fetch the evidence upload's secrets
            continue-on-error: true
            timeout-minutes: 1
            env:
              DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            run: |
              doppler run --project _shared --config preview --fallback "$RUNNER_TEMP/doppler-shared-preview" -- true ||
                echo "::warning title=Doppler prefetch::_shared/preview not saved; the evidence upload fetches it"
      # THE STEP AFTER THE TESTS, cancelled runs too: the telemetry finalizer, then the test evidence
      # manifest (scripts/ci/test-evidence.ts `finalize` says what fails it).
      - name: Check test telemetry, write the suite summary and the test evidence manifest
        id: evidence-write
        if: always()
        timeout-minutes: 2
        env:
          TEST_EVIDENCE_STEPS: tests=${{ steps.tests.outcome }} kit-host-tests=${{ steps.kit-host-tests.outcome }}
          # Node's compile cache, which the upload's Node then starts from
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        # --expect-unit-workspaces reads the workspaces from the checkout, so the list has one source:
        # the tree whose tests ran.
        run: node scripts/ci/test-evidence.ts finalize --flake-suites unit --expect-unit-workspaces ${{ cancelled() && '--cancelled' || '' }}
      # THE UPLOADS, side by side: each only reads test-results/, and `fail-fast: false` lets every
      # one finish whatever another does (docs/depot-ci.md#parallel-steps). Each follows the step
      # above by its outcome or its outputs, never `hashFiles()` (test-evidence.ts `finalize`).
      - fail-fast: false
        parallel:
          # With the Cloudflare API token preview deploys use (Doppler _shared/preview), as S3 keys.
          # A cancelled or timed-out job's folder too: its manifest says so. A failure is a warning
          # and a line of the job's summary, never the job's result.
          - name: Upload the test evidence to R2
            id: evidence-upload
            if: ${{ always() && steps.evidence-write.outputs.manifest == 'written' }}
            continue-on-error: true
            timeout-minutes: 3
            env:
              DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
              NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
            # offline from the file the fetch beside the tests saved; a fetch without it
            run: |
              offline=()
              if [ -s "$RUNNER_TEMP/doppler-shared-preview" ]; then offline=(--fallback-only); fi
              doppler run --project _shared --config preview --fallback "$RUNNER_TEMP/doppler-shared-preview" "${offline[@]}" -- node scripts/ci/test-evidence.ts upload
          # The recorder lines and the finalizer's suite-summary.json as a workflow
          # artifact, one per job attempt. The flake dashboard reads the same files
          # from the test evidence in R2 (docs/testing.md#flakes-and-pinned-failures).
          - name: Upload flake records
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: flake-records-unit-attempt-${{ steps.attempt.outputs.id }}
              path: test-results/flake-records
              if-no-files-found: ignore
          # Everything the run wrote under test-results/, as the e2e jobs keep theirs.
          - name: Upload results
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: unit-test-artifacts-attempt-${{ steps.attempt.outputs.id }}
              path: test-results
              include-hidden-files: true
              if-no-files-found: error
          # PNPM'S STORE FOR THE NEXT RUNS, every job's (.depot/actions/setup), from a main push whose
          # install inputs no run saved yet. Only a main push writes it (docs/depot-ci.md#depot-cache).
          - name: Save pnpm's store
            id: pnpm-store-save
            if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outcome == 'success' && steps.setup.outputs.pnpm-store-hit != 'true' }}
            uses: actions/cache/save@v4
            continue-on-error: true
            timeout-minutes: 3
            with:
              path: ${{ env.NPM_CONFIG_STORE_DIR }}
              key: ${{ steps.setup.outputs.pnpm-store-primary-key }}
      # Either step that failed before it could say why (Node, Doppler, its timeout) gets its
      # warning and summary line here; one that reported itself is left alone.
      - name: Report a test evidence step that could not
        if: ${{ always() && (steps.evidence-write.outcome == 'failure' || steps.evidence-upload.outcome == 'failure') }}
        run: bash scripts/ci/test-evidence-unreported.sh "${{ steps.evidence-write.outcome }}" "${{ steps.evidence-upload.outcome }}"
      # The store's line of the job's summary (docs/depot-ci.md#depot-cache). The keys come in as
      # environment variables, never spliced into the script: off main the matched key can be any
      # key a run wrote.
      - name: Report pnpm's store
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.setup.outputs.pnpm-store-outcome }}
          PRIMARY_KEY: ${{ steps.setup.outputs.pnpm-store-primary-key }}
          MATCHED_KEY: ${{ steps.setup.outputs.pnpm-store-matched-key }}
          SAVE_OUTCOME: ${{ steps.pnpm-store-save.outcome }}
        run: bash scripts/ci/pnpm-store-report.sh "$RESTORE_OUTCOME" "$PRIMARY_KEY" "$MATCHED_KEY" "$SAVE_OUTCOME"
