name: Test
on:
  push:
    branches:
      - main
  pull_request: {}
# Rapid pushes to a branch supersede each other. On PRs, head_ref identifies
# the source branch; on main, ref_name keeps only the newest validation run.
concurrency:
  group: test-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  test:
    # Measured on main (run w301hvp2xr): peak ~37% CPU / ~8% memory on 8x32
    # (~3 cores, ~2.5GB). Keep 4x16 for parallel workspace headroom; avoid a
    # second large sandbox competing with lint-typecheck on main pushes
    # (that pattern ends in "Sandbox terminated before worker reported
    # completion" with no logs/metrics).
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # THIS JOB INSTALLS. Reusing the baked node_modules (scripts/depot-ci/dependencies.mjs) skips a
      # ~55 s no-op install, but the image is loaded lazily and that install was what paged the tree
      # in: with the reuse, the first packages' tests ran 1.5–2× slower and 5 s rows timed out in
      # three of three runs (2026-09-22: historical test and script failures);
      # a parallel stat walk after the reuse did not help (metadata, not contents). The other
      # workflows import little and keep the reuse; the test job pays the install.
      - name: Install dependencies (pages the baked tree in)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config dev --project test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run Tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          FLAKE_RECORD_DIR: test-results/flake-records
          TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
          TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_TELEMETRY_KIND: unit
          TEST_TELEMETRY_LANE: unit
          TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: doppler run -- pnpm test
      # Kit's firmware compiled for the host (ASan/UBSan) and run under CTest. Its own step, not
      # part of Kit's `test`, so `pnpm test` runs where cmake is missing; the image has cmake.
      # `!cancelled()`, so a unit-test failure does not hide the firmware result.
      - name: Run Kit firmware host tests
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/kit firmware:test:host
      # Fails when a test workspace left no complete artifact, and writes the unit suite summary next
      # to its flake lines. A superseded run still keeps its raw evidence, but the job's own
      # cancelled outcome is the record; killed runner sentinels are not test failures.
      - name: Check test telemetry and write the suite summary
        if: always()
        env:
          TEST_TELEMETRY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # --expect-unit-workspaces reads the workspaces from this checkout, not from this file: a PR's
        # workflow file comes from its merge ref while the checkout is its head.
        run: pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites unit --expect-unit-workspaces ${{ cancelled() && '--cancelled' || '' }}
      # The whole flake-reporting contract from CI's side: publish the
      # recorder lines and the finalizer's suite-summary.json as a workflow
      # artifact for the flake dashboard to pull, one per job attempt
      # (docs/testing.md#flakes-and-pinned-failures). CI holds no dashboard
      # credential.
      - name: Upload flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-unit-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/flake-records
          if-no-files-found: ignore
      - name: Upload test telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-telemetry-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: error
