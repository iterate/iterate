name: Lint and Typecheck
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
# Cancel a branch's in-flight run when a newer commit supersedes it. PRs use
# head_ref; main and manual runs use ref_name.
concurrency:
  group: lint-typecheck-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
env:
  # THE STORE THE IMAGE WAS BAKED WITH. scripts/depot-ci/dependencies.mjs hashes every pnpm_config_*
  # variable into its fingerprint (the store dir decides where node_modules links point), and the bake
  # job sets this one — so a workflow without it computes a different fingerprint on identical sources
  # and never reuses the baked node_modules (every os-next job, 2026-09-22, ~55 s of paging each).
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  lint-typecheck:
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          # grandfatherRule needs the actual author dates of existing lines.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - fail-fast: false
        parallel:
          - name: Run Lint
            run: pnpm lint
          - name: Run Typecheck
            run: pnpm typecheck
          - name: Check formatting
            run: pnpm format:check
          - name: Run Knip
            run: pnpm knip
