name: Lint and Typecheck
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
# Cancel a branch's in-flight run when a newer commit supersedes it. PRs use
# head_ref; main and manual runs use ref_name.
concurrency:
  group: lint-typecheck-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
jobs:
  lint-typecheck:
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - fail-fast: false
        parallel:
          - name: Run Lint
            run: pnpm exec oxlint . --threads 1 --deny-warnings
          - name: Run Typecheck
            run: pnpm typecheck
          - name: Run Infrastructure Typecheck
            run: |-
              pnpm --dir infra install --frozen-lockfile --prefer-offline
              pnpm --dir infra typecheck
          - name: Run Knip
            run: pnpm knip
