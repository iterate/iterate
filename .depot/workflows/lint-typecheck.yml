name: Lint and Typecheck
# Read-only: its install comes from Depot Cache, which any branch can write (docs/depot-ci.md#depot-cache).
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
# Cancel a branch's in-flight run when a newer commit supersedes it. PRs use
# head_ref; main and manual runs use ref_name.
concurrency:
  group: lint-typecheck-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    steps:
      # THE RUN'S OWN COMMIT, the tree this workflow file was read from: on a pull request, the
      # merge commit of its head into main (refs/pull/<n>/merge as Depot resolved it), so a workflow
      # change on main never runs against a head that predates it
      # (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
      - fail-fast: false
        parallel:
          - name: Run Lint
            run: pnpm lint
          - name: Run Typecheck
            run: pnpm typecheck
          - name: Check formatting
            run: pnpm format:check
          - name: Run Knip
            run: pnpm knip
          # A commit whose pnpm-lock.yaml.sha256 is not its lockfile's hash fails (scripts/lockfile-stamp.ts).
          - name: Check the lockfile stamp
            run: |
              node scripts/lockfile-stamp.ts
              test -z "$(git status --porcelain -- pnpm-lock.yaml.sha256)" || {
                echo 'Run `node scripts/lockfile-stamp.ts` at the repo root and commit pnpm-lock.yaml.sha256.' >&2
                exit 1
              }
          # The control plane's D1 (apps/os/src/control-plane/db): its migrations replay to
          # definitions.sql, and the typed queries are what sqlfu generates from them. Every
          # deployment runs the migrations; the types are checked against definitions.sql.
          - name: Check the control plane's schema
            run: pnpm --dir apps/os db:check && pnpm --dir apps/os db:generate && git diff --exit-code -- apps/os/src/control-plane/db
