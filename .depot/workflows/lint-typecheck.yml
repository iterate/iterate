name: Lint and Typecheck
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
# Cancel a branch's in-flight run when a newer commit supersedes it. PRs use
# head_ref; main and manual runs use ref_name.
concurrency:
  group: lint-typecheck-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  lint-typecheck:
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      # THE RUN'S OWN COMMIT, the tree this workflow file was read from: on a pull request, the
      # merge commit of its head into main (refs/pull/<n>/merge as Depot resolved it), so a workflow
      # change on main never runs against a head that predates it
      # (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - fail-fast: false
        parallel:
          - name: Run Lint
            run: pnpm lint
          - name: Run Typecheck
            run: pnpm typecheck
          - name: Check formatting
            run: pnpm format:check
          - name: Run Knip
            run: pnpm knip
          # The control plane's D1 (apps/os/src/control-plane/db): its migrations replay to
          # definitions.sql, and the typed queries are what sqlfu generates from them. Every
          # deployment runs the migrations; the types are checked against definitions.sql.
          - name: Check the control plane's schema
            run: pnpm --dir apps/os db:check && pnpm --dir apps/os db:generate && git diff --exit-code -- apps/os/src/control-plane/db
