# this file is generated by lint-typecheck.ts, do not edit it manually

name: Lint and Typecheck
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
jobs:
  lint-typecheck:
    runs-on:
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Lint
        run: pnpm exec oxlint . --threads 1 --deny-warnings
      - name: Run Typecheck
        run: pnpm typecheck
      - name: Run Knip
        run: pnpm knip
