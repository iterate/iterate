# THE LATENCY MEASUREMENT for apps/os: every 3 hours, redeploy main IN PLACE to the Worker Preview
# `latency`, which nothing else touches (Main OS e2e has its own; a latency measured beside another
# suite measures that suite), run the perf suite against it (apps/os/perf: concurrent project
# creation at 1, 10 and 25 people, sign-in, MCP, a context's first append, wake and processor cold
# start, rule invocation, stream fan-out — every metric and its budget in apps/os/perf/latency.ts),
# and keep Vitest's JSON report as the `os-latency-report` artifact. No run deletes the preview: a
# brand-new one answers Cloudflare's `internal error` for seconds after it is created
# (main-os-e2e.yml), and a preview redeployed in place is what production is. Every perf row mints
# its own people and projects, so nothing it measures reads what earlier runs left. The preview's D1
# is created near whoever creates it (apps/os/scripts/d1.ts), and every uncached control-plane read
# the suite times is a round trip to it: to start the preview over, delete it (`pnpm --dir apps/os
# preview delete --name latency`) and let this workflow's deploy create it again, never a laptop's
# `preview reset`, which places the D1 near the laptop.
#
# The health job judges each scheduled run's report (scripts/monitors/latency.ts), so a run whose perf
# suite failed stays green here. Not on main pushes: every 3 hours the baseline spans about 30 hours,
# where a busy merge day's pushes filled it in two and a lasting regression became it. A dispatch
# measures a branch, which the health job never judges, and redeploys the preview with the branch;
# the next run of main puts main back.
#
# Nothing waits on it: its own concurrency group. One run at a time, since each redeploys the preview
# the run before measures: a run that lands meanwhile queues, and a running measurement is never cut
# short.
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow os-latency.yml --ref <branch>
#
# Depot registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.

name: OS latency

permissions:
  contents: read

on:
  schedule:
    # Every 3 hours, off the other schedules' minutes (:07/:22/:37/:52, :13, :41).
    - cron: "29 */3 * * *"
  workflow_dispatch:

concurrency:
  group: os-latency
  cancel-in-progress: false

env:
  # THE GUARD'S ONE PREVIEW, redeployed in place by every run (apps/os/scripts/preview.ts reads it;
  # preview-sweep.ts CI_WORKFLOW_PREVIEWS knows it).
  PREVIEW_NAME: latency
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  measure:
    name: measure
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Redeploy the preview in place
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_APPS: none
        run: doppler run -- pnpm preview deploy
      # The perf suite alone on the preview; its verdict is the health job's, so a missed budget
      # does not stop the job here. Its credentials are the preview's parent's APP_CONFIG
      # (e2e/support/global-setup.ts).
      - name: Measure (the perf suite)
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |-
          export WORKER_BASE_URL="$(node -p 'require("./output/preview.json").url')"
          doppler run -- pnpm perf:run --reporter=default --reporter=json --outputFile.json=output/perf-report.json \
            || echo "the perf suite exited $?: the health job judges its report"
      - name: Keep the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-latency-report
          path: apps/os/output/perf-report.json
          if-no-files-found: ignore
          overwrite: true
