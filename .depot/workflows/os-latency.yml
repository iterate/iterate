# THE LATENCY MEASUREMENT for apps/os: every 3 hours, deploy main's commit as `latency-<sha7>` (a
# deployment of its own, which nothing else touches: Main OS e2e has its own, and a latency measured
# beside another suite measures that suite; the same deployment again, in place, when main has not
# moved since the last run), run the perf suite against it (apps/os/perf: concurrent project
# creation at 1, 10 and 25 people, sign-in, MCP, a context's first append, wake and processor cold
# start, rule invocation, stream fan-out — every metric and its budget in apps/os/perf/latency.ts),
# and keep Vitest's JSON report as the `os-latency-report` artifact. The deploy's readiness gate
# waits out a brand-new worker's first seconds (main-os-e2e.yml); the run then deletes the
# workflow's deployments before it. Every perf row mints its own people and projects, so nothing it
# measures reads what earlier runs left. The deployment's D1 is created near whoever creates it
# (scripts/os/d1.ts), and every uncached control-plane read the suite times is a round trip to
# it: this workflow's own deploy creates each one, never a laptop's `pnpm preview deploy --name
# latency`, which would place the D1 near the laptop.
#
# The health job judges each scheduled run's report (scripts/monitors/latency.ts), so a run whose perf
# suite failed stays green here. Every 3 hours rather than on main pushes, so the baseline (the last
# 10 runs) spans about 30 hours whatever the merge rate. A dispatch measures a branch, which the
# health job never judges, deploying the branch's commit under the workflow's prefix; the next run of
# main deploys main's again.
#
# Nothing waits on it: its own concurrency group. One run at a time, since each run's cleanup deletes
# the deployment the run before measured: a run that lands meanwhile queues, and a running
# measurement is never cut short.
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow os-latency.yml --ref <branch>
#
# Depot registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.

name: OS latency

permissions:
  contents: read

on:
  schedule:
    # Every 3 hours, off the other schedules' minutes (:07/:22/:37/:52, :13, :41).
    - cron: "29 */3 * * *"
  workflow_dispatch:

concurrency:
  group: os-latency
  cancel-in-progress: false

env:
  # THE PREFIX of the guard's deployments, `latency-<sha7>`: the deploy's `--name`
  # (scripts/os/preview-sweep.ts CI_WORKFLOW_PREVIEWS knows it).
  DEPLOYMENT_PREFIX: latency

jobs:
  measure:
    name: measure
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
      # `<prefix>-<sha7>` of main's commit: a fresh deployment when main moved since the last run,
      # the same one deployed again in place when it has not (scripts/os/preview.ts)
      - name: Deploy main's commit
        id: deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project os --config preview -- pnpm preview deploy --name "$DEPLOYMENT_PREFIX" --apps none
      # The workflow's deployments before this one, deleted now this one is ready
      # (scripts/os/preview.ts `cleanup-superseded`); never this run's verdict.
      - name: Delete the superseded deployments
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: doppler run --project os --config preview -- pnpm preview cleanup-superseded
      # The perf suite alone on the deployment; its verdict is the health job's, so a missed budget
      # does not stop the job here. Its credentials are Doppler os/preview's APP_CONFIG
      # (e2e/support/global-setup.ts).
      - name: Measure (the perf suite)
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |-
          export WORKER_BASE_URL="$(node -p 'require("./output/preview.json").url')"
          doppler run --project os --config preview -- pnpm perf:run --reporter=default --reporter=json --outputFile.json=output/perf-report.json \
            || echo "the perf suite exited $?: the health job judges its report"
      - name: Keep the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-latency-report
          path: apps/os/output/perf-report.json
          if-no-files-found: ignore
          overwrite: true
