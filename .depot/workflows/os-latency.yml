# THE LATENCY GUARD for apps/os: every 3 hours, and on every main push to what reaches the platform,
# deploy a THROWAWAY Worker Preview of main named `latency-<run id>-<attempt>` that nothing else touches
# (Main OS e2e has its own; a latency measured beside another suite measures that suite), run the perf
# suite against it (apps/os/perf: concurrent project creation at 1, 10 and 25 people, sign-in, MCP, a
# context's first append, wake and processor cold start, rule invocation, stream fan-out — every
# metric and its budget in apps/os/perf/latency.ts), judge the run, then DELETE the preview.
#
# The judge (scripts/ci/os-latency-guard.ts) records every measurement to PostHog (`os latency
# measured`) and pages Slack #error-pulse when a metric crosses its budget or regresses sharply
# against its rolling baseline, on a change of state only: red once when it crossed in two runs in a
# row, green once when it is back. A page leaves the run green (a scheduled run reports on main's head,
# where red reads as "this commit broke"); a BROKEN PROBE — the deploy, a row failing for anything but
# a budget, a metric not recorded — fails the run. Its memory is its own `os-latency-state` artifact,
# which the next run reads back (Depot organization token from Doppler _shared/preview).
#
# Nothing waits on it: its own concurrency group, beside Deploy OS and Main OS e2e. One run at a time:
# a push or schedule that lands meanwhile queues, and Depot keeps only the newest queued run, so a
# burst of merges measures its last commit. A running measurement is never cut short: cancelling one
# would cancel its delete (main-os-e2e.yml saw that) and, merge after merge, starve the guard.
#
# Test a branch, and the Slack hookup end to end, by dispatching it: a budget scale of 0.01 puts every
# budget under what anything measures, so every metric crosses and the run pages at once, marked
# 🧪 TEST RUN and mentioning nobody; a test run, or any run off main, keeps no state.
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow os-latency.yml \
#     --ref <branch> --input budget-scale=0.01
#
# Depot registers the schedule and the push trigger once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.

name: OS latency

permissions:
  contents: read

on:
  schedule:
    # Every 3 hours, off the other schedules' minutes (:07/:22/:37/:52, :13, :41).
    - cron: "29 */3 * * *"
  push:
    branches: [main]
    # What reaches the Worker (deploy-os.yml's list) plus the perf suite and this guard.
    paths:
      - .depot/workflows/os-latency.yml
      - scripts/ci/os-latency-guard.ts
      - apps/os/**
      - "!apps/os/*.md"
      - "!apps/os/docs/**"
      - configs/**
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
      - envs.ts
      - scripts/lib/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      budget-scale:
        description: >-
          Multiply every budget by this (a floor is divided by it). Empty measures against the real
          budgets. 0.01 forces every metric over its budget: a test page, and no state kept.
        type: string
        default: ""

concurrency:
  group: os-latency
  cancel-in-progress: false

env:
  # One name per run attempt, never a commit's: a schedule, a re-run or a dispatch can measure the
  # commit the run before just measured, and a preview recreated under the name just deleted answered
  # "Durable Object Namespace was deleted" for a minute after (2026-09-24). apps/os/scripts/preview.ts
  # reads it; preview-sweep.ts `supersededMainPreviews` knows its shape.
  PREVIEW_NAME: latency-${{ github.run_id }}-${{ github.run_attempt }}
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  measure:
    name: measure
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # A run cancelled by hand has its delete cancelled with it: every other `latency-<run>-<attempt>`
      # goes first.
      - name: Delete superseded runs' previews
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm preview delete-superseded
      # A fresh preview: an empty control plane, as the calibration measured.
      - name: Deploy a throwaway preview of this commit
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_APPS: none
        run: doppler run -- pnpm preview deploy
      # The perf suite alone on the preview; its verdict is the judge's, so a missed budget does not
      # stop the job here. Its credentials are the preview's parent's APP_CONFIG (e2e/support/global-setup.ts).
      - name: Measure (the perf suite)
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |-
          export WORKER_BASE_URL="$(node -p 'require("./output/preview.json").url')"
          doppler run -- pnpm perf:run --reporter=default --reporter=json --outputFile.json=output/perf-report.json \
            || echo "the perf suite exited $?: the judge decides"
      - name: Read the previous run's state
        run: |-
          set -euo pipefail
          export DEPOT_TOKEN
          DEPOT_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)"
          pnpm tsx scripts/ci/os-latency-guard.ts previous-state --out test-results/os-latency/previous.json
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Judge, record to PostHog, page #error-pulse on a change of state
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          BUDGET_SCALE: ${{ inputs.budget-scale }}
        run: >-
          pnpm tsx scripts/ci/os-latency-guard.ts judge
          --report apps/os/output/perf-report.json
          --state test-results/os-latency/previous.json
          --state-out test-results/os-latency/state.json
          --run "${{ github.run_id }}-${{ github.run_attempt }}"
          --ref "${{ github.ref }}"
          --trigger "${{ github.event_name }}"
          --budget-scale "${BUDGET_SCALE:-1}"
      # The judge writes the state only for a real run on main: after its page, before PostHog and
      # before it fails a broken probe, so neither costs the next run its memory.
      - name: Keep the state for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-latency-state
          path: test-results/os-latency/state.json
          if-no-files-found: ignore
          overwrite: true
      - name: Keep the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-latency-report
          path: apps/os/output/perf-report.json
          if-no-files-found: ignore
          overwrite: true

  # ALWAYS, cancelled included: the preview, its Artifacts namespace, KV namespaces and R2 bucket.
  delete:
    name: delete
    needs: measure
    if: always()
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Delete the throwaway preview and everything it created
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm preview delete
