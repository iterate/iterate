# THE LATENCY GUARD for apps/os: every 3 hours, deploy main's commit as `latency-<sha7>` (a
# deployment of its own, which nothing else touches: Main OS e2e has its own, and a latency measured
# beside another suite measures that suite; the same deployment again, in place, when main has not
# moved since the last run), run the perf suite against it (apps/os/perf: concurrent project
# creation at 1, 10 and 25 people, sign-in, MCP, a context's first append, wake and processor cold
# start, rule invocation, stream fan-out — every metric and its budget in apps/os/perf/latency.ts),
# and judge the run. The deploy's readiness gate waits out a brand-new worker's first seconds
# (main-os-e2e.yml); the run then deletes the guard's deployments before it. Every perf row mints its
# own people and projects, so nothing it measures reads what earlier runs left. The deployment's D1
# is created near whoever creates it (apps/os/scripts/d1.ts), and every uncached control-plane read
# the suite times is a round trip to it: this workflow's own deploy creates each one, never a
# laptop's `pnpm preview deploy --name latency`, which would place the D1 near the laptop.
#
# The judge (scripts/ci/os-latency-guard.ts) records every measurement to PostHog (`os latency
# measured`) and pages Slack #error-pulse when a metric crosses its budget or regresses sharply
# against its rolling baseline, on a change of state only: red once when it crossed in two runs in a
# row, green once when it is back. A page leaves the run green (a scheduled run reports on main's head,
# where red reads as "this commit broke"); a BROKEN PROBE — the deploy, a row failing for anything but
# a budget, a metric not recorded — fails the run, unless it is ONE row the platform broke (a
# connection reset, a socket the edge dropped, a stalled edge, a call whose connection to a Durable
# Object Cloudflare lost: the judge's PLATFORM_FAILURES) that did not break in the run before: that
# is recorded, a warning, a step-summary line and a PostHog event,
# and the run stays green. Its memory is its own `os-latency-state` artifact,
# which the next run reads back (Depot organization token from Doppler _shared/preview).
#
# Not on main pushes: every 3 hours the baseline (the last 10 runs) spans about 30 hours, where a busy
# merge day's pushes filled it in two and a lasting regression became it. A regression pages 3 to 6
# hours after it lands (two crossings in a row), naming the merges of those hours; to find the one,
# dispatch on a branch cut at a suspect commit (a run off main keeps no state).
#
# Nothing waits on it: its own concurrency group. One run at a time, since each run's cleanup deletes
# the deployment the run before measured: a run that lands meanwhile queues, and a running
# measurement is never cut short.
#
# Test a branch, and the Slack hookup end to end, by dispatching it: a budget scale of 0.01 puts every
# budget under what anything measures, so every metric crosses and the run pages at once, marked
# 🧪 TEST RUN and mentioning nobody; a test run, or any run off main, keeps no state. A dispatch
# deploys the branch's commit under the guard's prefix; the next run of main deploys main's again.
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow os-latency.yml \
#     --ref <branch> --input budget-scale=0.01
#
# Depot registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.

name: OS latency

permissions:
  contents: read

on:
  schedule:
    # Every 3 hours, off the other schedules' minutes (:07/:22/:37/:52, :13, :41).
    - cron: "29 */3 * * *"
  workflow_dispatch:
    inputs:
      budget-scale:
        description: >-
          Multiply every budget by this (a floor is divided by it). Empty measures against the real
          budgets. 0.01 forces every metric over its budget: a test page, and no state kept.
        type: string
        default: ""

concurrency:
  group: os-latency
  cancel-in-progress: false

env:
  # THE PREFIX of the guard's deployments, `latency-<sha7>` (apps/os/scripts/preview.ts reads it;
  # preview-sweep.ts CI_WORKFLOW_PREVIEWS knows it).
  PREVIEW_NAME: latency
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  measure:
    name: measure
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # `<prefix>-<sha7>` of main's commit: a fresh deployment when main moved since the last run,
      # the same one deployed again in place when it has not (apps/os/scripts/preview.ts)
      - name: Deploy main's commit
        id: deploy
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_APPS: none
        run: doppler run -- pnpm preview deploy
      # The workflow's deployments before this one, deleted now this one is ready
      # (apps/os/scripts/preview.ts `cleanup-superseded`); never this run's verdict.
      - name: Delete the superseded deployments
        continue-on-error: true
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: doppler run -- pnpm preview cleanup-superseded
      # The perf suite alone on the preview; its verdict is the judge's, so a missed budget does not
      # stop the job here. Its credentials are Doppler os/preview's APP_CONFIG (e2e/support/global-setup.ts).
      - name: Measure (the perf suite)
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |-
          export WORKER_BASE_URL="$(node -p 'require("./output/preview.json").url')"
          doppler run -- pnpm perf:run --reporter=default --reporter=json --outputFile.json=output/perf-report.json \
            || echo "the perf suite exited $?: the judge decides"
      - name: Read the previous run's state
        run: |-
          set -euo pipefail
          export DEPOT_TOKEN
          DEPOT_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)"
          pnpm tsx scripts/ci/os-latency-guard.ts previous-state --out test-results/os-latency/previous.json
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Judge, record to PostHog, page #error-pulse on a change of state
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          BUDGET_SCALE: ${{ inputs.budget-scale }}
        run: >-
          pnpm tsx scripts/ci/os-latency-guard.ts judge
          --report apps/os/output/perf-report.json
          --state test-results/os-latency/previous.json
          --state-out test-results/os-latency/state.json
          --run "${{ github.run_id }}-${{ github.run_attempt }}"
          --ref "${{ github.ref }}"
          --trigger "${{ github.event_name }}"
          --budget-scale "${BUDGET_SCALE:-1}"
      # The judge writes the state only for a real run on main: after its page, before PostHog and
      # before it fails a broken probe, so neither costs the next run its memory.
      - name: Keep the state for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-latency-state
          path: test-results/os-latency/state.json
          if-no-files-found: ignore
          overwrite: true
      - name: Keep the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-latency-report
          path: apps/os/output/perf-report.json
          if-no-files-found: ignore
          overwrite: true
