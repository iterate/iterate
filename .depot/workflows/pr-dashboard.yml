name: Daily PR dashboard
permissions:
  contents: read
  issues: read
  pull-requests: read
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - closed
concurrency:
  group: pr-dashboard
  cancel-in-progress: false
jobs:
  update_dashboard:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # THE RUN'S OWN COMMIT, the tree this workflow file was read from: the scripts read GitHub and
      # Slack, never the pull request's code (docs/depot-ci.md#which-tree-a-pull-requests-ci-tests).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Notify PR update
        run: pnpm tsx scripts/ci/notify.ts pr-update
      - name: Update PR dashboard
        run: pnpm tsx scripts/ci/pr-dashboard.ts
