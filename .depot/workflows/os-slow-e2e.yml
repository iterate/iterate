# THE SLOW E2E ROWS for apps/os, every 2 hours and on dispatch: redeploy main IN PLACE to the Worker
# Preview `slow-e2e`, run the e2e rows tagged `slow` alone against it, and judge the run. A slow row
# waits out real platform time (the residency rows' quiet minutes, 110–180 s), so a PR that changes
# none of its code skips it (docs/testing.md#slow-rows). Main OS e2e runs every row on each main
# push, but it pages only when main changes state, and a regression that lands while main is red
# would page nobody: a PR outside SLOW_ROW_PATHS that breaks a slow row reaches production first,
# and this run finds it within 2 hours. No run deletes the preview: a brand-new one answers
# Cloudflare's `internal error` for seconds after it is created (main-os-e2e.yml).
#
# The judge (scripts/ci/os-slow-e2e-alert.ts) pages Slack #error-pulse on a change of state only: red
# once, green again once, with the channel's last page as its state, the way Main OS e2e pages. A
# page leaves the run green; a BROKEN PROBE (the deploy, no telemetry, no row tagged `slow` that ran)
# fails the run. A run off main never pages: it prints what it would post. A dispatch redeploys the
# workflow's preview with the branch; the next run of main puts main back. One run at a time, each
# run's deploy waiting for the run before it to finish with the preview.
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow os-slow-e2e.yml --ref <branch>
#
# Depot registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only.

name: OS slow e2e

permissions:
  contents: read

on:
  schedule:
    # Every 2 hours, off the other schedules' minutes (:07/:22/:37/:52, :13, :29, :41, :47).
    - cron: "3 */2 * * *"
  workflow_dispatch:

concurrency:
  group: os-slow-e2e
  cancel-in-progress: false

env:
  # THE WORKFLOW'S ONE PREVIEW, redeployed in place by every run (apps/os/scripts/preview.ts reads it;
  # preview-sweep.ts CI_WORKFLOW_PREVIEWS knows it).
  PREVIEW_NAME: slow-e2e
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  slow-rows:
    name: slow-rows
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    # The vitest reporter's telemetry, which the judge reads (apps/os/scripts/preview.ts).
    env:
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.ref_name }}
      TEST_TELEMETRY_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # --settle: the readiness gate holds 150 s, past the window an in-place redeploy's old version
      # still answers in (up to ~100 s measured), so its reset lands on a probe, never on a row
      # (apps/os/scripts/preview-readiness.ts).
      - name: Redeploy the preview in place
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_APPS: none
        run: doppler run -- pnpm preview deploy --settle 150
      # A failed row is the judge's verdict, so it does not stop the job here.
      - name: Run the slow rows
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          doppler run -- pnpm preview e2e --slow-rows only
          || echo "the slow rows exited $?: the judge decides"
      - name: Judge, page #error-pulse on a change of state
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          pnpm tsx scripts/ci/os-slow-e2e-alert.ts --dir test-results/ci-telemetry/raw
          ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
      - name: Keep the telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-slow-e2e-telemetry
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
