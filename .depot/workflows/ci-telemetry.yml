name: CI telemetry sync
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
# Dispatch only: PostHog delivery is off (scripts/ci/posthog-events.ts), so a run collects and then
# drops everything. The schedule comes back with delivery (docs/ci-test-telemetry.md).
on:
  workflow_dispatch:
concurrency:
  group: ci-telemetry-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      # One day per dispatch. Run the script locally for a longer backfill (it defaults to seven
      # days; stable insert IDs make overlapping windows idempotent).
      CI_TELEMETRY_LOOKBACK_DAYS: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Backfill GitHub, Depot, and review-bot telemetry
        run: |-
          set -euo pipefail
          export DEPOT_CI_TELEMETRY_TOKEN
          DEPOT_CI_TELEMETRY_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)"
          doppler run --project _shared --config prd \
            --preserve-env=DEPOT_CI_TELEMETRY_TOKEN,GITHUB_TOKEN -- \
            pnpm tsx scripts/ci/sync-ci-telemetry.ts
