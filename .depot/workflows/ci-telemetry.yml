# THE CI TELEMETRY SYNC (scripts/ci/sync-ci-telemetry.ts): one PostHog event per Depot workflow run
# and one per job attempt that finished since the previous successful scheduled sync, read from
# Depot's API, with the pull request and branch from GitHub's. No test-level events
# (docs/ci-test-telemetry.md). A failed sync's window goes to the next one, up to six hours back.
name: CI telemetry sync
permissions:
  contents: read
  pull-requests: read
on:
  schedule:
    # Hourly, off the other schedules' minutes (:07/:22/:37/:52, :13, :41).
    - cron: "29 * * * *"
  workflow_dispatch:
concurrency:
  group: ci-telemetry-sync
  cancel-in-progress: false
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
jobs:
  sync:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # The Depot organization token lives in Doppler _shared/preview. The PostHog project key is
      # public and comes from envs.ts.
      - name: Send workflow and job telemetry to PostHog
        run: |-
          set -euo pipefail
          export DEPOT_CI_TELEMETRY_TOKEN
          DEPOT_CI_TELEMETRY_TOKEN="$(doppler secrets get DEPOT_CI_TELEMETRY_TOKEN --plain --project _shared --config preview)"
          pnpm tsx scripts/ci/sync-ci-telemetry.ts
