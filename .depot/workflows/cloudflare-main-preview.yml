# Same preview deploy/readiness/tests/erase as PRs, using the ordinary preview pool.
# Let the active run finish. Depot keeps the newest pending push, so frequent
# merges cannot starve the dashboard of a complete baseline.
name: Main Preview (Depot CI)

permissions:
  contents: read
  statuses: write
  pull-requests: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-main-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Main preview / deploy + e2e
    uses: ./.depot/workflows/preview-run.yml
    with:
      head-sha: ${{ github.sha }}
      all-apps: true
    secrets: inherit
