# THE FLAKE HUNT for apps/os: run the e2e suite N times against one deployed worker (a preview
# deployed from the dispatched ref, `pnpm preview deploy --name <preview>`), each run followed by the
# perf budgets (apps/os/perf, alone on the wire), and tally every row that did not pass every time
# (apps/os/scripts/e2e-soak.ts). Dispatch only — this is a measurement, not a gate:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow os-e2e-soak.yml \
#     --ref <branch> --input runs=100 --input preview=soak-<your slug>
# A SOAK OF ITS OWN NEEDS A PREVIEW OF ITS OWN: every dispatch redeploys its preview before the
# suite, so two soaks of one preview measure each other's deploys (2026-09-24: a full-suite soak of
# main redeployed `soak` ten minutes into two agents.e2e soaks of a fix branch, which then soaked
# main's worker). Delete a named preview when done: `pnpm --dir apps/os preview delete --name <preview>`.
# THE FIRST MINUTES OF A PREVIEW: --input fresh-previews=true deploys a brand-new preview for every
# run instead, runs e2e against it at once and deletes it (e2e-soak.ts --fresh-previews) — main's
# e2e shape before it kept one preview. Dispatch several at once for more previews per hour.
# MAIN'S SHAPE NOW: --input redeploy=true redeploys `preview` in place before every run and runs e2e
# against it at once, never deleting it (e2e-soak.ts --redeploy) — Main OS e2e on `main`. Deploy the
# preview once and let it age first: one created minutes ago is still brand-new.
# DISPATCH ON A REF NOTHING WILL PUSH TO: a push to the dispatched branch cancels the running soak
# (2026-09-24: two 25-run soaks of a PR branch died at run 2 when the PR was rebased) — push the
# commit to a branch of its own (`git push origin <sha>:refs/heads/soak/<name>`) and dispatch that.
# Runs from CI on purpose: from a laptop the OAuth-cookie rows answer 401 (an unexplained laptop-side
# difference), and CI is the environment whose flakes matter. It never pays for a model: the
# real-model rows run only in os-real-model.yml (docs/testing.md#real-model-rows).
name: OS e2e soak
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run the suite
        required: false
        type: string
        default: "100"
      preview:
        description: The Worker Preview this ref deploys and soaks — one name per concurrent soak
        required: false
        type: string
        default: soak
      worker-base-url:
        description: Soak this deployed worker as given instead, with no deploy (never prd)
        required: false
        type: string
        default: ""
      filter:
        description: Optional vitest filter (a file or title fragment) to soak a subset
        required: false
        type: string
        default: ""
      fresh-previews:
        description: "true: every run deploys a brand-new preview, runs e2e against it and deletes it (no perf)"
        required: false
        type: string
        default: "false"
      residency-timing:
        description: '"1" also runs the opt-in residency timing rows (apps/os/perf/context-residency.perf.test.ts) after each e2e run'
        required: false
        type: string
        default: "0"
      redeploy:
        description: "true: every run redeploys `preview` in place and runs e2e against it at once (no perf)"
        required: false
        type: string
        default: "false"
      gap:
        description: With redeploy, seconds to wait after each run before the next redeploy
        required: false
        type: string
        default: "0"
      settle:
        description: With redeploy or fresh-previews, the deploy's --settle (seconds the readiness gate holds)
        required: false
        type: string
        default: "0"
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store

jobs:
  soak:
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 600
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # THE WORKER IS THIS REF'S: the named preview is redeployed from the checkout before the suite
      # runs, so the tests and the worker never skew (2026-09-22: a soak of main's tests against a
      # `soak` worker three merges older failed one row in every run of a hundred). An explicit
      # worker-base-url is soaked as given.
      - name: Deploy the soak preview from this ref
        if: inputs.worker-base-url == '' && inputs.fresh-previews != 'true' && inputs.redeploy != 'true'
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW: ${{ inputs.preview }}
        run: doppler run -- pnpm preview deploy --name "$PREVIEW" --apps none
      # The preview inherits the parent's secrets (APP_CONFIG in Doppler os/preview), so the
      # admin bearer and the sign-in password come from the same object the preview deploy uploads —
      # apps/os/e2e/support/global-setup.ts reads them out of it, and the routing out of the
      # parent's envs.ts entry.
      - name: Soak
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CI: "1"
          WORKER_BASE_URL: ${{ inputs.worker-base-url }}
          PREVIEW: ${{ inputs.preview }}
          RUNS: ${{ inputs.runs }}
          FILTER: ${{ inputs.filter }}
          # one prefix per dispatch, so dispatches running side by side never share a preview
          FRESH_PREVIEWS: ${{ inputs.fresh-previews == 'true' && format('sf-{0}', github.run_id) || '' }}
          RUN_RESIDENCY_TIMING: ${{ inputs.residency-timing }}
          REDEPLOY: ${{ inputs.redeploy }}
          GAP: ${{ inputs.gap }}
          SETTLE: ${{ inputs.settle }}
        run: |
          if [ -n "$FRESH_PREVIEWS" ]; then target=(--fresh-previews "$FRESH_PREVIEWS" --settle "${SETTLE:-0}")
          elif [ "$REDEPLOY" = true ]; then target=(--redeploy "$PREVIEW" --gap "${GAP:-0}" --settle "${SETTLE:-0}")
          else target=(--preview "$PREVIEW"); fi
          doppler run -- pnpm e2e:soak --runs "$RUNS" "${target[@]}" ${FILTER:+--filter "$FILTER"}
      - name: Upload the per-run reports and the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-e2e-soak
          path: apps/os/output/soak
          if-no-files-found: warn
