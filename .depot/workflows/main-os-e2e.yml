# MAIN'S E2E RUN on the dev/preview account, in parallel with Deploy OS, which waits for none of
# it: a push to main (the paths a PR preview runs for) redeploys apps/os's Worker Preview `main` IN
# PLACE, with the clients on top of the same name, and runs the e2e suite and the browser specs
# against it, each in its own job, the jobs a PR's Preview OS has, by the same names: Deploy
# preview, then E2E tests (every row, the ones tagged `slow` that most PRs skip too) and Browser
# specs side by side, then CI trace. No run deletes it: a BRAND-NEW preview's Durable Objects answer
# Cloudflare's `internal error; reference = …` for seconds after it is created, which the deploy's
# readiness gate (apps/os/scripts/preview-readiness.ts) has to wait out. A preview redeployed in place
# still runs the previous version in places for a while, which the gate waits out too
# (docs/depot-ci.md#main-os-e2e-keeps-one-preview). Nothing resets it either: a reset deletes it and
# creates it brand-new. Every row mints its own people and projects, so nothing reads what earlier
# runs left. The nightly sweep keeps it through quiet days (apps/os/scripts/preview-sweep.ts rule 3).
#
# Runs never cancel each other: one at a time, since each redeploys the preview the run before it
# tests, and a push that lands meanwhile queues, where Depot keeps only the newest (a burst of merges
# tests its last commit). So every started run that is not cancelled by hand reaches a verdict, a
# job that hits its timeout counting as red. The `alert` job pages #error-pulse only when main
# changes state — once when it goes red, naming the failed jobs and the failing rows, once when it is
# green again (scripts/ci/main-e2e-alert.ts) — and pages the rows tagged `slow` the same way under
# their own name, "slow e2e rows", so a slow row that breaks while main is already red still pages
# (docs/testing.md#slow-rows). A run off main pages nobody: it prints what it would post. Nothing is
# written to any PR. The `trace` job, beside
# alert, posts the "CI trace" and "Playwright report" statuses on the pushed commit, as a PR
# preview's does (docs/ci-traces.md).
#
# The script is apps/os/scripts/preview.ts (the same commands as a PR's preview, keyed by name).
# The only Depot secret is DOPPLER_TOKEN; Doppler os/preview supplies the Cloudflare
# credentials, _shared/prd the Slack token and the telemetry finalizer's config.

name: Main OS e2e

permissions:
  contents: read
  # The trace job's "CI trace" and "Playwright report" commit statuses.
  statuses: write

on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/deploy-os.yml
      - .depot/workflows/deploy-dash.yml
      - .depot/workflows/deploy-agents.yml
      - .depot/workflows/deploy-notes.yml
      - .depot/workflows/deploy-admin.yml
      - .depot/workflows/deploy-voice.yml
      - .depot/workflows/deploy-kit.yml
      - .depot/workflows/preview-os.yml
      - .depot/workflows/main-os-e2e.yml
      - apps/os/**
      - configs/**
      - apps/dash/**
      - apps/agents/**
      - apps/notes/**
      - apps/admin/**
      - apps/voice/**
      - apps/kit/**
      # kit's firmware ships as GitHub releases (kit-firmware.yml), never in its Worker
      - "!apps/kit/firmware/**"
      - specs/**
      - playwright.config.ts
      - packages/cli/**
      - packages/iterate/**
      - packages/agents/**
      - packages/voice/**
      - packages/shared/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - envs.ts
      - scripts/lib/**
      - scripts/depot-ci/**
  workflow_dispatch:

concurrency:
  group: main-os-e2e
  cancel-in-progress: false

env:
  # THE ONE PREVIEW, redeployed in place by every run (apps/os/scripts/preview.ts reads it;
  # preview-sweep.ts CI_WORKFLOW_PREVIEWS knows it).
  PREVIEW_NAME: main
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  # CI TRACE MARKERS (docs/ci-traces.md): every run step's start and exit, and the test reporters'
  # lifecycle records, as `@@ci-trace` lines in the Depot logs the trace job reads.
  BASH_ENV: ${{ github.workspace }}/scripts/ci/tracing/shell.sh
  CI_TRACE_ENABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  # The parent this preview branches from is main's too, deployed beside this by
  # preview-parents.yml; a preview does not depend on its parent's code.
  deploy:
    name: Deploy preview
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Redeploy the preview in place
        id: deploy
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_APPS: all
        run: doppler run -- pnpm preview deploy

  # THE TWO SUITES, as a PR's Preview OS runs them (preview-os.yml): E2E tests and Browser specs,
  # side by side after the deploy, and ONE DEFINITION. Browser specs runs E2E tests' runner, outputs
  # and steps (the `suite-runner`, `suite-outputs` and `suite-steps` anchors); the two differ only in
  # the suite their env names. Their steps are a PR preview's, less the guard and the PR's checkouts,
  # plus the failing rows the alert names (scripts/ci/depot-workflows.test.ts keeps them alike).
  e2e:
    name: E2E tests
    needs: deploy
    runs-on: &suite-runner
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    env:
      # THE SUITE, as in preview-os.yml: `pnpm preview <suite>`, its flake records' suite, and the
      # workspace its telemetry names
      SUITE: e2e
      FLAKE_SUITE: preview-e2e
      TEST_TELEMETRY_EXPECTED_WORKSPACES: os
      # every row, the ones tagged `slow` too: most PRs skip them (docs/testing.md#slow-rows). The
      # alert pages them under their own name, from the verdict the failing-rows step judges.
      E2E_SLOW_ROWS: run
      JUDGED_SUITE: slow e2e rows
      JUDGED_TAG: slow
      # TEST TELEMETRY, as a PR preview's test jobs write it; main's flake records and suite
      # summaries feed the flake dashboard through the test evidence in R2.
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: main
      TEST_TELEMETRY_HEAD_SHA: ${{ github.sha }}
    outputs: &suite-outputs
      failing-rows: ${{ steps.failing-rows.outputs.failing-rows }}
      suite-verdict: ${{ steps.failing-rows.outputs.suite-verdict }}
    steps: &suite-steps
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run the suite against the preview
        # The trace's Test phase is this step (scripts/ci/tracing/tracing.ts).
        id: suite
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: doppler run -- pnpm preview "$SUITE"
      # The rows the alert names when main goes red, and the verdict of the suite the job judges
      # (JUDGED_SUITE, the rows tagged JUDGED_TAG), which the alert pages under its own name. A job
      # that judges none (both empty) outputs only its failing rows.
      - name: Collect the failing rows
        id: failing-rows
        if: always()
        run: >-
          pnpm tsx scripts/ci/main-e2e-alert.ts failing-rows --dir test-results/ci-telemetry/raw
          --suite "$JUDGED_SUITE" --tag "$JUDGED_TAG"
      - name: Check test telemetry and write the suite summary
        if: always()
        run: pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites "$FLAKE_SUITE" ${{ cancelled() && '--cancelled' || '' }}
      # THE TEST EVIDENCE FOLDER (docs/test-evidence.md): test-results/ holds everything this job
      # attempt's tests left, and target.json the deployment they ran against. This adds one row per
      # test (tables/tests.parquet), then manifest.json: the run's result (from the suite's step and
      # the finalizer's check), the tested commit and tree, the job attempt and every file's sha256.
      # Neither this nor the upload decides the job; the tests did.
      - name: Write the test evidence manifest
        id: evidence-write
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          TEST_EVIDENCE_STEPS: ${{ env.SUITE }}=${{ steps.suite.outcome }}
        run: pnpm tsx scripts/ci/test-evidence.ts write ${{ cancelled() && '--cancelled' || '' }}
      # THE UPLOADS, side by side: each only reads test-results/, and `fail-fast: false` lets every
      # one finish whatever another does (docs/depot-ci.md#parallel-steps).
      - fail-fast: false
        parallel:
          # With the Cloudflare API token preview deploys use (Doppler _shared/preview), as S3 keys.
          # A cancelled or timed-out job's folder too: its manifest says so, and it gets no tables/
          # copy. A failure is a warning and a line of the job's summary, never the job's result.
          - name: Upload the test evidence to R2
            id: evidence-upload
            if: ${{ always() && hashFiles('test-results/manifest.json') != '' }}
            continue-on-error: true
            timeout-minutes: 3
            env:
              DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            run: doppler run --project _shared --config preview -- pnpm tsx scripts/ci/test-evidence.ts upload
          - name: Upload flake records
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: flake-records-${{ env.FLAKE_SUITE }}-attempt-${{ steps.attempt.outputs.id }}
              path: test-results/flake-records/${{ env.FLAKE_SUITE }}
              if-no-files-found: ignore
          - name: Upload test telemetry artifacts
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: main-test-telemetry-attempt-${{ steps.attempt.outputs.id }}
              path: test-results/ci-telemetry
              include-hidden-files: true
              if-no-files-found: error
          # EVERYTHING THE RUN WROTE and the specs' Playwright HTML report, as a PR preview's test
          # jobs keep them (docs/depot-ci.md#browser-reports-from-artifacts).
          - name: Upload results
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: main-os-test-artifacts-attempt-${{ steps.attempt.outputs.id }}
              path: test-results
              include-hidden-files: true
              if-no-files-found: error
          - name: Upload public Playwright HTML report
            if: ${{ always() && hashFiles('test-results/playwright-html/index.html') != '' }}
            uses: actions/upload-artifact@v4
            with:
              name: public-playwright-report
              path: test-results/playwright-html
              if-no-files-found: error
              retention-days: 30
              overwrite: true
      # Either step that failed before it could say why (Doppler, pnpm, its timeout) gets its
      # warning and summary line here; one that reported itself is left alone.
      - name: Report a test evidence step that could not
        if: ${{ always() && (steps.evidence-write.outcome == 'failure' || steps.evidence-upload.outcome == 'failure') }}
        run: bash scripts/ci/test-evidence-unreported.sh "${{ steps.evidence-write.outcome }}" "${{ steps.evidence-upload.outcome }}"

  specs:
    name: Browser specs
    needs: deploy
    runs-on: *suite-runner
    timeout-minutes: 30
    env:
      SUITE: specs
      FLAKE_SUITE: specs
      TEST_TELEMETRY_EXPECTED_WORKSPACES: iterate-root
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: main
      TEST_TELEMETRY_HEAD_SHA: ${{ github.sha }}
    outputs: *suite-outputs
    steps: *suite-steps

  # THE CI TRACE, as a PR preview's trace job makes it (preview-os.yml): the deploy and two
  # test jobs' timings and markers, uploaded, then the "CI trace" and "Playwright report" statuses on
  # the pushed commit. Beside alert, which waits for none of it.
  trace:
    name: CI trace
    needs: [deploy, e2e, specs]
    if: always()
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Record the traced commit
        run: echo "CI_TRACE_STATUS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # The Depot organization token CI telemetry uses (Doppler _shared/preview) reads the workflow
      # and its jobs' logs; only `@@ci-trace` lines are kept.
      - name: Collect the trace
        id: trace
        timeout-minutes: 5
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts current ci-trace.ignoreme
      # A re-run of this job alone keeps the execution, so the name, of the run it traces; without
      # overwrite the upload fails and the report statuses are never posted.
      - name: Upload the CI trace
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trace.outputs.artifact-name }}
          path: ci-trace.ignoreme/trace.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      # Finds both artifacts in Depot by name, so it runs after the upload.
      - name: Post the report statuses
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts publish ci-trace.ignoreme

  # Main's and the slow rows' state changes only: red once, green again once. A job that hit its
  # timeout is red; a run cancelled by hand gets no alert, and a run off main pages nobody.
  alert:
    name: alert
    needs: [deploy, e2e, specs]
    if: ${{ !cancelled() }}
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Page #error-pulse when main changes state
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          pnpm tsx scripts/ci/main-e2e-alert.ts alert --ref "${{ github.ref }}"
