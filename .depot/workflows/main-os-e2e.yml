# MAIN'S E2E RUN on the dev/preview account, in parallel with Deploy OS, which waits for none of
# it: a push to main (the paths a PR preview runs for) deploys a THROWAWAY Worker Preview of
# apps/os named `main-<short sha>`, with fresh resources of its own (KV, R2, Artifacts namespace,
# Durable Object namespaces) and the clients on top, runs the e2e suite and the browser specs
# against it, then DELETES the preview and everything it created. A failed run still deletes (the
# `delete` job runs always).
#
# Runs never cancel each other: one at a time, and a push that lands meanwhile queues, where Depot
# keeps only the newest (a burst of merges tests its last commit). So every started run that is not
# cancelled by hand reaches `delete` and a verdict, a job that hits its timeout counting as red. The
# `alert` job pages #error-pulse only when main changes state — once when it goes red, naming the
# failed jobs and the failing rows, once when it is green again (scripts/ci/main-e2e-alert.ts).
# Nothing is written to any PR. The `trace` job, beside delete, posts the "CI trace" and "Playwright
# report" statuses on the pushed commit, as a PR preview's does (docs/ci-traces.md).
#
# A run cancelled by hand has its queued jobs cancelled with it, `delete` included, so each run
# deletes every other `main-<sha>` preview before it deploys; the nightly sweep
# (preview-sweep.yml) deletes a PR-less preview a day after its last deploy as the backstop.
#
# The script is apps/os/scripts/preview.ts (the same commands as a PR's preview, keyed by name).
# The only Depot secret is DOPPLER_TOKEN; Doppler os/preview supplies the Cloudflare
# credentials, _shared/prd the Slack token and the telemetry finalizer's config.

name: Main OS e2e

permissions:
  contents: read
  # The trace job's "CI trace" and "Playwright report" commit statuses.
  statuses: write

on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/deploy-os.yml
      - .depot/workflows/deploy-dash.yml
      - .depot/workflows/deploy-agents.yml
      - .depot/workflows/deploy-notes.yml
      - .depot/workflows/deploy-voice.yml
      - .depot/workflows/deploy-kit.yml
      - .depot/workflows/preview-os.yml
      - .depot/workflows/main-os-e2e.yml
      - apps/os/**
      - configs/**
      - apps/dash/**
      - apps/agents/**
      - apps/notes/**
      - apps/voice/**
      - apps/kit/**
      # kit's firmware ships as GitHub releases (kit-firmware.yml), never in its Worker
      - "!apps/kit/firmware/**"
      - specs/**
      - playwright.config.ts
      - packages/cli/**
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - envs.ts
      - scripts/lib/**
      - scripts/depot-ci/**
  workflow_dispatch:

concurrency:
  group: main-os-e2e
  cancel-in-progress: false

env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  # CI TRACE MARKERS (docs/ci-traces.md): every run step's start and exit, and the test reporters'
  # lifecycle records, as `@@ci-trace` lines in the Depot logs the trace job reads.
  BASH_ENV: ${{ github.workspace }}/scripts/ci/tracing/shell.sh
  CI_TRACE_ENABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  # THE PREVIEW PARENT FROM MAIN: every preview branches from os-preview (envs.ts
  # osEnvs.preview), and nothing else redeployed it when main changed: after #2888 it ran code from
  # before ControlPlaneDurableObject (2026-09-23). Its own group, so two pushes never deploy it at
  # once. The start-app parents need no such job: their one Durable Object class never changes.
  parent:
    name: deploy the preview parent from main
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    concurrency:
      group: os-preview-parent
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy os-preview from main
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy --env preview

  deploy:
    name: deploy
    needs: parent
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 40
    outputs:
      preview-name: ${{ steps.name.outputs.preview-name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      # One preview per pushed commit, never reused: `main-<short sha>`.
      - name: Name the throwaway preview
        id: name
        run: echo "preview-name=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # A cancelled run's queued jobs are cancelled with it, its `always()` delete included
      # (main-44db0e6, 2026-09-23): this run deletes every other `main-<sha>` preview first.
      - name: Delete superseded runs' previews
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_NAME: ${{ steps.name.outputs.preview-name }}
        run: doppler run -- pnpm preview delete-superseded
      - name: Deploy the throwaway preview
        id: deploy
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_NAME: ${{ steps.name.outputs.preview-name }}
          PREVIEW_APPS: all
        run: doppler run -- pnpm preview deploy

  e2e:
    name: e2e
    needs: deploy
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    # TEST TELEMETRY, as a PR preview's e2e job writes it; main's suite summaries feed the flake
    # dashboard (scripts/ci/flake-dashboard/update.ts SUITE_WORKFLOWS).
    env:
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: main
      TEST_TELEMETRY_HEAD_SHA: ${{ github.sha }}
    outputs:
      failing-rows: ${{ steps.failing-rows.outputs.failing-rows }}
    steps:
      # EVIDENCE PER JOB ATTEMPT (docs/depot-ci.md#artifacts-per-job-attempt): the artifacts this job
      # uploads carry its attempt's id, so a retry's uploads sit beside the failed attempt's instead of
      # colliding with them or, with overwrite, deleting them. First, so every upload can name itself.
      - name: Name this attempt's artifacts
        id: attempt
        # The job URL's `attempt=` is the attempt's id (a retry gets a new one).
        run: |
          id="${DEPOT_JOB_URL##*attempt=}"
          [[ "$id" =~ ^[a-z0-9]+$ ]] || { echo "DEPOT_JOB_URL names no job attempt: '${DEPOT_JOB_URL:-}'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run the e2e suite and the browser specs against the preview
        # The trace's Test phase is this step (scripts/ci/tracing/tracing.ts).
        id: e2e
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PREVIEW_NAME: ${{ needs.deploy.outputs.preview-name }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: doppler run -- pnpm preview e2e
      # The rows the alert names when main goes red.
      - name: Collect the failing rows
        id: failing-rows
        if: always()
        run: pnpm tsx scripts/ci/main-e2e-alert.ts failing-rows --dir test-results/ci-telemetry/raw
      - name: Check test telemetry and write the suite summaries
        if: always()
        env:
          TEST_TELEMETRY_EXPECTED_WORKSPACES: "iterate-root,os"
        run: pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites preview ${{ cancelled() && '--cancelled' || '' }}
      - name: Upload specs flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-specs-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/flake-records/specs
          if-no-files-found: ignore
      - name: Upload preview e2e flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-preview-e2e-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/flake-records/preview-e2e
          if-no-files-found: ignore
      - name: Upload test telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-test-telemetry-attempt-${{ steps.attempt.outputs.id }}
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: error
      # THE BROWSER EVIDENCE, as a PR preview's e2e job keeps it (docs/depot-ci.md#browser-reports-from-artifacts).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-os-test-artifacts-attempt-${{ steps.attempt.outputs.id }}
          path: test-results
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload public Playwright HTML report
        if: ${{ always() && hashFiles('test-results/playwright-html/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-playwright-report
          path: test-results/playwright-html
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # ALWAYS, whatever happened before, cancelled included: the preview, its Artifacts
  # namespace, KV namespaces and R2 bucket, and the clients' previews of the same name.
  delete:
    name: delete
    needs: [deploy, e2e]
    if: always()
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # The name is derived here too: a deploy cancelled before it set its output may still have created resources.
      - name: Delete the throwaway preview and everything it created
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: PREVIEW_NAME="main-${GITHUB_SHA::7}" doppler run -- pnpm preview delete

  # THE CI TRACE, as a PR preview's trace job makes it (preview-os.yml): the parent, deploy and e2e
  # jobs' timings and markers, uploaded, then the "CI trace" and "Playwright report" statuses on the
  # pushed commit. Beside delete and alert, which wait for none of it.
  trace:
    name: trace
    needs: [parent, deploy, e2e]
    if: always()
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Record the traced commit
        run: echo "CI_TRACE_STATUS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      # The Depot organization token CI telemetry uses (Doppler _shared/preview) reads the workflow
      # and its jobs' logs; only `@@ci-trace` lines are kept.
      - name: Collect the trace
        id: trace
        timeout-minutes: 5
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts current ci-trace.ignoreme
      # A re-run of this job alone keeps the execution, so the name, of the run it traces; without
      # overwrite the upload fails and the report statuses are never posted.
      - name: Upload the CI trace
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trace.outputs.artifact-name }}
          path: ci-trace.ignoreme/trace.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      # Finds both artifacts in Depot by name, so it runs after the upload.
      - name: Post the report statuses
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          doppler run --project _shared --config preview --
          pnpm exec trpc-cli scripts/ci/tracing/cli.ts publish ci-trace.ignoreme

  # Main's state changes only: red once, green again once. A job that hit its timeout is red; a run
  # cancelled by hand gets no alert.
  alert:
    name: alert
    needs: [parent, deploy, e2e, delete]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Page #error-pulse when main changes state
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
        run: pnpm tsx scripts/ci/main-e2e-alert.ts alert
