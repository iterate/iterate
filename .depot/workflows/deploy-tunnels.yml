name: Deploy Tunnels Gateway
permissions:
  contents: read
  deployments: write
concurrency:
  group: tunnels-${{ github.ref_name || 'prd' }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    paths:
      - apps/tunnels/**
      - packages/shared/**
      - packages/ui/**
      - packages/mock-http-proxy/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project tunnels
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy apps/tunnels
        working-directory: apps/tunnels
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm alchemy:up
