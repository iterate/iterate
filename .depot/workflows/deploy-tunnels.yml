name: Deploy Tunnels Gateway
permissions:
  contents: read
concurrency:
  group: deploy-tunnels-production
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/deploy-tunnels.yml
      - apps/tunnels/**
      - packages/shared/**
      - envs.ts
      - scripts/lib/**
      - pnpm-lock.yaml
  workflow_dispatch:
jobs:
  deploy:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Deploy apps/tunnels
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project tunnels --config prd -- pnpm --dir apps/tunnels run-script deploy
