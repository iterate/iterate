name: Deploy Tunnels Gateway
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same production Worker. Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-tunnels-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-tunnels.yml
      - apps/tunnels/**
      - envs.ts
      - scripts/lib/**
      - packages/shared/**
      - packages/ui/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project tunnels
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy apps/tunnels
        working-directory: apps/tunnels
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy
