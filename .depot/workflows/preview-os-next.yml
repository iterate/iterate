# ONE PREVIEW PER PULL REQUEST of apps/os, on Cloudflare Worker Previews — the shape of
# cloudflare/cloudflare-os's .github/workflows/preview.yml, cut down to one worker and run on Depot.
# The script is apps/os/scripts/preview.ts. One job per operation, named for when it runs:
#   deploy              every push: deploys a preview named `pr<n>-<branch slug>` of the parent
#                       worker os-next-preview and writes the URL and the operations into the PR body
#   e2e                 after deploy succeeds: the e2e suite and the Playwright specs against it,
#                       then their test telemetry and flake records as artifacts
#   residency           after every suite: fails if any Durable Object is still resident five minutes
#                       after it (apps/os/scripts/preview-residency.ts), then always redeploys
#                       the preview, which ends the sessions the run left open
#   delete (PR closed)  deletes the preview and everything it owned
#   sweep (nightly)     deletes previews whose PR closed without a delete, or that went stale
# On a push, "delete" and "sweep" skip by design; "e2e" skips only when deploy did not succeed.
#
# Depot registers automatic triggers when this file is on the default branch. Test a branch with:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-os-next.yml --ref <branch> \
#     --input pull-request-number=<pr> --input action=deploy
# Every operation the PR body lists is a dispatch: action = deploy | reset | e2e | delete | sweep,
# apps = all | auto | none (the apps on top: dash, agents, notes, voice). Pull-request runs use
# all so every client is usable against the platform preview; auto remains available for a faster
# targeted manual redeploy once the clients are already present. action=deploy or reset runs the
# deploy job and then e2e, as a push does; action=e2e runs e2e alone.
#
# Concurrency per PR, never cancelled: a half-applied preview is worse than a slow one (their words).
# The only Depot secret is DOPPLER_TOKEN; Doppler project-worker/preview supplies the Cloudflare
# credentials and the two secrets the preview inherits (APP_CONFIG, APP_CONFIG_SECRETS__KEY).

name: Preview OS

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      # A production-workflow change must exercise this isolated deployment:
      # production runs deploy's non-mutating readiness probes only.
      - .depot/workflows/deploy-os-next.yml
      - .depot/workflows/deploy-dash.yml
      - .depot/workflows/deploy-agents.yml
      - .depot/workflows/deploy-notes.yml
      - .depot/workflows/deploy-voice.yml
      - .depot/workflows/preview-os-next.yml
      - apps/os/**
      - configs-next/**
      - apps/dash/**
      - apps/agents/**
      - apps/notes/**
      - apps/voice/**
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - envs.ts
      - scripts/lib/**
      - scripts/depot-ci/**
  schedule:
    # Nightly, off the hour: what stops a force-closed PR, or a failed cleanup, from leaking a
    # preview and its D1 (cloudflare-os runs theirs at 04:37 too).
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number (every action but sweep)
        required: false
        type: string
        default: ""
      action:
        description: deploy | reset | e2e | delete | sweep
        required: false
        type: string
        default: deploy
      apps:
        description: "The apps on top (dash, agents, notes, voice): all = every client, auto = changed clients, none"
        required: false
        type: string
        default: all

concurrency:
  group: preview-os-next-${{ github.event.pull_request.number || inputs.pull-request-number || 'sweep' }}
  cancel-in-progress: false

env:
  # THE STORE THE IMAGE WAS BAKED WITH. scripts/depot-ci/dependencies.mjs hashes every pnpm_config_*
  # variable into its fingerprint (the store dir decides where node_modules links point), and the bake
  # job sets this one — so a workflow without it computes a different fingerprint on identical sources
  # and never reuses the baked node_modules (every os-next job, 2026-09-22, ~55 s of paging each).
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
  ACTION: ${{ inputs.action || 'deploy' }}

jobs:
  deploy:
    name: deploy
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && (inputs.action == 'deploy' || inputs.action == 'reset'))
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 40
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # `deploy` redeploys in place; `reset` deletes the preview and its D1 first. Either way the
      # script ends by writing the URL and the operations into the PR body (GITHUB_TOKEN).
      - name: Deploy (or reset) the preview
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_APPS: ${{ inputs.apps || 'all' }}
        run: doppler run -- pnpm preview "$ACTION"

  # THE FULL MUTATING PROOF (docs/testing.md): this isolated preview owns the project-creating
  # e2e and browser suites. Production deployment runs only its deploy-script readiness probes.
  # It runs after every deploy that succeeded, and alone against the live preview on a dispatch
  # with action=e2e, where deploy is skipped: `always()` is what lets it start behind a skipped
  # deploy, `needs.deploy.result` what keeps it off a failed or cancelled one.
  e2e:
    name: e2e
    needs: deploy
    if: >-
      always() &&
      (needs.deploy.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && inputs.action == 'e2e'))
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    # TEST TELEMETRY (docs/testing.md#flakes-and-pinned-failures): both runners write their canonical
    # artifact here, each suite's flake lines go to its own directory (apps/os/scripts/preview.ts),
    # and the always-running steps after the suite normalize, summarize and upload them.
    env:
      TEST_TELEMETRY_ARTIFACT_DIR: test-results/ci-telemetry/raw
      TEST_TELEMETRY_BRANCH: ${{ github.head_ref || github.ref_name }}
      TEST_TELEMETRY_PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
    # The suite's boundaries, for the residency job. Written by steps that cannot fail, so a red
    # suite still hands them over.
    outputs:
      suite-started: ${{ steps.suite-started.outputs.at }}
      suite-ended: ${{ steps.suite-ended.outputs.at }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      # A dispatch checks out refs/pull/<n>/head, so the tested commit is what was checked out.
      - name: Record the tested commit for test telemetry
        run: echo "TEST_TELEMETRY_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Record the suite's start
        id: suite-started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run the e2e suite against the preview
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: doppler run -- pnpm preview e2e
      - name: Record the suite's end
        id: suite-ended
        if: always() && steps.suite-started.outcome == 'success'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Fails when either runner left no complete artifact, and writes the specs and preview-e2e
      # suite summaries next to their flake lines. It runs under _shared/prd like the Test
      # workflow's finalizer; PostHog delivery itself is off (scripts/ci/posthog-events.ts). A
      # cancelled run keeps its partial evidence without reporting it as failures.
      - name: Normalize test telemetry and write the suite summaries
        if: always()
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TEST_TELEMETRY_EXPECTED_WORKSPACES: "iterate-root,os"
        run: doppler run --project _shared --config prd -- pnpm tsx scripts/ci/upload-test-telemetry.ts --flake-suites preview ${{ cancelled() && '--cancelled' || '' }}
      # One artifact per suite, pulled by the flake dashboard's writer. A job retry re-uploads under
      # the same name, hence overwrite.
      - name: Upload specs flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-specs
          path: test-results/flake-records/specs
          if-no-files-found: ignore
          overwrite: true
      - name: Upload preview e2e flake records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-records-preview-e2e
          path: test-results/flake-records/preview-e2e
          if-no-files-found: ignore
          overwrite: true
      - name: Upload test telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-test-telemetry
          path: test-results/ci-telemetry
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  # AFTER EVERY SUITE, on a small runner so the big one is not held idle through the wait: the
  # residency gate (apps/os/scripts/preview-residency.ts) waits until the Durable Object
  # analytics cover the five minutes starting five minutes after the suite ended, then fails if any
  # object of the preview was still resident with every client closed — the leak class that ran the
  # dev/preview account past $1000/day on 09-21/22 behind a green suite. Then, ALWAYS, the release
  # redeploys the preview (a redeploy, never a reset), which ends the sessions the run left open
  # instead of billing them until the next push (an object re-woken after the redeploy survives it;
  # the next run's gate names it). In that order: a redeploy first would end the very sessions the
  # gate looks for. The PR's concurrency group covers this job, so the next push deploys only after
  # the release.
  residency:
    name: residency
    needs: e2e
    if: always() && needs.e2e.outputs.suite-started != ''
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Fail on any Durable Object still resident five minutes after the suite
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_SUITE_STARTED: ${{ needs.e2e.outputs.suite-started }}
          PREVIEW_SUITE_ENDED: ${{ needs.e2e.outputs.suite-ended }}
        run: doppler run -- pnpm preview residency
      - name: Release — redeploy the preview, ending the sessions the run left open
        if: always()
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_APPS: ${{ inputs.apps || 'all' }}
        run: doppler run -- pnpm preview release

  cleanup:
    name: delete (PR closed)
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && inputs.action == 'delete')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      # The PR's own head, not the default branch: the teardown reads the config that created the
      # preview (cloudflare-os does the same).
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Delete the preview and its D1
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: doppler run -- pnpm preview delete

  sweep:
    name: sweep (nightly)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'sweep')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sweep previews whose PR is closed, or older than 7 days
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: doppler run -- pnpm preview sweep
