# ONE PREVIEW PER PULL REQUEST of apps/os, on Cloudflare Worker Previews — the shape of
# cloudflare/cloudflare-os's .github/workflows/preview.yml, cut down to one worker and run on Depot.
# The script is apps/os/scripts/preview.ts. One job per operation, named for when it runs:
#   deploy              every push: deploys a preview named `pr<n>-<branch slug>` of the parent
#                       worker os-next-preview and writes the URL and the operations into the PR body
#   e2e                 after deploy succeeds: the e2e suite and the Playwright specs against it
#   delete (PR closed)  deletes the preview and everything it owned
#   sweep (nightly)     deletes previews whose PR closed without a delete, or that went stale
# On a push, "delete" and "sweep" skip by design; "e2e" skips only when deploy did not succeed.
#
# Depot registers automatic triggers when this file is on the default branch. Test a branch with:
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#     --workflow preview-os-next.yml --ref <branch> \
#     --input pull-request-number=<pr> --input action=deploy
# Every operation the PR body lists is a dispatch: action = deploy | reset | e2e | delete | sweep,
# apps = all | auto | none (the apps on top: dash, agents, notes, voice). Pull-request runs use
# all so every client is usable against the platform preview; auto remains available for a faster
# targeted manual redeploy once the clients are already present. action=deploy or reset runs the
# deploy job and then e2e, as a push does; action=e2e runs e2e alone.
#
# Concurrency per PR, never cancelled: a half-applied preview is worse than a slow one (their words).
# The only Depot secret is DOPPLER_TOKEN; Doppler project-worker/preview supplies the Cloudflare
# credentials and the two secrets the preview inherits (APP_CONFIG, APP_CONFIG_SECRETS__KEY).

name: Preview OS

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      # A production-workflow change must exercise this isolated deployment:
      # production runs deploy's non-mutating readiness probes only.
      - .depot/workflows/deploy-os-next.yml
      - .depot/workflows/deploy-dash.yml
      - .depot/workflows/deploy-agents.yml
      - .depot/workflows/deploy-notes.yml
      - .depot/workflows/deploy-voice.yml
      - .depot/workflows/preview-os-next.yml
      - apps/os/**
      - configs-next/**
      - apps/dash/**
      - apps/agents/**
      - apps/notes/**
      - apps/voice/**
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - envs.ts
      - scripts/lib/**
      - scripts/depot-ci/**
  schedule:
    # Nightly, off the hour: what stops a force-closed PR, or a failed cleanup, from leaking a
    # preview and its D1 (cloudflare-os runs theirs at 04:37 too).
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number (every action but sweep)
        required: false
        type: string
        default: ""
      action:
        description: deploy | reset | e2e | delete | sweep
        required: false
        type: string
        default: deploy
      apps:
        description: "The apps on top (dash, agents, notes, voice): all = every client, auto = changed clients, none"
        required: false
        type: string
        default: all

concurrency:
  group: preview-os-next-${{ github.event.pull_request.number || inputs.pull-request-number || 'sweep' }}
  cancel-in-progress: false

env:
  # THE STORE THE IMAGE WAS BAKED WITH. scripts/depot-ci/dependencies.mjs hashes every pnpm_config_*
  # variable into its fingerprint (the store dir decides where node_modules links point), and the bake
  # job sets this one — so a workflow without it computes a different fingerprint on identical sources
  # and never reuses the baked node_modules (every os-next job, 2026-09-22, ~55 s of paging each).
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
  ACTION: ${{ inputs.action || 'deploy' }}

jobs:
  deploy:
    name: deploy
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && (inputs.action == 'deploy' || inputs.action == 'reset'))
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 40
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # `deploy` redeploys in place; `reset` deletes the preview and its D1 first. Either way the
      # script ends by writing the URL and the operations into the PR body (GITHUB_TOKEN).
      - name: Deploy (or reset) the preview
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_APPS: ${{ inputs.apps || 'all' }}
        run: doppler run -- pnpm preview "$ACTION"

  # THE FULL MUTATING PROOF (docs/testing.md): this isolated preview owns the project-creating
  # e2e and browser suites. Production deployment runs only its deploy-script readiness probes.
  # It runs after every deploy that succeeded, and alone against the live preview on a dispatch
  # with action=e2e, where deploy is skipped: `always()` is what lets it start behind a skipped
  # deploy, `needs.deploy.result` what keeps it off a failed or cancelled one.
  e2e:
    name: e2e
    needs: deploy
    if: >-
      always() &&
      (needs.deploy.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && inputs.action == 'e2e'))
    runs-on:
      size: 4x16
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run the e2e suite against the preview
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: doppler run -- pnpm preview e2e

  cleanup:
    name: delete (PR closed)
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.pull-request-number != '' && inputs.action == 'delete')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      # The PR's own head, not the default branch: the teardown reads the config that created the
      # preview (cloudflare-os does the same).
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull-request-number) }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Delete the preview and its D1
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: doppler run -- pnpm preview delete

  sweep:
    name: sweep (nightly)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'sweep')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config preview --project project-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sweep previews whose PR is closed, or older than 7 days
        working-directory: apps/os
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: doppler run -- pnpm preview sweep
