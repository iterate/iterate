name: Cloudflare Edge Gate

permissions:
  contents: read

on:
  pull_request:
    paths:
      - .depot/workflows/cloudflare-edge-gate.yml
      - infra/cloudflare-edge-gate/**
      - scripts/cloudflare-edge-gate/**
      - envs.ts
      - scripts/lib/**
  push:
    branches:
      - main
    paths:
      - .depot/workflows/cloudflare-edge-gate.yml
      - infra/cloudflare-edge-gate/**
      - scripts/cloudflare-edge-gate/**
      - envs.ts
      - scripts/lib/**
  workflow_dispatch: {}

jobs:
  plan:
    concurrency:
      group: cloudflare-edge-gate-plan-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test and typecheck policy
        run: pnpm --dir scripts test cloudflare-edge-gate/reconcile.test.ts && pnpm --dir scripts typecheck
      - name: Plan production edge gate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm edge-gate plan --env prd

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    concurrency:
      # Every run targets the same account phase. Finish an active apply and
      # retain only the newest queued revision.
      group: deploy-cloudflare-edge-gate-production
      cancel-in-progress: false
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test and typecheck policy
        run: pnpm --dir scripts test cloudflare-edge-gate/reconcile.test.ts && pnpm --dir scripts typecheck
      - name: Apply production edge gate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm edge-gate apply --env prd
      - name: Verify production edge gate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm edge-gate verify --env prd
