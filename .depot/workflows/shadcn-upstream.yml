# SHADCN UPSTREAM (scripts/ci/shadcn-drift.ts report): once a day, ask the pinned shadcn CLI whether
# `shadcn add` would still write packages/ui's vendored files as they are on main
# (packages/ui/AGENTS.md). When the set of files upstream has moved changes, post it to Slack #ci:
# which files, and the refresh command. A drift nobody refreshed is posted again a week later; back in
# sync is posted once. #ci's history is the only state. The run stays green when it posts: upstream
# moving is news, not a broken main. It fails only when it could not ask the registry (the next day's
# run asks again) or could not post.
#
# A run off main prints what it would post and posts nothing:
#
#   depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate --workflow shadcn-upstream.yml --ref <branch>
#
# Depot registers the schedule once this file is on the default branch.
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN only (the Slack bot token, _shared/prd).
name: shadcn upstream
permissions:
  contents: read
on:
  schedule:
    # Daily at 06:53 UTC, off the other schedules' minutes.
    - cron: "53 6 * * *"
  workflow_dispatch: {}
concurrency:
  group: shadcn-upstream
  cancel-in-progress: false
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
jobs:
  report:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Report upstream changes to #ci
        run: pnpm tsx scripts/ci/shadcn-drift.ts report ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
