name: Deploy dummy-petshop
permissions:
  contents: read
concurrency:
  group: deploy-dummy-petshop-production
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/deploy-dummy-petshop.yml
      - apps/dummy-petshop/**
      - pnpm-lock.yaml
  workflow_dispatch:
jobs:
  deploy:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The committed wrangler.jsonc names the worker and the prd account; Doppler supplies the
      # Cloudflare credentials. PETSHOP_SEAL_KEY is already a worker secret, and deploys keep it.
      - name: Deploy apps/dummy-petshop
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project dummy-petshop --config prd -- pnpm --dir apps/dummy-petshop run-script deploy
      - name: Smoke the shop index
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --output /dev/null https://dummy-petshop.iterate.workers.dev/
