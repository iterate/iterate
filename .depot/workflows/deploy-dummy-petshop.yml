name: Deploy dummy-petshop
permissions:
  contents: read
concurrency:
  group: deploy-dummy-petshop-production
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/deploy-dummy-petshop.yml
      - apps/dummy-petshop/**
      - packages/shared/**
      - envs.ts
      - scripts/lib/**
      - pnpm-lock.yaml
  workflow_dispatch:
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      # envs.ts names the worker and the prd account; Doppler supplies the Cloudflare credentials.
      # PETSHOP_SEAL_KEY is already a worker secret, and deploys keep it. The deploy script ends by
      # smoking the shop's index and its state object.
      - name: Deploy apps/dummy-petshop
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm --dir apps/dummy-petshop run-script deploy --env prd
