# Cloudflare Preview GC — the scheduled backstop for the preview resource
# lifecycle (see docs/preview-resource-gc.md). PR-close cleanup attempts a full
# destroy, but releases the environment lease even if destroy fails.
# Environment-manager's lifecycle state is the sole cleanup obligation; this
# sweep selects every non-empty environment without a live tenant, takes it
# under a NON-force lease (so it can never steal a live slot), destroys it, and
# releases the lease.
#
# No GitHub token is needed. Semaphore answers only whether it is safe to act.
# Every failed operation leaves the workflow red, and failed destroy remains
# visible in environment-manager for the next run.
#
# Depot registers automatic triggers when this file is on the default branch —
# branch-only changes to the `on:` block do not take effect until merged.
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN.

name: Cloudflare Preview GC (Depot CI)

on:
  # Hourly, offset off the top of the hour to avoid contending with deploys.
  # Abandoned and failed-cleanup stacks get another bounded attempt each hour.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would be destroyed without changing anything
        type: boolean
        default: false

concurrency:
  # Never run two sweeps at once; a run in progress wins (the next tick catches
  # anything it missed).
  group: cloudflare-preview-gc
  cancel-in-progress: false

jobs:
  gc:
    name: Preview / gc
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Run the sweep from the default branch so it always carries the
          # latest tooling, like cleanup does.
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Install Doppler CLI
        run: |-
          for i in 1 2 3; do curl -sfLS https://cli.doppler.com/install.sh | sh -s -- --no-package-manager && break; echo "Attempt $i failed, retrying in 5s..."; sleep 5; done
          doppler --version || { echo 'Failed to install Doppler CLI after 3 attempts'; exit 1; }
      - name: Preview / gc
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |-
          set -euo pipefail
          doppler run --project _shared --config prd -- pnpm preview gc \
            ${{ (github.event.inputs.dry-run == 'true') && '--dry-run' || '' }}
