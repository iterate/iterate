# Context sweep — nightly, against prd. Cloudflare's list of every context object that holds data,
# each asked who it is (scripts/ci/context-sweep.ts): a context of a project the control plane no
# longer holds is an orphan its project's deletion missed. REPORT-ONLY for now: the run lists the
# orphans in its log and destroys nothing; it goes red (and posts to #error-pulse) only when an
# object could not say who it is. Destroying them is `--destroy`, switched on once a few runs read
# right.
#
# Run it by hand: depot ci dispatch --org 0p91s0lz49 --repo iterate/iterate \
#   --workflow context-sweep.yml --ref main
#
# Secrets (depot ci secrets --org 0p91s0lz49): DOPPLER_TOKEN.

name: Context sweep
permissions:
  contents: read
on:
  # Nightly, off the hour (deploys land at :00, the DO probe at :41, the crash hunt at 03:17).
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch: {}
concurrency:
  group: context-sweep
  cancel-in-progress: false
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
jobs:
  sweep:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.sha }}
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Sweep prd's contexts (report-only)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project os --config prd -- pnpm tsx scripts/ci/context-sweep.ts
  notify:
    needs:
      - sweep
    if: always() && needs.sweep.result == 'failure'
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Notify Slack
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: pnpm tsx scripts/ci/notify.ts workflow-failure
