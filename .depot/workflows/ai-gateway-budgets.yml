name: AI Gateway budgets
permissions:
  contents: read
# Account-wide settings have one writer, independent of preview deploys.
concurrency:
  group: ai-gateway-budgets
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - .depot/workflows/ai-gateway-budgets.yml
      - apps/os/scripts/ai-gateway-budgets.ts
  workflow_dispatch: {}
jobs:
  reconcile:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Reconcile development account
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm --dir apps/os ai-gateway-budgets --env preview_1 --apply true
      - name: Reconcile production account
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm --dir apps/os ai-gateway-budgets --env prd --apply true
