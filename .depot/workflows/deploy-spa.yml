name: Deploy SPA and Chrome extension
permissions:
  contents: read
concurrency:
  group: deploy-spa-production
  cancel-in-progress: false
on:
  push:
    branches: [main]
    # No root manifests or lockfile: what ships is public/ and the zipped extension, and a bump of
    # the extension's one npm dependency, capnweb, ships with the next deploy rather than its own.
    paths:
      - .depot/workflows/deploy-spa.yml
      - apps/spa/**
      - apps/browser-extension/**
      - envs.ts
      - scripts/lib/**
  workflow_dispatch:
env:
  # The image's baked store: dependencies.mjs fingerprints it (docs/depot-ci.md#custom-image)
  PNPM_CONFIG_STORE_DIR: /home/runner/.pnpm-store
jobs:
  deploy:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: node scripts/depot-ci/dependencies.mjs install
      - name: Deploy static assets and versioned extension bundle
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm --dir apps/spa run-script deploy --env prd
