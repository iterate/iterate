name: Deploy SPA and Chrome extension
permissions:
  contents: read
concurrency:
  group: deploy-spa-production
  cancel-in-progress: false
on:
  push:
    branches: [main]
    # No root manifests or lockfile: what ships is public/ and the zipped extension, and a bump of
    # the extension's one npm dependency, capnweb, ships with the next deploy rather than its own.
    paths:
      - .depot/workflows/deploy-spa.yml
      - apps/spa/**
      - apps/browser-extension/**
      - envs.ts
      - scripts/lib/**
  # `env=preview` deploys the dispatched ref to envs.ts spaEnvs.preview, to prove a branch; a push
  # deploys prd.
  workflow_dispatch:
    inputs:
      env:
        description: prd | preview (envs.ts spaEnvs)
        required: false
        type: string
        default: prd
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      - name: Deploy static assets and versioned extension bundle
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SPA_ENV: ${{ inputs.env || 'prd' }}
        run: pnpm --dir apps/spa run-script deploy --env "$SPA_ENV"
