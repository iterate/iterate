name: Deploy Docs
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same production Worker. Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-docs-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-docs.yml
      - apps/docs/**
      - envs.ts
      - scripts/lib/**
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
      - packages/workspace-documents/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    outputs:
      public_url: ${{ steps.metadata.outputs.public_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config prd --project docs
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - id: metadata
        name: Resolve Docs deploy URL
        run: echo "public_url=https://docs.iterate.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Deploy apps/docs
        working-directory: apps/docs
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy
  notify:
    needs:
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Notify Slack
        env:
          APP_DISPLAY_NAME: Docs
          PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ needs.deploy.result }}
