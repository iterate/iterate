name: Deploy Environment Manager
permissions:
  contents: read
concurrency:
  # The OS and auth workflows deploy this same singleton before applying an
  # environment, so all three workflows share one non-cancelling lock.
  group: deploy-environment-manager
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-env-manager.yml
      - apps/env-manager/**
      - apps/auth-contract/**
      - envs.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/lib/**
      - packages/iterate/**
      - packages/shared/**
      - packages/ui/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (preview-account deployment credentials)
        run: doppler setup --config prd --project env-manager
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy apps/env-manager
        working-directory: apps/env-manager
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy
