name: Deploy Auth Dev Global
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same dev_global Worker. Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-auth-dev-global
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-auth.yml
      - apps/auth/**
      - envs.ts
      - apps/env-manager/cloudflare.config.ts
      - apps/env-manager/scripts/cli.ts
      - apps/env-manager/scripts/deploy.ts
      - apps/env-manager/src/alchemy/**
      - apps/env-manager/src/cloudflare-control-plane.ts
      - apps/env-manager/src/config.ts
      - apps/env-manager/src/env.ts
      - apps/env-manager/src/environment-durable-object.ts
      - apps/env-manager/src/environments.ts
      - apps/env-manager/src/state.ts
      - apps/env-manager/src/worker.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/lib/**
      - apps/auth-contract/**
      - packages/shared/**
      - packages/ui/**
      - patches/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy-dev-global:
    runs-on:
      size: 2x8
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Deploy environment-manager control plane
        working-directory: apps/env-manager
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project env-manager --config prd -- pnpm run-script deploy
      - name: Provision Cloudflare data resources
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm infra deploy --env dev_global
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config dev_global --project auth
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy apps/auth (dev-global)
        working-directory: apps/auth
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy
