name: Deploy Auth Dev Global
permissions:
  contents: read
  deployments: write
concurrency:
  group: auth-dev-global-${{ github.ref_name || 'dev_global' }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-auth.yml
      - apps/auth/**
      - envs.ts
      - scripts/lib/**
      - apps/auth-contract/**
      - packages/shared/**
      - packages/ui/**
      - patches/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty for the current branch or commit.
        required: false
        type: string
        default: ""
jobs:
  deploy-dev-global:
    runs-on:
      size: 8x32
      image: 0p91s0lz49.registry.depot.dev/iterate-preview-ci:node24-pnpm10-worktree
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Reconcile dependencies (baked)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Doppler (baked CLI)
        run: doppler setup --config dev_global --project auth
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy apps/auth (dev-global)
        working-directory: apps/auth
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- pnpm run-script deploy
