name: Deploy Agents
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same production Worker. Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-agents-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-agents.yml
      - apps/agents/**
      - envs.ts
      - scripts/lib/**
      - configs/**
      # the UI reads the agents' contract and parser and installs the package; its scripts drive voice
      - packages/agents/**
      - packages/voice/**
      - packages/iterate/**
      - packages/ui/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      - name: Deploy apps/agents
        id: deploy
        working-directory: apps/agents
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project agents --config prd -- pnpm run-script deploy
      # The deploy's own result to #ci, a failed, cancelled or timed-out deploy included
      # (deploy-os.yml says why `always()`).
      - name: Notify Slack
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: Agents
          PUBLIC_URL: https://agents.iterate.com
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
