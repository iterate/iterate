name: Deploy Dash
permissions:
  contents: read
  deployments: write
concurrency:
  # Every ref deploys to the same production Worker. Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-dash-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-dash.yml
      - apps/dash/**
      - envs.ts
      - scripts/lib/**
      - packages/iterate/**
      # the dash renders packages/ui (the context view, the app shell); a change there is a dash change
      - packages/ui/**
      - packages/shared/**
      # the secrets page types `itx.agents` from the agents app's package
      - packages/agents/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      - name: Deploy apps/dash
        id: deploy
        working-directory: apps/dash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project dash --config prd -- pnpm run-script deploy
      # The deploy's own result to #ci, a failed, cancelled or timed-out deploy included
      # (deploy-os.yml says why `always()`).
      - name: Notify Slack
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: Dash
          PUBLIC_URL: https://dash.iterate.com
        run: pnpm tsx scripts/ci/notify.ts deploy-${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
