name: Deploy Dash
permissions:
  contents: read
concurrency:
  # Every ref deploys to the same production Worker. Never interrupt a
  # credentialed deployment midway through its rollout.
  group: deploy-dash-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - .depot/workflows/deploy-dash.yml
      - apps/dash/**
      - envs.ts
      - scripts/lib/**
      - core/lib/**
      # the dash renders packages/ui (the context view, the app shell); a change there is a dash change
      - packages/ui/**
      - packages/shared/**
      # the secrets page types `itx.agents` from the agents app's package
      - packages/agents/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # a production deploy never reads Depot Cache (docs/depot-ci.md#depot-cache)
          pnpm-store: none
      - name: Deploy apps/dash
        id: deploy
        working-directory: apps/dash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: pnpm run-script deploy --env prd
      # The deploy's own post (scripts/ci/notify.ts; deploy-os.yml says when each runs).
      - name: Post the deploy's line
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_DISPLAY_NAME: Dash
        run: node scripts/ci/notify.ts deploy-success
      - name: Page the failed deploy
        if: ${{ always() && (steps.deploy.outcome != 'success') && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_DISPLAY_NAME: Dash
          UPLOADED: ${{ steps.deploy.outcome }}
        run: node scripts/ci/notify.ts deploy-failure
