# THE FLAKE DASHBOARD (scripts/ci/flake-dashboard/update.ts): recomputes its GitHub issue every hour from
# the flake records and suite summaries that CI's test runs keep in R2 (docs/test-evidence.md), and
# rewrites the issue when its body changed. Nothing is kept between runs. A dispatch with
# dry-run=true prints the body in the log and writes nothing.
#
# The issue is written as the iterate GitHub App (iterate[bot]; the writer says how). The App's id and
# key have one home, the platform's configuration (Doppler os/prd's APP_CONFIG), which this
# workflow reads on a schedule or a dispatch only, never on pull_request or push.
name: Flake dashboard
permissions:
  contents: read
on:
  schedule:
    # Hourly, off the top of the hour and the alarms' minutes (:07/:22/:37/:52, :41).
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: true = print the body in the log instead of writing the issue
        required: false
        type: string
        default: "false"
concurrency:
  group: flake-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.depot/actions/setup
      # The script reads the bucket's Cloudflare API token and prd's configuration from Doppler
      # itself (scripts/ci/flake-dashboard/update.ts).
      - name: Recompute the dashboard issue
        run: node scripts/ci/flake-dashboard/update.ts ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
