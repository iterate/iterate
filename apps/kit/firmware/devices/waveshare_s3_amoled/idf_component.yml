dependencies:
  # The board's own BSP: SH8601 QSPI panel, FT3168 touch behind its TCA9554
  # expander. Its manifest also drags in esp_lvgl_port + LVGL, but nothing
  # here calls them any more (the UI draws with esp_lcd directly), so the
  # linker garbage-collects the whole ~278 KB archive out of the image.
  # 2.0.0 is the last BSP release that drives the SH8601: 2.0.1 and later
  # initialise a CO5300 panel instead.
  waveshare/esp32_s3_touch_amoled_1_8: "==2.0.0"
  espressif/esp_codec_dev: "~1.5.6"
  idf: ">=6.1"
