<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iterate static SPA</title>
    <!-- No build: the one dependency, capnweb, comes from a CDN through a native import map. -->
    <script type="importmap">
      { "imports": { "@iterate-com/capnweb": "https://esm.sh/@iterate-com/capnweb@0.12.2" } }
    </script>
    <style>
      body {
        max-width: 640px;
        margin: 48px auto;
        padding: 0 24px;
        font:
          16px/1.6 system-ui,
          sans-serif;
        color: #263324;
        background: #f3f2ec;
      }
      h1 {
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      code {
        font-size: 0.9em;
        background: #e8e6dc;
        padding: 0 4px;
        border-radius: 3px;
      }
      button {
        font: inherit;
        cursor: pointer;
        padding: 6px 14px;
        border: 1px solid #263324;
        border-radius: 6px;
        background: #fff;
      }
      ul {
        padding-left: 20px;
      }
      li {
        margin: 8px 0;
      }
      .muted {
        color: #6b7565;
        font-size: 0.9em;
      }
      [role="alert"] {
        color: #8a2a1e;
      }
    </style>
  </head>
  <body>
    <main id="app"><p class="muted">Loading…</p></main>
    <p><a href="/downloads/">Get the Chrome extension</a></p>
    <script type="module" src="./app.js"></script>
  </body>
</html>
